/* ==========================================================================
 * 풍년 게임 진행 키트 (JE.kit)  v1.0
 * - src.html 에 <!--KIT--> 자리가 있으면 build.py 가 엔진·디자인 뒤에 붙인다.
 * - 들어 있는 것
 *   1) 광고: 블록 블라스트식. 하트 없음, 보상형 이어하기 한 판 1번,
 *      전면광고는 '한 판 더'를 누를 때만 3판마다(2분 간격), 배너는 홈·결과에서만.
 *   2) 흐름: 홈 → 시작 → (실패 → 이어하기?) → 결과 → 한 판 더 / 랭킹 / 처음으로
 *   3) 연출: 큰 팝 글자, 색종이, 화면 번쩍
 *   4) HUD: 진녹색 띠 + BEST · 점수 · 일시정지 (풍년 공통)
 * ========================================================================== */
(function () {
  'use strict';
  const JE = window.JE, B = JE.brand, C = B.C;
  const K = {}; JE.kit = K;
  const rnd = (a, b) => a + Math.random() * (b - a);
  K.rnd = rnd;

  /* ---------------- 1. 광고 ---------------- */
  K.AD = { EVERY: 3, MIN_GAP: 120 };
  K.ad = { games: 0, lastInter: 0 };
  K.interDue = () => K.ad.games >= K.AD.EVERY && K.ad.games % K.AD.EVERY === 0 && (Date.now() - K.ad.lastInter) / 1000 >= K.AD.MIN_GAP;
  K.showInter = function () {
    K.ad.lastInter = Date.now();
    const AIT = window.__AIT__;
    if (AIT && AIT.showInterstitialAd) return Promise.resolve(AIT.showInterstitialAd()).catch(() => {});
    return new Promise(res => {
      let left = 2, timer;
      const m = JE.ui.modal('<span class="je-tag">광고 목업</span><h2>전면 광고</h2><p>실제 앱에서는 판 사이에 여기서 광고가 나와요.</p><div class="je-big" id="pk-ad-c">2</div>',
        [{ label: '닫기', cls: 'ghost', onClick: () => { clearInterval(timer); res(); } }]);
      timer = setInterval(() => { left--; const el = m.el.querySelector('#pk-ad-c'); if (el) el.textContent = left; if (left <= 0) { clearInterval(timer); m.close(); res(); } }, 1000);
    });
  };
  let bannerEl = null;
  K.banner = function (on) {
    document.body.classList.toggle('pk-has-banner', on);
    const AIT = window.__AIT__;
    if (AIT && AIT.showBanner) { try { on ? AIT.showBanner() : AIT.hideBanner(); } catch (e) {} return; }
    if (!bannerEl) {
      const s = document.createElement('style');
      s.textContent = `.pk-banner{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--sab,0px) + 8px);width:min(360px,calc(100% - 24px));height:56px;border-radius:12px;background:${C.dark};border:2px dashed rgba(255,255,255,.25);color:${C.sub};font:700 12px ${JE.FONT};display:none;align-items:center;justify-content:center;z-index:70;pointer-events:none}
      .pk-banner.on{display:flex} body.pk-has-banner .je-ov{padding-bottom:calc(var(--sab,0px) + 76px)!important}`;
      document.head.appendChild(s);
      bannerEl = document.createElement('div'); bannerEl.className = 'pk-banner'; bannerEl.textContent = '배너 광고 자리 (홈·결과 화면에서만)';
      document.body.appendChild(bannerEl);
    }
    bannerEl.classList.toggle('on', on);
  };

  /* ---------------- 2. 흐름 ----------------
   * o = { title, desc, colors, onHome(), onStart(), onRevive(), continueDesc,
   *       score(), stats() -> [[라벨,값]], tip(), grade() -> {g,col}, resultTitle }
   * 게임은 F.state 를 보고 플레이 중인지 판단한다 ('play' 일 때만 진행) */
  K.flow = function (o) {
    const F = { state: 'home', continued: false, o };
    F.home = function () {
      F.state = 'home'; o.onHome && o.onHome();
      const btns = [{ label: '시작하기', onClick: () => F.start() }];
      if (o.homeButtons) btns.push(...o.homeButtons(F));
      btns.push({ label: '랭킹 보기', cls: 'ghost', onClick: () => F.rank() });
      const hm = JE.ui.modal(B.homeHTML({ title: o.title, desc: o.desc, best: JE.best.get('main'), colors: o.colors || B.JELLY.slice(0, 5), extra: K.meta.homeExtra() }), btns);
      K.meta.bind(hm, F);
      K.banner(true);
    };
    K.meta.setup(o);
    F.start = function (arg) {
      K.banner(false); K.ad.games++; F.continued = false; F.state = 'play';
      K.clearFx(); JE.sfx.ready(); o.onStart(arg);
    };
    F.again = async function () { if (K.interDue()) await K.showInter(); F.start(); };
    F.pause = function () {
      if (F.state !== 'play') return;
      F.state = 'pause'; o.onPause && o.onPause();
      JE.ui.modal('<h2>일시정지</h2><p>잠깐 쉬어 가요.</p>', [
        { label: '계속하기', onClick: () => { F.state = 'play'; o.onResume && o.onResume(); } },
        { label: JE.audio.muted ? '소리 켜기' : '소리 끄기', cls: 'ghost', keepOpen: true, onClick: el => { el.textContent = JE.audio.toggle() ? '소리 켜기' : '소리 끄기'; } },
        JE.motion.button(),
        { label: '그만하기', cls: 'ghost', onClick: () => F.over() },
      ]);
    };
    /** 실패. delay 초 뒤에 이어하기 제안(한 판 1번) 또는 결과 */
    F.fail = function (title = '아쉬워요!', delay = 1.1) {
      if (F.state !== 'play') return;
      F.state = 'fail';
      JE.haptic('error'); JE.shake.add(8);
      setTimeout(() => {
        if (!F.continued && o.onRevive) {
          JE.ui.modal(`<h2>${title}</h2><div class="je-big">${Math.round(o.score()).toLocaleString()}</div><p>${o.continueDesc || '광고를 보면 이어서 할 수 있어요.'}<br>(한 판에 1번)</p>`, [
            { label: '광고 보고 이어하기', cls: 'ad', onClick: async () => { if (await JE.ads.rewarded('continue')) { F.continued = true; F.state = 'play'; JE.sfx.coin(); o.onRevive(); } else F.over(); } },
            { label: '결과 보기', cls: 'ghost', onClick: () => F.over() },
          ]);
        } else F.over();
      }, delay * 1000);
    };
    F.over = function () {
      F.state = 'over'; o.onOver && o.onOver();
      const s = Math.round(o.score()), prev = JE.best.get('main');
      const isNew = s > 0 && JE.best.submit(s, 'main');
      if (isNew) { JE.sfx.fanfare(); JE.haptic('success'); K.confetti(80); } else JE.sfx.over();
      K.banner(true);
      const mdone = K.meta.endRun(o.missionStats ? o.missionStats() : {}, s);
      const rm = JE.ui.modal(B.resultHTML({ title: o.resultTitle ? o.resultTitle() : '결과', isNew, grade: o.grade ? o.grade(s) : null, score: s, best: prev, tip: o.tip ? o.tip() : '', stats: o.stats ? o.stats() : [] }) + K.meta.resultExtra(mdone), [
        { label: K.interDue() ? '한 판 더 <small style="opacity:.7">(광고 후 시작)</small>' : '한 판 더', onClick: () => F.again() },
        { label: '랭킹 보기', cls: 'ghost', onClick: () => F.rank() },
        { label: '처음으로', cls: 'ghost', onClick: () => F.home() },
      ]);
      K.meta.bind(rm, F);
    };
    F.rank = async function () {
      K.banner(false);
      try { await JE.sdk.openLeaderboard('main'); } catch (e) { await JE.ui.leaderboard('main'); }
      F.home();
    };
    F.playing = () => F.state === 'play';
    return F;
  };

  /* ---------------- 2-1. 오늘의 미션 · 연속 출석 · 모어게임 (11-22 추가) ----------------
   * 일일 미션·연속 출석·자사 게임 목록은 캐주얼 게임에서 흔한 공통 기능(특정 게임 참고 표기 안 함, 법률 검토 11-22)
   * 게임은 K.flow 옵션에
   *   missions: [{ k:'chain', t:'한 판에 연쇄 {n}번', goals:[2,3,4], mode:'run'|'day' }, ...]  (mode 기본 'run' = 한 판 최고, 'day' = 오늘 합계)
   *   scoreGoals: [쉬움, 보통, 어려움]  (한 판 점수 미션 목표)
   *   missionStats: () => ({ chain: 3, ... })   판이 끝날 때 값
   * 을 넣으면 된다. K.flow 를 안 쓰는 게임은 K.meta.setup / homeExtra / resultExtra / endRun / bind 를 직접 부른다.
   * 미션 보상은 '도장'(3개 다 하면 오늘 도장 1개 → 연속 출석). 점수에는 영향 없음(랭킹 공정). */
  K.GAMES = [
    { id: 'jellystack', name: '젤리풍', d: '톡! 말랑 젤리 탑 쌓기', c: [3, 0, 4], url: '../jellystack/' },
    { id: 'blockpung', name: '블락풍', d: '젤리 블록 끼워 줄 지우기', c: [5, 2, 0], url: '../blockpung/' },
    { id: 'hapchyeoten', name: '열풍', d: '이어서 합이 10이면 톡', c: [1, 3, 2], url: '../hapchyeoten/' },
    { id: 'ddeokpung', name: '떡풍', d: '떨어뜨려 떡 합체', c: [2, 1, 0], url: '../ddeokpung/' },
    { id: 'dotpung', name: '도트풍', d: '젤리 슈터로 도트 그림 지우기', c: [0, 4, 2], url: '../dotpung/' },
    { id: 'bangulpung', name: '방울풍', d: '쏘아서 같은 색 방울 펑', c: [0, 4, 3], url: '../bangulpung/' },
    { id: 'taengtaengpung', name: '탱탱풍', d: '공을 줄줄이 쏴서 블록 깨기', c: [5, 0, 1], url: '../taengtaengpung/' },
    { id: 'jumppung', name: '점프풍', d: '톡 한 칸, 꾹 두 칸 점프', c: [4, 2, 0], url: '../jumppung/' },
    { id: 'miklpung', name: '미끌풍', d: '밀어서 떨어뜨려 줄 채우기', c: [5, 4, 0], url: '../miklpung/' },
    { id: 'omokpung', name: '오목풍', d: '컴퓨터 젤리와 오목 한 판', c: [0, 5, 2], url: '../omokpung/' },
  ];
  const M = K.meta = { cfg: null };
  const dayNum = d => Math.floor((Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())) / 864e5);
  const today = () => dayNum(new Date());
  const hash = s => { let h = 2166136261; for (const ch of String(s)) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; };
  M.isWeekend = () => { const w = new Date().getDay(); return w === 0 || w === 6; };
  M.setup = function (o) {
    const sg = o.scoreGoals || [300, 1000, 3000];
    M.cfg = { pool: [{ k: 'plays', t: '오늘 {n}판 하기', goals: [3, 4, 5], mode: 'day' }, { k: 'score', t: '한 판에 {n}점', goals: sg, mode: 'run' }].concat(o.missions || []) };
  };
  M.pick = function (rng, used, slot) {
    let left = M.cfg.pool.filter(p => !used.includes(p.k)); if (!left.length) left = M.cfg.pool;
    const p = left[Math.floor(rng() * left.length)];
    const n = p.goals[Math.min(slot, p.goals.length - 1)];
    return { k: p.k, n, v: 0, done: false, rr: false, t: p.t.replace('{n}', Number(n).toLocaleString()), mode: p.mode || 'run' };
  };
  M.load = function () {
    if (!M.cfg) M.setup({});
    let d = JE.store.get('meta', null);
    const t = today();
    if (!d) d = { day: -1, list: [], streak: 0, lastDone: -99, stamps: [], allDone: false };
    if (d.day !== t) {
      const rng = JE.rng(hash((JE.gameId || '') + t)), list = [];
      for (let i = 0; i < 3; i++) list.push(M.pick(rng, list.map(x => x.k), i));
      if (M.isWeekend()) { const b = M.pick(rng, list.map(x => x.k), 2); b.bonus = true; list.push(b); }
      d.day = t; d.list = list; d.allDone = false;
      if (d.lastDone < t - 1) d.streak = 0; // 하루 빠지면 연속 끊김
    }
    M.d = d; return d;
  };
  M.save = () => JE.store.set('meta', M.d);
  M.main = () => M.d.list.filter(m => !m.bonus);
  M.doneCount = () => M.main().filter(m => m.done).length;
  /** 판이 끝날 때. 반환: 이번에 새로 끝낸 미션들 + 오늘 도장 받았는지 */
  M.endRun = function (stats, score) {
    M.load();
    const st = Object.assign({ plays: 1, score: score || 0 }, stats || {});
    const newly = [];
    for (const m of M.d.list) {
      if (m.done) continue;
      const v = Number(st[m.k]) || 0;
      m.v = m.mode === 'day' ? m.v + v : Math.max(m.v, v);
      if (m.v >= m.n) { m.v = m.n; m.done = true; newly.push(m); }
    }
    let stamp = false;
    if (!M.d.allDone && M.main().every(m => m.done)) {
      M.d.allDone = true; stamp = true;
      M.d.streak = M.d.lastDone === M.d.day - 1 ? M.d.streak + 1 : 1;
      M.d.lastDone = M.d.day;
      M.d.stamps = (M.d.stamps || []).filter(x => x > M.d.day - 30).concat(M.d.day);
    }
    M.save();
    if (newly.length) setTimeout(() => { JE.sfx.coin(); JE.haptic('success'); if (stamp) { K.confetti(60); JE.sfx.fanfare(); } }, 450);
    return { newly, stamp };
  };
  M.css = function () {
    if (M._css) return; M._css = 1;
    const s = document.createElement('style');
    s.textContent = `.pk-row{display:flex;gap:8px;margin:12px 0 2px}.pk-row button{flex:1;min-height:44px;border:3px solid ${C.deep};border-radius:14px;background:rgba(0,0,0,.22);color:#fff;font:800 14px ${JE.FONT};box-shadow:0 3px 0 ${C.deep};cursor:pointer}
    .pk-row button:active{transform:translateY(3px);box-shadow:none}.pk-row b{color:${C.gold}}
    .pk-mis{list-style:none;margin:10px 0;padding:0;text-align:left}.pk-mis li{background:rgba(0,0,0,.2);border-radius:12px;padding:9px 11px;margin:6px 0;font:700 14px ${JE.FONT};color:#fff}
    .pk-mis .bar{height:7px;border-radius:4px;background:rgba(255,255,255,.12);margin-top:6px;overflow:hidden}.pk-mis .bar i{display:block;height:100%;background:linear-gradient(90deg,#8fdc4a,#36d6a0);border-radius:4px}
    .pk-mis li.done{background:rgba(143,220,74,.18)}.pk-mis li.new{outline:2px solid ${C.gold};animation:pkpop .5s}.pk-mis .r{float:right;color:${C.sub};font-size:12px}.pk-mis li.done .r{color:#8fdc4a}
    .pk-mis .bonus{font-size:11px;background:${C.gold};color:${C.ink};border-radius:6px;padding:1px 5px;margin-right:5px}
    .pk-mis .rr{float:right;margin:-3px 0 0 6px;border:0;border-radius:8px;background:#3ec5ff;color:${C.ink};font:900 11px ${JE.FONT};padding:4px 7px;min-height:26px;cursor:pointer}
    .pk-stamps{display:flex;justify-content:center;gap:6px;margin:8px 0}.pk-stamps span{width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;font:900 11px ${JE.FONT};color:${C.sub}}
    .pk-stamps span.on{background:radial-gradient(circle at 35% 30%,#fff3b0,#ffd23f 55%,#c49a00);color:${C.ink}}
    .pk-games{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}.pk-games a{display:block;text-decoration:none;background:rgba(0,0,0,.22);border:2px solid ${C.deep};border-radius:14px;padding:10px 8px;color:#fff;text-align:center;min-height:44px}
    .pk-games a:active{transform:scale(.97)}.pk-games .dots{display:flex;justify-content:center;gap:3px;margin-bottom:5px}.pk-games .dots i{width:16px;height:16px;border-radius:50%;display:block}
    .pk-games b{display:block;font:900 16px ${JE.FONT}}.pk-games small{word-break:keep-all;display:block;font:700 11px ${JE.FONT};color:${C.sub};margin-top:2px;line-height:1.3}
    .pk-note{word-break:keep-all;font-size:12px!important;color:${C.sub}!important;margin:4px 0!important}
    @keyframes pkpop{0%{transform:scale(.9)}60%{transform:scale(1.04)}100%{transform:scale(1)}}`;
    document.head.appendChild(s);
  };
  const misLI = (m, o = {}) => `<li class="${m.done ? 'done' : ''}${o.isNew ? ' new' : ''}">${m.bonus ? '<span class="bonus">주말</span>' : ''}${m.t}
      ${o.reroll && !m.done && !m.rr ? `<button class="rr" data-rr="${o.i}">AD 바꾸기</button>` : ''}<span class="r">${m.done ? '완료!' : `${Number(m.v).toLocaleString()} / ${Number(m.n).toLocaleString()}`}</span>
      <div class="bar"><i style="width:${Math.min(100, m.v / m.n * 100)}%"></i></div></li>`;
  M.homeExtra = function () {
    M.css(); M.load();
    return `<div class="pk-row"><button data-pk="mis">오늘의 미션 <b>${M.doneCount()}/3</b></button><button data-pk="games">다른 게임</button></div>
      ${M.d.streak > 0 ? `<p class="pk-note">연속 출석 ${M.d.streak}일${M.d.allDone ? ' · 오늘 도장 완료' : ''}</p>` : ''}`;
  };
  M.resultExtra = function (r) {
    M.css();
    const isNew = m => r && r.newly.includes(m);
    return `<ul class="pk-mis">${M.d.list.map(m => misLI(m, { isNew: isNew(m) })).join('')}</ul>
      ${r && r.stamp ? `<p class="pg-tip">오늘의 미션 3개 완료! 도장 쾅 · 연속 ${M.d.streak}일</p>` : ''}
      <div class="pk-row"><button data-pk="games">풍년 게임 더보기</button></div>`;
  };
  M.stampsHTML = function () {
    const t = M.d.day, set = new Set(M.d.stamps || []), names = ['일', '월', '화', '수', '목', '금', '토'];
    let h = '';
    for (let i = 6; i >= 0; i--) { const d = t - i, w = names[new Date(d * 864e5).getUTCDay()]; h += `<span class="${set.has(d) ? 'on' : ''}">${i === 0 ? '오늘' : w}</span>`; }
    return `<div class="pk-stamps">${h}</div>`;
  };
  M.openMissions = function () {
    M.css(); M.load();
    const body = () => `<h2>오늘의 미션</h2><p class="pk-note">3개를 다 하면 오늘 도장! 매일 자정에 바뀌어요.${M.isWeekend() ? '<br>주말엔 보너스 미션이 하나 더 있어요.' : ''}</p>
      <ul class="pk-mis">${M.d.list.map((m, i) => misLI(m, { reroll: true, i })).join('')}</ul>
      ${M.stampsHTML()}<p class="pk-note">연속 출석 <b style="color:${C.gold}">${M.d.streak}일</b> · 미션은 한 개씩 하루 1번 광고 보고 바꿀 수 있어요.</p>`;
    const m = JE.ui.modal(body(), [{ label: '닫기', cls: 'ghost' }]);
    const wire = () => m.el.querySelectorAll('[data-rr]').forEach(b => b.onclick = async e => {
      e.stopPropagation();
      const i = +b.dataset.rr, cur = M.d.list[i];
      if (!(await JE.ads.rewarded('mission'))) return;
      const nm = M.pick(Math.random, M.d.list.map(x => x.k), Math.min(i, 2)); nm.rr = true; nm.bonus = cur.bonus;
      M.d.list[i] = nm; M.save();
      const btn = m.el.querySelector('.je-btn'); m.el.innerHTML = body(); m.el.appendChild(btn); wire();
      JE.sfx.coin();
    });
    wire();
  };
  M.openGames = function () {
    M.css();
    const list = K.GAMES.filter(g => g.id !== JE.gameId);
    const card = g => `<a href="${g.url}" target="_blank" rel="noopener" data-g="${g.id}"><span class="dots">${g.c.map(i => `<i style="background:radial-gradient(circle at 35% 30%,${JE.shade(B.JELLY[i], 0.4)},${B.JELLY[i]} 60%)"></i>`).join('')}</span><b>${g.name}</b><small>${g.d}</small></a>`;
    const m = JE.ui.modal(`<h2>풍년 게임 더보기</h2><p class="pk-note">풍년 낙서공방의 다른 게임이에요. 누르면 바로 열려요.</p><div class="pk-games">${list.map(card).join('')}</div>`, [{ label: '닫기', cls: 'ghost' }]);
    m.el.querySelectorAll('[data-g]').forEach(a => a.addEventListener('click', e => {
      JE.sfx.tap();
      const AIT = window.__AIT__, g = K.GAMES.find(x => x.id === a.dataset.g);
      if (AIT && AIT.openGame) { e.preventDefault(); try { AIT.openGame(g.id, g.name); } catch (er) {} } // 스토어 앱: 그 게임의 스토어 페이지 열기 (native-bridge.js)
    }));
  };
  M.bind = function (modal) {
    if (!modal || !modal.el) return;
    modal.el.querySelectorAll('[data-pk]').forEach(b => b.onclick = e => {
      e.stopPropagation(); JE.sfx.tap();
      if (b.dataset.pk === 'mis') {
        M.openMissions();
        // 홈 버튼 숫자 갱신 (미션을 바꿨을 수 있음)
      } else M.openGames();
    });
  };

  /* ---------------- 3. HUD ---------------- */
  K.rowY = () => JE.safe.top + 40;
  K.bandH = () => JE.safe.top + 88;
  /** 띠 + BEST·점수·일시정지. 반환: 일시정지 터치 영역 */
  K.hud = function (c, score, best, bandH = K.bandH()) {
    B.hudBand(c, bandH);
    return B.hudRow(c, K.rowY(), score, best);
  };
  K.hit = (r, p, pad = 8) => p.x >= r.x - pad && p.x <= r.x + r.w + pad && p.y >= r.y - pad && p.y <= r.y + r.h + pad;
  /** 두 번째 줄 알약들: [{t, fg}] 가운데 정렬 */
  K.badges = function (c, list, y) {
    c.font = B.font(12, 800); c.textBaseline = 'middle';
    const ws = list.map(b => c.measureText(b.t).width + 24), tot = ws.reduce((a, x) => a + x, 0) + (list.length - 1) * 8;
    let bx = JE.W / 2 - tot / 2;
    const SK = JE.sketch;
    list.forEach((b, i) => { if (SK) { c.fillStyle = '#fffdf6'; JE.roundRect(c, bx, y, ws[i], 22, 11); c.fill(); c.lineWidth = 1.5; c.strokeStyle = C.ink; c.stroke(); } else { c.fillStyle = 'rgba(255,255,255,.08)'; JE.roundRect(c, bx, y, ws[i], 22, 11); c.fill(); } c.fillStyle = SK ? SK.inkOf(b.fg || '#fff') : (b.fg || '#fff'); c.textAlign = 'center'; c.fillText(b.t, bx + ws[i] / 2, y + 11.5); bx += ws[i] + 8; });
  };

  /* ---------------- 4. 연출 (엔진 JE.fx 에 붙어서 자동으로 그려짐) ---------------- */
  const FX = K.FX = { pops: [], conf: [], flash: 0, flashCol: '255,255,255' };
  K.clearFx = () => { FX.pops = []; FX.conf = []; FX.flash = 0; JE.fx.parts = []; JE.fx.texts = []; JE.fx.rings = []; };
  /** 큰 팝 글자 (굵은 외곽선 + 위→아래 그라데이션) */
  K.pop = function (text, x, y, o = {}) {
    FX.pops.push({ text, x, y, size: o.size || 34, c1: o.c1 || '#fff6b0', c2: o.c2 || '#ffb21f', life: o.life || 1.0, t: -(o.delay || 0), rise: o.rise != null ? o.rise : 40 });
  };
  K.confetti = function (n = 60) { for (let i = 0; i < n; i++) FX.conf.push({ x: rnd(0, JE.W), y: rnd(-80, -10), vx: rnd(-60, 60), vy: rnd(120, 320), w: rnd(6, 11), h: rnd(10, 18), col: B.JELLY[i % 6], t: 0, life: rnd(1.6, 2.4), spin: rnd(-10, 10), a: rnd(0, 6) }); };
  K.flash = function (a = 0.4, rgb = '255,255,255') { a = JE.motion.k(a); if (a >= FX.flash) { FX.flash = a; FX.flashCol = rgb; } };
  const fu = JE.fx.update.bind(JE.fx), fr = JE.fx.render.bind(JE.fx);
  JE.fx.update = function (dt) {
    fu(dt);
    FX.pops = FX.pops.filter(p => (p.t += dt) < p.life);
    FX.conf = FX.conf.filter(p => { p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.a += p.spin * dt; return p.t < p.life; });
    FX.flash = Math.max(0, FX.flash - dt * 2.2);
  };
  JE.fx.render = function (c) {
    fr(c);
    for (const p of FX.conf) { c.save(); c.globalAlpha = Math.min(1, (p.life - p.t) * 2); c.translate(p.x, p.y); c.rotate(p.a); c.fillStyle = p.col; c.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); c.restore(); }
    for (const p of FX.pops) {
      if (p.t < 0) continue;
      const k = p.t / p.life, s = k < 0.18 ? JE.ease.outBack(k / 0.18) : 1;
      c.save(); c.globalAlpha = k > 0.7 ? 1 - (k - 0.7) / 0.3 : 1;
      c.translate(p.x, p.y - JE.ease.outCubic(k) * p.rise); c.scale(s, s);
      c.font = B.font(p.size); c.textAlign = 'center'; c.textBaseline = 'middle'; c.lineJoin = 'round';
      c.lineWidth = p.size * 0.22; c.strokeStyle = C.ink; c.strokeText(p.text, 0, 0);
      const g = c.createLinearGradient(0, -p.size / 2, 0, p.size / 2); g.addColorStop(0, p.c1); g.addColorStop(1, p.c2);
      c.fillStyle = g; c.fillText(p.text, 0, 0); c.restore();
    }
    if (FX.flash > 0) { c.fillStyle = `rgba(${FX.flashCol},${FX.flash * 0.45})`; c.fillRect(0, 0, JE.W, JE.H); }
  };

  /* ---------------- 5. 그림 도우미 ---------------- */
  /** 얼굴 있는 젤리 한 개 (cx, cy 가운데) */
  K.jellyFace = function (c, cx, cy, w, h, col, o = {}) {
    JE.jelly(c, cx, cy, w, h, col, o);
    c.save(); c.translate(cx, cy + h * (1 - (o.sy || 1)) / 2); c.scale(o.sx || 1, o.sy || 1);
    B.face(c, w, h, o.mood || 'normal', o.blink == null ? 1 : o.blink); c.restore();
  };
  /** 하단 안내 글 */
  K.hint = function (c, text, y) { c.font = B.font(13, 700); c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = C.sub; c.fillText(text, JE.W / 2, y); };
  /** 숫자 표시용 부드러운 따라가기 */
  K.ease = (cur, target, dt, k = 10) => cur + (target - cur) * Math.min(1, dt * k);
})();

</script>
<script>
(function () {
'use strict';
const { clamp } = JE.util;
const COLS = 7, ROWS = 10;
const START_TIME = 60, MAX_TIME = 75, COMBO_WIN = 2.5, CONTINUE_SEC = 15;
// 터뜨리면 시간 보너스: 이은 칸당 0.5초 + 폭탄에 휩쓸린 칸당 0.2초 + 콤보 단계당 0.25초(최대 1초)
// 시간은 갈수록 빨리 줄어들어서(90초마다 1배씩 더) 보너스만으로 무한히 버티진 못함. 보통 2~4분 판
const T_PER_CELL = 0.5, T_PER_BLAST = 0.2, T_PER_COMBO = 0.25, T_COMBO_MAX = 1.0, DRAIN_RAMP = 90, BOMB_MIN = 5;
// 숫자별 젤리 색 = 풍년 공통 팔레트 (engine/pung-style.js)
const BJ = JE.brand.JELLY, BX = JE.brand.EXTRA;
const COLORS = ['', BJ[0], BJ[1], BJ[2], BJ[3], BX[0], BJ[4], BX[1], BJ[5], BX[2]];
const TILE_ART = ['', 'tile_a', 'tile_b', 'tile_c', 'tile_d', 'tile_h', 'tile_e', 'tile_f', 'tile_g', 'tile_k']; // 11-23 Gemini 손그림 테두리 (숫자는 코드가 씀)

const canvas = document.getElementById('c');
let L = {}; // 레이아웃
const G = { state: 'home', grid: [], score: 0, time: START_TIME, combo: 0, lastClear: -99, elapsed: 0, continued: false, mode: 'main', rng: Math.random, drag: null, idle: 0, hint: null, cleared: 0, bombs: 0, gaugeFlash: 0, scoreShown: 0, timeGained: 0 };

const hudRowY = () => JE.safe.top + 40; // 상단 한 줄(BEST · 점수 · 일시정지) 세로 중심
// 시간 게이지 자리 (오른쪽 끝엔 남은 초 숫자)
const gaugePos = () => { const s = JE.safe, x = 16 + s.left; return { x, y: hudRowY() + 52, w: JE.W - 32 - s.left - s.right - 46 }; };
function layout(W, H) {
  const s = JE.safe, top = s.top + 140, bottom = s.bottom + 58;
  const cell = Math.floor(Math.min((W - s.left - s.right - 20) / COLS, (H - top - bottom - 10) / ROWS));
  const bw = cell * COLS, bh = cell * ROWS;
  L = { cell, bx: Math.round((W - bw) / 2), by: Math.round(top + (H - top - bottom - bh) / 2), bw, bh, top, bottom };
}

/* ---------------- 보드 ---------------- */
function rndVal() {
  // 작은 숫자가 조금 더 자주: 조합을 만들기 쉬운 분포
  const w = [0, 14, 13, 12, 12, 11, 10, 10, 9, 9], tot = 100;
  let r = G.rng() * tot;
  for (let v = 1; v <= 9; v++) { r -= w[v]; if (r < 0) return v; }
  return 5;
}
function mkCell(v, fromY) { return { v, bomb: false, oy: fromY || 0, sq: { v: 1, vel: 0 }, pop: 0 }; }
function newBoard() {
  G.grid = [];
  for (let x = 0; x < COLS; x++) { G.grid[x] = []; for (let y = 0; y < ROWS; y++) G.grid[x][y] = mkCell(rndVal(), -(ROWS + 2) * L.cell - y * 8); }
  ensureSolvable([]);
  G.grid.forEach((col, x) => col.forEach((c, y) => JE.tweens.to(c, { oy: 0 }, 0.55 + y * 0.03, 'outBounce', x * 0.03)));
}
const adj = (a, b) => Math.max(Math.abs(a.x - b.x), Math.abs(a.y - b.y)) === 1;
function pathSum(path) { let s = 0; for (const p of path) { const c = G.grid[p.x][p.y]; if (c) s += c.v; } return s; }
// 이웃(상하좌우·대각선)으로 이어지는 칸 묶음 중 합이 10인 것 찾기. limit 개 모이면 멈춤
function findMove(limit = 40) {
  const moves = [], seen = new Set(), on = new Set();
  let budget = 30000;
  const path = [];
  function dfs(x, y, sum) {
    if (moves.length >= limit || budget-- <= 0) return;
    const c = G.grid[x][y]; if (!c) return;
    sum += c.v; if (sum > 10) return;
    path.push({ x, y }); on.add(x * 100 + y);
    if (sum === 10) {
      if (path.length >= 2) { const k = path.map(p => p.x * 100 + p.y).sort((m, n) => m - n).join(','); if (!seen.has(k)) { seen.add(k); moves.push(path.slice()); } }
    } else {
      for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++) {
        const nx = x + dx, ny = y + dy;
        if ((dx || dy) && nx >= 0 && ny >= 0 && nx < COLS && ny < ROWS && !on.has(nx * 100 + ny)) dfs(nx, ny, sum);
      }
    }
    path.pop(); on.delete(x * 100 + y);
  }
  for (let x = 0; x < COLS; x++) for (let y = 0; y < ROWS; y++) dfs(x, y, 0);
  return moves;
}
// 새로 들어온 칸만 바꿔서 항상 10 조합이 남게 보정
function ensureSolvable(fresh) {
  let guard = 0;
  while (findMove(4).length < 4 && guard++ < 40) {
    const pool = fresh.length ? fresh : G.grid.flat();
    const c = pool[Math.floor(G.rng() * pool.length)];
    c.v = rndVal();
  }
}

/* ---------------- 입력 ---------------- */
function cellAt(p, clampIt) {
  let x = Math.floor((p.x - L.bx) / L.cell), y = Math.floor((p.y - L.by) / L.cell);
  if (clampIt) return { x: clamp(x, 0, COLS - 1), y: clamp(y, 0, ROWS - 1) };
  if (x < 0 || y < 0 || x >= COLS || y >= ROWS) return null;
  return { x, y };
}
// 자유 선택: 손가락이 지나간 칸을 이어서 묶음(대각선 포함). 바로 전 칸으로 돌아가면 취소
function inSelSet() { const d = G.drag; return d ? new Set(d.path.map(p => p.x * 100 + p.y)) : null; }
function trace(px, py) {
  const d = G.drag, cx = Math.floor((px - L.bx) / L.cell), cy = Math.floor((py - L.by) / L.cell);
  if (cx < 0 || cy < 0 || cx >= COLS || cy >= ROWS) return;
  const cc = cellCenter(cx, cy);
  if (Math.hypot(px - cc.x, py - cc.y) > L.cell * 0.46) return; // 칸 가장자리는 무시 → 대각선 이동이 옆 칸에 걸리지 않음
  const path = d.path, last = path[path.length - 1];
  if (last.x === cx && last.y === cy) return;
  const prev = path[path.length - 2];
  if (prev && prev.x === cx && prev.y === cy) { path.pop(); JE.sfx.tap(); return onPathChange(); }
  if (path.some(p => p.x === cx && p.y === cy) || !adj(last, { x: cx, y: cy })) return;
  if (pathSum(path) > 10) return; // 이미 넘쳤으면 더 안 늘림 (되돌리기만)
  path.push({ x: cx, y: cy }); const c = G.grid[cx][cy]; if (c) c.sq.vel -= 2;
  onPathChange();
}
function onPathChange() {
  const d = G.drag, s = pathSum(d.path);
  if (s !== d.lastSum) {
    if (s === 10) { JE.sfx.ready(); JE.haptic('soft'); } else JE.sfx.select(Math.min(s, 12));
    d.lastSum = s;
  }
}
JE.input.on({
  down(p) {
    if (G.state !== 'play') return;
    const pr = JE.brand.pauseRect(hudRowY()), pp = 12;
    if (p.x > pr.x - pp && p.x < pr.x + pr.w + pp && p.y > pr.y - pp && p.y < pr.y + pr.h + pp) return pause();
    const pad = L.cell * 0.5;
    if (p.x < L.bx - pad || p.x > L.bx + L.bw + pad || p.y < L.by - pad || p.y > L.by + L.bh + pad) return;
    const c = cellAt(p, true);
    G.drag = { path: [c], qx: p.x, qy: p.y, lx: p.x, ly: p.y, lastSum: -1 };
    G.idle = 0; G.hint = null;
    onPathChange();
    JE.sfx.tap(); JE.haptic('tap');
  },
  move(p) {
    const d = G.drag; if (!d) return;
    // 빠르게 그어도 칸을 건너뛰지 않게 사이를 잘게 나눠 훑음
    const dist = Math.hypot(p.x - d.lx, p.y - d.ly), steps = Math.max(1, Math.ceil(dist / (L.cell * 0.2)));
    for (let i = 1; i <= steps; i++) trace(d.lx + (p.x - d.lx) * i / steps, d.ly + (p.y - d.ly) * i / steps);
    d.lx = d.qx = p.x; d.ly = d.qy = p.y;
  },
  up() {
    const d = G.drag; if (!d) return; G.drag = null;
    if (G.state !== 'play') return;
    const s = pathSum(d.path), n = d.path.length;
    if (s === 10 && n >= 2) clearCells(d.path);
    else if (n > 1) {
      JE.sfx.fail(); JE.haptic('error');
      for (const q of d.path) { const c = G.grid[q.x][q.y]; if (c) c.sq.vel -= 4; }
    }
  },
});

/* ---------------- 제거, 폭탄, 중력 ---------------- */
function cellCenter(x, y) { return { x: L.bx + (x + 0.5) * L.cell, y: L.by + (y + 0.5) * L.cell }; }
function clearCells(path) {
  const endCell = path[path.length - 1];
  const t = G.elapsed;
  G.combo = (t - G.lastClear <= COMBO_WIN) ? G.combo + 1 : 0; G.lastClear = t;
  const mult = Math.min(4, 1 + G.combo * 0.5);
  const kill = new Set(), key = (x, y) => x * 100 + y;
  let n = 0, bombHit = [];
  for (const { x, y } of path) { const c = G.grid[x][y]; if (c) { kill.add(key(x, y)); n++; if (c.bomb) bombHit.push({ x, y }); } }
  // 말랑폭탄: 3x3 연쇄
  let bi = 0;
  while (bi < bombHit.length) {
    const b = bombHit[bi++];
    for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++) {
      const x = b.x + dx, y = b.y + dy; if (x < 0 || y < 0 || x >= COLS || y >= ROWS) continue;
      const c = G.grid[x][y]; if (!c || kill.has(key(x, y))) continue;
      kill.add(key(x, y)); if (c.bomb) bombHit.push({ x, y });
    }
  }
  const total = kill.size;
  const gained = Math.round(total * 10 * mult);
  G.score += gained; G.cleared += total;
  const bonus = T_PER_CELL * n + T_PER_BLAST * (total - n) + Math.min(T_COMBO_MAX, T_PER_COMBO * G.combo);
  const room = MAX_TIME - G.time, add = Math.min(bonus, room);
  G.time += add; G.gaugeFlash = 1; G.timeGained += add;
  { const gp = gaugePos(), gx = gp.x + gp.w * clamp(G.time / MAX_TIME, 0, 1);
    JE.fx.text(clamp(gx, 60, JE.W - 60), gp.y + 30, add > 0.05 ? `+${add.toFixed(1)}초` : '시간 가득!', '#36d6a0', 20); }
  // 연출
  kill.forEach(k => {
    const x = Math.floor(k / 100), y = k % 100, c = G.grid[x][y], p = cellCenter(x, y);
    JE.fx.burst(p.x, p.y, COLORS[c.v], c.bomb ? 22 : 10, c.bomb ? 380 : 240);
    G.grid[x][y] = null;
  });
  const mx = path.reduce((a, p) => a + p.x, 0) / n, my = path.reduce((a, p) => a + p.y, 0) / n, cp = cellCenter(mx, my);
  JE.fx.ring(cp.x, cp.y, '#ffd23f', L.cell * (1 + Math.min(n, 6) * 0.25));
  JE.fx.text(cp.x, cp.y, '+' + gained, '#ffd23f', 30);
  if (G.combo > 0) JE.fx.text(cp.x, cp.y - 34, `${G.combo + 1} 콤보! x${mult}`, '#7ee0ff', 22);
  if (bombHit.length) { JE.sfx.boom(); JE.haptic('heavy'); JE.shake.add(10); JE.fx.text(cp.x, cp.y + 30, '말랑폭탄!', '#ff6b8b', 26); }
  else { JE.sfx.pop(G.combo); JE.haptic('success'); JE.shake.add(2 + Math.min(n, 6)); }
  // 5개 이상 한 번에 이으면 폭탄 생성 (끝낸 칸 자리에). 자유 선택이라 4개는 너무 흔함
  let bombAt = null;
  if (n >= BOMB_MIN) bombAt = { x: endCell.x, y: endCell.y };
  gravity(bombAt);
}
function gravity(bombAt) {
  const fresh = [];
  let bombCell = null;
  if (bombAt) { bombCell = mkCell(rndVal()); bombCell.bomb = true; bombCell.pop = 1; G.grid[bombAt.x][bombAt.y] = bombCell; G.bombs++; }
  for (let x = 0; x < COLS; x++) {
    const col = G.grid[x], keep = [];
    for (let y = ROWS - 1; y >= 0; y--) if (col[y]) keep.push({ c: col[y], from: y });
    let y = ROWS - 1;
    for (const k of keep) { col[y] = k.c; const drop = (y - k.from) * L.cell; if (drop) { k.c.oy -= drop; JE.tweens.to(k.c, { oy: 0 }, 0.28 + drop / L.cell * 0.04, 'outBounce').then(() => { k.c.sq.vel -= 3; }); } y--; }
    let i = 0;
    for (; y >= 0; y--, i++) { const c = mkCell(rndVal(), -(i + 1) * L.cell - (y + 1) * L.cell); col[y] = c; fresh.push(c); JE.tweens.to(c, { oy: 0 }, 0.4 + i * 0.05, 'outBounce').then(() => { c.sq.vel -= 3; }); }
  }
  ensureSolvable(fresh);
  setTimeout(() => JE.sfx.land(), 260);
}

/* ---------------- 흐름 ---------------- */
async function start(mode) {
  JE.kit.banner(false); JE.kit.ad.games++;
  G.mode = mode; G.rng = mode === 'daily' ? JE.rng(JE.todaySeed()) : Math.random;
  Object.assign(G, { state: 'play', score: 0, scoreShown: 0, time: START_TIME, combo: 0, lastClear: -99, elapsed: 0, continued: false, drag: null, idle: 0, hint: null, cleared: 0, bombs: 0, timeGained: 0 });
  newBoard();
  JE.sfx.fanfare();
}
function pause() {
  if (G.state !== 'play') return;
  G.state = 'pause'; G.drag = null;
  JE.ui.modal('<h2>일시정지</h2>', [
    { label: '계속하기', onClick: () => { G.state = 'play'; } },
    { label: JE.audio.muted ? '소리 켜기' : '소리 끄기', cls: 'ghost', keepOpen: true, onClick: el => { el.textContent = JE.audio.toggle() ? '소리 켜기' : '소리 끄기'; } },
    JE.motion.button(),
    { label: '그만하기', cls: 'ghost', onClick: () => { gameOver(true); } },
  ]);
}
function timeUp() {
  G.state = 'over-wait'; G.drag = null; JE.sfx.over(); JE.haptic('error');
  if (!G.continued) {
    JE.ui.modal(`<h2>시간 끝!</h2><div class="je-big">${G.score.toLocaleString()}</div><p>광고를 보고 ${CONTINUE_SEC}초 더 할까요? (한 판에 1번)</p>`, [
      { label: `광고 보고 +${CONTINUE_SEC}초`, cls: 'ad', onClick: async () => {
        if (await JE.ads.rewarded('continue')) { G.continued = true; G.time = CONTINUE_SEC; G.state = 'play'; JE.sfx.coin(); JE.ui.toast(`+${CONTINUE_SEC}초! 이어서 해요`); }
        else gameOver();
      } },
      { label: '결과 보기', cls: 'ghost', onClick: () => gameOver() },
    ]);
  } else gameOver();
}
JE.kit.meta.setup({ scoreGoals: [1000, 3000, 7000], missions: [
  { k: 'cleared', t: '오늘 젤리 {n}개 터뜨리기', goals: [80, 160, 300], mode: 'day' },
  { k: 'bombs', t: '한 판에 말랑폭탄 {n}개', goals: [1, 3, 5] },
] });
function gameOver(quit) {
  G.state = 'over';
  const mode = G.mode === 'daily' ? 'daily-' + JE.todaySeed() : 'main';
  const prevBest = JE.best.get(mode);
  const isNew = G.score > 0 && JE.best.submit(G.score, mode);
  if (isNew) { JE.sfx.fanfare(); JE.haptic('success'); }
  const md = JE.kit.meta.endRun({ cleared: G.cleared, bombs: G.bombs }, G.score);
  JE.kit.banner(true);
  const rm = JE.ui.modal(JE.brand.resultHTML({ title: G.mode === 'daily' ? '오늘의 판 결과' : '결과', isNew, score: G.score, best: prevBest,
    stats: [['터뜨린 젤리', G.cleared + '개'], ['말랑폭탄', G.bombs + '개'], ['번 시간', '+' + Math.round(G.timeGained) + '초']] }) + JE.kit.meta.resultExtra(md), [
    { label: JE.kit.interDue() ? '한 판 더 <small style="opacity:.7">(광고 후 시작)</small>' : '한 판 더', onClick: async () => { if (JE.kit.interDue()) await JE.kit.showInter(); start(G.mode); } },
    { label: '랭킹 보기', cls: 'ghost', onClick: () => { JE.kit.banner(false); JE.sdk.openLeaderboard(mode).then(home, () => JE.ui.leaderboard(mode).then(home)); } }, // 실패해도 홈으로 (11-22)
    { label: '처음으로', cls: 'ghost', onClick: home },
  ]);
  JE.kit.meta.bind(rm);
}
function home() {
  G.state = 'home';
  const hm = JE.ui.modal(JE.brand.homeHTML({ title: '열풍', best: JE.best.get('main'), colors: [COLORS[1], COLORS[3], COLORS[6], COLORS[4], COLORS[8]],
    desc: '이웃한 젤리를 손가락으로 이어서<br>합이 <b style="color:#ffd23f">10</b>이면 톡! 터뜨리면 <b style="color:#36d6a0">시간 +</b><br>5개 이상 이으면 <b style="color:#ff6b8b">말랑폭탄</b>이 생겨요.',
    extra: JE.kit.meta.homeExtra() }), [
    { label: '게임 시작', onClick: () => start('main') },
    { label: '오늘의 판', cls: 'alt', onClick: () => start('daily') },
    { label: '랭킹 보기', cls: 'ghost', onClick: () => { JE.kit.banner(false); JE.sdk.openLeaderboard('main').then(home, () => JE.ui.leaderboard('main').then(home)); } },
  ]);
  JE.kit.meta.bind(hm);
  JE.kit.banner(true);
}

/* ---------------- 업데이트 ---------------- */
function update(dt) {
  for (let x = 0; x < COLS; x++) for (let y = 0; y < ROWS; y++) { const c = G.grid[x] && G.grid[x][y]; if (c) { JE.spring(c.sq, 1, dt); if (c.pop) c.pop = Math.max(0, c.pop - dt * 2); } }
  G.scoreShown += (G.score - G.scoreShown) * Math.min(1, dt * 12);
  G.gaugeFlash = Math.max(0, G.gaugeFlash - dt * 2.5);
  if (G.state !== 'play') return;
  G.elapsed += dt;
  const drain = 1 + G.elapsed / DRAIN_RAMP; // 오래 버틸수록 빨리 줄어듦
  const before = G.time;
  G.time -= dt * drain;
  if (G.time < 10 && Math.ceil(before) !== Math.ceil(G.time)) JE.sfx.tick();
  if (G.time <= 0) { G.time = 0; timeUp(); return; }
  if (!G.drag) { G.idle += dt; if (G.idle > 6 && !G.hint) { const m = findMove(); G.hint = m.length ? m[Math.floor(Math.random() * m.length)] : null; } }
}

/* ---------------- 렌더 ---------------- */
function render(c) {
  JE.bg(c);
  const T = JE.theme, s = JE.safe;
  // 보드 판
  JE.brand.panel(c, L.bx - 10, L.by - 10, L.bw + 20, L.bh + 20, 20);
  for (let x = 0; x < COLS; x++) for (let y = 0; y < ROWS; y++) { c.fillStyle = (x + y) % 2 ? 'rgba(0,0,0,.10)' : 'rgba(255,255,255,.04)'; c.fillRect(L.bx + x * L.cell, L.by + y * L.cell, L.cell, L.cell); }

  const d = G.drag, selSet = inSelSet();
  const sum = d ? pathSum(d.path) : 0;
  const inSel = (x, y) => selSet && selSet.has(x * 100 + y);
  const hSet = G.hint ? new Set(G.hint.map(q => q.x * 100 + q.y)) : null, inHint = (x, y) => hSet && hSet.has(x * 100 + y);
  const t = performance.now() / 1000;

  if (d && d.path.length > 1) { // 이은 선은 젤리 뒤에: 숫자가 가려지지 않게
    const col = sum === 10 ? '#ffd23f' : sum > 10 ? '#ff5d7a' : '#7ee0ff';
      c.save(); c.lineCap = 'round'; c.lineJoin = 'round';
      const pts = d.path.map(q => cellCenter(q.x, q.y));
      c.globalAlpha = 0.85; c.strokeStyle = JE.brand.C.deep; c.lineWidth = L.cell * 0.34 + 6;
      c.beginPath(); pts.forEach((q, i) => i ? c.lineTo(q.x, q.y) : c.moveTo(q.x, q.y)); c.stroke();
      c.strokeStyle = col; c.lineWidth = L.cell * 0.34;
      c.beginPath(); pts.forEach((q, i) => i ? c.lineTo(q.x, q.y) : c.moveTo(q.x, q.y)); c.stroke();
      c.globalAlpha = 1;
      c.restore();
    }
  // 젤리
  c.save(); c.beginPath(); c.rect(L.bx - 10, L.by - 10, L.bw + 20, L.bh + 20); c.clip();
  for (let x = 0; x < COLS; x++) for (let y = 0; y < ROWS; y++) {
    const cell = G.grid[x] && G.grid[x][y]; if (!cell) continue;
    const p = cellCenter(x, y), sel = inSel(x, y), size = L.cell * 0.88;
    const sq = cell.sq.v, sx = 1 + (1 - sq) * 0.6, sy = sq;
    let scale = 1 + cell.pop * 0.25;
    if (sel) scale *= sum === 10 ? 1.08 + Math.sin(t * 18) * 0.03 : 0.94;
    if (inHint(x, y)) scale *= 1 + Math.sin(t * 6) * 0.05;
    JE.jelly(c, p.x, p.y + cell.oy, size * scale, size * scale, COLORS[cell.v], { sx, sy, label: cell.v, glow: sel && sum === 10 ? 1 : (inHint(x, y) ? 0.5 : 0), art: TILE_ART[cell.v] });
    if (cell.bomb) { // 폭탄 표시: 반짝이는 테두리 + 작은 불꽃 점
      c.save(); c.translate(p.x, p.y + cell.oy);
      c.strokeStyle = `rgba(255,255,255,${0.55 + Math.sin(t * 8) * 0.35})`; c.lineWidth = 3; c.setLineDash([5, 4]); c.lineDashOffset = -t * 20;
      JE.roundRect(c, -size * 0.5 * scale - 2, -size * 0.5 * scale - 2, size * scale + 4, size * scale + 4, size * 0.34); c.stroke(); c.setLineDash([]);
      if (!(JE.art && JE.art.draw(c, 'tile_bomb', size * 0.36 * scale, -size * 0.36 * scale, size * 0.42, size * 0.42, { rot: Math.sin(t * 8) * 0.15 }))) { c.fillStyle = '#fff'; c.beginPath(); c.arc(size * 0.32, -size * 0.32, 4 + Math.sin(t * 12) * 1.5, 0, Math.PI * 2); c.fill(); }
      c.restore();
    }
  }
  c.restore();

  // 선택 줄: 지나간 칸을 잇는 굵은 젤리 선 + 칸 테두리
  if (d) {
    const col = sum === 10 ? '#ffd23f' : sum > 10 ? '#ff5d7a' : '#7ee0ff';
    for (const q of d.path) {
      const x = L.bx + q.x * L.cell, y = L.by + q.y * L.cell;
      c.fillStyle = col + '22'; c.strokeStyle = col; c.lineWidth = 3;
      JE.roundRect(c, x + 3, y + 3, L.cell - 6, L.cell - 6, 14); c.fill(); c.stroke();
    }
    // 칸 사이 연결 고리 (숫자는 안 가리게 칸 가장자리 사이만)
    c.save(); c.lineCap = 'round';
    for (let i = 1; i < d.path.length; i++) {
      const p0 = cellCenter(d.path[i - 1].x, d.path[i - 1].y), p1 = cellCenter(d.path[i].x, d.path[i].y);
      const dx = p1.x - p0.x, dy = p1.y - p0.y, len = Math.hypot(dx, dy), ux = dx / len, uy = dy / len, cut = len * 0.3;
      const ax = p0.x + ux * cut, ay = p0.y + uy * cut, bx2 = p1.x - ux * cut, by2 = p1.y - uy * cut;
      c.strokeStyle = JE.brand.C.deep; c.lineWidth = L.cell * 0.2 + 5; c.beginPath(); c.moveTo(ax, ay); c.lineTo(bx2, by2); c.stroke();
      c.strokeStyle = col; c.lineWidth = L.cell * 0.2; c.beginPath(); c.moveTo(ax, ay); c.lineTo(bx2, by2); c.stroke();
    }
    c.restore();
    // 합계 말풍선 (손가락에 안 가리게 위쪽)
    const bx = clamp(d.qx, 40, JE.W - 40), by = Math.max(s.top + 160, d.qy - 70);
    c.fillStyle = col; JE.roundRect(c, bx - 32, by - 22, 64, 44, 16); c.fill();
    c.lineWidth = 3; c.strokeStyle = JE.brand.C.deep; JE.roundRect(c, bx - 32, by - 22, 64, 44, 16); c.stroke();
    c.fillStyle = JE.brand.C.ink; c.font = `900 26px ${JE.FONT}`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(sum, bx, by + 1);
  }

  // HUD = 풍년 공통: 상단 띠(BEST · 점수 · 일시정지) + 시간 게이지, 하단 트레이
  const B = JE.brand, rowY = hudRowY(), bandH = s.top + 112;
  B.hudBand(c, bandH);
  const bestKey = G.mode === 'daily' ? 'daily-' + JE.todaySeed() : 'main';
  B.hudRow(c, rowY, G.scoreShown, JE.best.get(bestKey));
  // 하트 없음 (11-22 공통 광고 흐름으로 통일)
  if (G.mode === 'daily') { c.textAlign = 'right'; c.textBaseline = 'middle'; c.font = B.font(12, 800); c.fillStyle = B.C.gold; c.fillText('오늘의 판', JE.W - 16 - s.right, rowY + 37); }
  const gp = gaugePos(), gx = gp.x, gw = gp.w, gy = gp.y, k = clamp(G.time / MAX_TIME, 0, 1);
  const low = G.time < 10, gc = low ? (Math.sin(t * 12) > 0 ? '#ff5d7a' : '#ff9a4d') : '#36d6a0';
  B.gauge(c, gx, gy, gw, k, gc, 12);
  if (G.gaugeFlash) { c.fillStyle = `rgba(255,255,255,${G.gaugeFlash * 0.5})`; JE.roundRect(c, gx, gy, gw * k, 12, 6); c.fill(); }
  c.textAlign = 'right'; c.textBaseline = 'middle'; c.font = B.font(15 + G.gaugeFlash * 4, 900); c.fillStyle = low ? gc : (G.gaugeFlash > 0.1 ? '#36d6a0' : B.C.text);
  c.fillText(Math.ceil(G.time) + '초', JE.W - 16 - s.right, gy + 6);
  if (G.combo > 0 && G.state === 'play' && G.elapsed - G.lastClear <= COMBO_WIN) {
    c.font = B.font(13, 900); c.fillStyle = B.C.soda; c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText(`콤보 x${Math.min(4, 1 + G.combo * 0.5)}`, JE.W / 2, rowY + 37);
  }
  // 하단 트레이: 조작 안내
  const ty = JE.H - s.bottom - 40;
  B.tray(c, ty, t);
  c.textAlign = 'center'; c.textBaseline = 'middle'; c.font = B.font(12, 700); c.fillStyle = B.C.sub;
  c.fillText('젤리를 이어 그어서 합이 10이면 톡! (대각선도 OK)', JE.W / 2, ty + 20);
}

JE.init({ gameId: 'hapchyeoten', canvas, onResize: layout, onPause: () => pause() });
layout(JE.W, JE.H);
// 홈 화면 뒤에 보일 장식용 보드
G.rng = JE.rng(7); newBoard(); G.rng = Math.random;
JE.run(update, render);
home();
// 테스트 훅
window.__G = G; window.__L = () => L;
// 스토어 스크린샷 자동 촬영용 (release/tools/shots.js). 게임 동작엔 영향 없음
window.__pung = { G, L, cellCenter };
})();
</script>
