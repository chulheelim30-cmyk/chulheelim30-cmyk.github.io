<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#fbf6ea">
<title>방울풍</title>
<style>
  html,body{margin:0;height:100%;background:#fbf6ea;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
  canvas{display:block}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/* ==========================================================================
 * JellyEngine v0.1  (공통 엔진, 10종 공용)
 * - 단일 HTML에 인라인되어 쓰인다 (build.py 가 <!--ENGINE--> 자리에 삽입)
 * - 기능: 캔버스(DPR/리사이즈/Safe Area), 루프, 트윈·파티클, 젤리 렌더,
 *         효과음(WebAudio 합성)·진동, 하트(5개/10분), 최고점, 랭킹,
 *         보상형 광고, 앱인토스 SDK 어댑터(브라우저에선 목업)
 * - 외부 에셋 0개. 모든 그림/소리는 코드로 생성.
 * ========================================================================== */
(function (global) {
  'use strict';

  const JE = {};
  const now = () => performance.now();
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  JE.util = { clamp, lerp, now };

  /* ---------------- 저장소 (localStorage, 게임별 네임스페이스) ---------------- */
  let NS = 'je';
  const store = {
    get(k, d) { try { const v = localStorage.getItem(NS + ':' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(NS + ':' + k, JSON.stringify(v)); } catch (e) {} },
  };
  JE.store = store;

  /* ---------------- 시드 난수 (오늘의 판 등) ---------------- */
  JE.rng = function (seed) {
    let s = (seed >>> 0) || 1;
    const r = () => { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; };
    r.int = (a, b) => a + Math.floor(r() * (b - a + 1));
    return r;
  };
  JE.todaySeed = function () {
    const d = new Date(); // 기기 로컬 날짜 기준
    return d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate();
  };

  /* ====================================================================
   * 앱인토스 SDK 어댑터
   * [확인 필요] 실제 함수명/시그니처는 앱인토스 공식 문서로 최종 확인할 것.
   * 출시 빌드에서는 @apps-in-toss/web-framework 를 번들한 브리지가
   * window.__AIT__ 에 아래 형태의 객체를 넣어준다고 가정한다.
   *   login()               -> Promise<{userKey}>        (게임 로그인)
   *   submitScore(score)    -> Promise<void>             (리더보드 제출)
   *   openLeaderboard()     -> Promise<void>             (리더보드 열기)
   *   safeArea()            -> {top,right,bottom,left}   (Safe Area)
   *   showRewardedAd(id)    -> Promise<boolean>          (보상 지급 여부)
   *   haptic(type)          -> void                      (진동)
   * window.__AIT__ 가 없으면 목업으로 동작한다.
   * ==================================================================== */
  const mock = {
    isMock: true,
    async login() { let k = store.get('mockUser'); if (!k) { k = 'mock-' + Math.random().toString(36).slice(2, 8); store.set('mockUser', k); } return { userKey: k }; },
    async submitScore(score) { console.log('[AIT mock] submitScore', score); },
    openLeaderboard(mode) { return JE.ui.leaderboard(mode); }, // 닫을 때 resolve
    safeArea() { return null; },
    showRewardedAd(id) { return JE.ui.mockAd(id); },
    haptic(type) { if (navigator.vibrate) navigator.vibrate({ tap: 8, soft: 12, success: [10, 40, 18], error: [30, 30, 30], heavy: 35 }[type] || 10); },
  };
  JE.sdk = Object.assign({}, mock, global.__AIT__ || {}, { isMock: !global.__AIT__ });

  /* ---------------- Safe Area ---------------- */
  JE.safe = { top: 0, right: 0, bottom: 0, left: 0 };
  function readSafeArea() {
    const fromSdk = JE.sdk.safeArea && JE.sdk.safeArea();
    if (fromSdk) { JE.safe = Object.assign({ top: 0, right: 0, bottom: 0, left: 0 }, fromSdk); }
    else {
      const p = document.createElement('div');
      p.style.cssText = 'position:fixed;visibility:hidden;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)';
      document.body.appendChild(p);
      const cs = getComputedStyle(p);
      JE.safe = { top: parseFloat(cs.paddingTop) || 0, right: parseFloat(cs.paddingRight) || 0, bottom: parseFloat(cs.paddingBottom) || 0, left: parseFloat(cs.paddingLeft) || 0 };
      p.remove();
    }
    const r = document.documentElement.style;
    r.setProperty('--sat', JE.safe.top + 'px'); r.setProperty('--sab', JE.safe.bottom + 'px');
    r.setProperty('--sal', JE.safe.left + 'px'); r.setProperty('--sar', JE.safe.right + 'px');
  }

  /* ---------------- 캔버스 & 루프 ---------------- */
  JE.W = 0; JE.H = 0; JE.dpr = 1;
  JE.init = function (opts) {
    NS = 'je:' + (opts.gameId || 'game');
    JE.gameId = opts.gameId;
    JE.canvas = opts.canvas;
    JE.ctx = JE.canvas.getContext('2d');
    readSafeArea();
    const resize = () => {
      JE.dpr = Math.min(global.devicePixelRatio || 1, 3);
      JE.W = global.innerWidth; JE.H = global.innerHeight;
      JE.canvas.width = Math.round(JE.W * JE.dpr); JE.canvas.height = Math.round(JE.H * JE.dpr);
      JE.canvas.style.width = JE.W + 'px'; JE.canvas.style.height = JE.H + 'px';
      readSafeArea();
      opts.onResize && opts.onResize(JE.W, JE.H);
    };
    global.addEventListener('resize', resize);
    resize();
    JE.input.attach(JE.canvas);
    JE.hearts.tick();
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) { JE.audio.suspend(); opts.onPause && opts.onPause(); }
      else JE.audio.resume();
    });
    JE.sdk.login().then(u => { JE.user = u; }).catch(() => {});
  };

  JE.run = function (update, render) {
    let last = now();
    let errs = 0;
    function frame(t) {
      // 다음 프레임을 먼저 예약: 한 프레임에서 오류가 나도 화면이 멈추지 않게 (11-22)
      requestAnimationFrame(frame);
      const dt = Math.min(0.05, Math.max(0, (t - last) / 1000)); last = t;
      if (JE.W < 60 || JE.H < 60) return; // 창이 아직 0·아주 작으면 그리지 않음(앱 안 미리보기 첫 순간)
      const c = JE.ctx;
      try {
        JE.tweens.update(dt); JE.fx.update(dt); JE.shake.update(dt);
        update(dt);
        c.setTransform(JE.dpr, 0, 0, JE.dpr, 0, 0);
        c.save(); JE.shake.apply(c);
        render(c, dt);
        JE.fx.render(c);
        c.restore();
      } catch (e) {
        if (errs++ < 3) console.error(e);
        try { if (c.reset) c.reset(); else c.restore(); } catch (_) {} // 그리다 만 save 정리
      }
    }
    requestAnimationFrame(frame);
  };

  /* ---------------- 입력 (포인터 통합: 터치 드래그) ---------------- */
  JE.input = {
    handlers: {},
    on(h) { this.handlers = h; },
    attach(el) {
      el.style.touchAction = 'none';
      const pos = e => { const r = el.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top, id: e.pointerId }; };
      let active = null;
      el.addEventListener('pointerdown', e => { JE.audio.unlock(); if (active != null) return; active = e.pointerId; el.setPointerCapture(e.pointerId); this.handlers.down && this.handlers.down(pos(e)); });
      el.addEventListener('pointermove', e => { if (e.pointerId !== active) return; this.handlers.move && this.handlers.move(pos(e)); });
      const up = e => { if (e.pointerId !== active) return; active = null; this.handlers.up && this.handlers.up(pos(e)); };
      el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
      document.addEventListener('gesturestart', e => e.preventDefault());
    },
  };

  /* ---------------- 트윈 ---------------- */
  const ease = {
    linear: t => t,
    outCubic: t => 1 - Math.pow(1 - t, 3),
    inCubic: t => t * t * t,
    outBack: t => { const c = 1.70158; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); },
    outElastic: t => t === 0 || t === 1 ? t : Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * (2 * Math.PI) / 3) + 1,
    outBounce: t => { const n = 7.5625, d = 2.75; if (t < 1 / d) return n * t * t; if (t < 2 / d) return n * (t -= 1.5 / d) * t + 0.75; if (t < 2.5 / d) return n * (t -= 2.25 / d) * t + 0.9375; return n * (t -= 2.625 / d) * t + 0.984375; },
  };
  JE.ease = ease;
  JE.tweens = {
    list: [],
    to(obj, props, dur, e = 'outCubic', delay = 0) {
      return new Promise(res => {
        const from = {}; for (const k in props) from[k] = obj[k];
        this.list.push({ obj, props, from, dur, e: ease[e] || e, t: -delay, res });
      });
    },
    update(dt) {
      this.list = this.list.filter(tw => {
        tw.t += dt; if (tw.t < 0) return true;
        const p = clamp(tw.t / tw.dur, 0, 1), k = tw.e(p);
        for (const key in tw.props) tw.obj[key] = lerp(tw.from[key], tw.props[key], k);
        if (p >= 1) { tw.res(); return false; } return true;
      });
    },
  };
  JE.wait = s => JE.tweens.to({ v: 0 }, { v: 1 }, s, 'linear');

  /* ---------------- 화면 흔들림 ---------------- */
  // 11-23 "멀미난다": 기본은 '차분히'(화면 흔들림 거의 없음·선 떨림 없음). 일시정지 메뉴에서 '생생하게'로 바꿀 수 있음
  JE.motion = {
    get lively() { try { return localStorage.getItem('pung_motion') === 'lively'; } catch (e) { return false; } },
    toggle() { const on = !this.lively; try { localStorage.setItem('pung_motion', on ? 'lively' : 'calm'); } catch (e) {} return on; },
    k(a) { return this.lively ? a : a * 0.3; }, // 확대·번쩍 같은 연출 세기
    button() { const lab = () => JE.motion.lively ? '화면 효과: 생생하게' : '화면 효과: 차분히'; return { label: lab(), cls: 'ghost', keepOpen: true, onClick: el => { JE.motion.toggle(); el.textContent = lab(); } }; },
  };
  JE.shake = {
    amp: 0, t: 0,
    add(a) { this.amp = Math.max(this.amp, JE.motion.lively ? a * 0.6 : Math.min(1.5, a * 0.12)); },
    update(dt) { this.amp *= Math.pow(0.001, dt); if (this.amp < 0.2) this.amp = 0; this.t += dt; },
    apply(c) { if (this.amp) c.translate((Math.random() - 0.5) * this.amp * 2, (Math.random() - 0.5) * this.amp * 2); },
  };

  /* ---------------- 파티클 & 플로팅 텍스트 ---------------- */
  JE.fx = {
    parts: [], texts: [], rings: [],
    burst(x, y, color, n = 14, power = 260) {
      for (let i = 0; i < n; i++) {
        const a = Math.random() * Math.PI * 2, s = power * (0.35 + Math.random() * 0.65);
        this.parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 80, r: 3 + Math.random() * 5, life: 0.5 + Math.random() * 0.4, t: 0, color });
      }
    },
    ring(x, y, color, r = 60) { this.rings.push({ x, y, color, r, t: 0, life: 0.35 }); },
    text(x, y, str, color = '#fff', size = 28) { this.texts.push({ x, y, str, color, size, t: 0, life: 0.9 }); },
    update(dt) {
      this.parts = this.parts.filter(p => { p.t += dt; p.vy += 900 * dt; p.vx *= 0.98; p.x += p.vx * dt; p.y += p.vy * dt; return p.t < p.life; });
      this.texts = this.texts.filter(t => { t.t += dt; return t.t < t.life; });
      this.rings = this.rings.filter(r => { r.t += dt; return r.t < r.life; });
    },
    render(c) {
      for (const r of this.rings) { const k = r.t / r.life; c.globalAlpha = 1 - k; c.strokeStyle = r.color; c.lineWidth = 6 * (1 - k) + 1; c.beginPath(); c.arc(r.x, r.y, r.r * ease.outCubic(k), 0, Math.PI * 2); c.stroke(); }
      for (const p of this.parts) { const k = p.t / p.life; c.globalAlpha = 1 - k; c.fillStyle = p.color; c.beginPath(); c.arc(p.x, p.y, p.r * (1 - k * 0.5), 0, Math.PI * 2); c.fill(); }
      c.textAlign = 'center'; c.textBaseline = 'middle';
      for (const t of this.texts) {
        const k = t.t / t.life, s = t.size * (k < 0.15 ? ease.outBack(k / 0.15) : 1);
        c.globalAlpha = k > 0.6 ? 1 - (k - 0.6) / 0.4 : 1;
        c.font = `900 ${s}px ${JE.FONT}`; c.lineWidth = 5; c.strokeStyle = 'rgba(0,0,0,.55)';
        c.strokeText(t.str, t.x, t.y - k * 50); c.fillStyle = t.color; c.fillText(t.str, t.x, t.y - k * 50);
      }
      c.globalAlpha = 1;
    },
  };

  /* ====================================================================
   * 젤리 렌더 (디자인 기준: 다크 차콜 + 광택 젤리)
   * ==================================================================== */
  JE.FONT = '-apple-system, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif';
  JE.theme = { bg0: '#1b1d22', bg1: '#24272e', panel: '#2b2f37', line: 'rgba(255,255,255,.06)', text: '#f2f3f5', sub: '#9aa0aa', accent: '#ffd23f' };

  function shade(hex, amt) { // amt -1..1
    const n = parseInt(hex.slice(1), 16); let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
    const f = amt < 0 ? 0 : 255, p = Math.abs(amt);
    r = Math.round((f - r) * p + r); g = Math.round((f - g) * p + g); b = Math.round((f - b) * p + b);
    return `rgb(${r},${g},${b})`;
  }
  JE.shade = shade;

  function rr(c, x, y, w, h, r) { w = Math.max(0, w); h = Math.max(0, h); r = Math.max(0, Math.min(r || 0, w / 2, h / 2)); c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
  JE.roundRect = rr;

  JE.bg = function (c) {
    const g = c.createLinearGradient(0, 0, 0, JE.H); g.addColorStop(0, JE.theme.bg1); g.addColorStop(1, JE.theme.bg0);
    c.fillStyle = g; c.fillRect(0, 0, JE.W, JE.H);
    const v = c.createRadialGradient(JE.W / 2, JE.H * 0.4, 0, JE.W / 2, JE.H * 0.4, JE.H * 0.8);
    v.addColorStop(0, 'rgba(255,255,255,.035)'); v.addColorStop(1, 'rgba(0,0,0,.25)');
    c.fillStyle = v; c.fillRect(0, 0, JE.W, JE.H);
  };

  /** 광택 젤리 블록. o.sx/o.sy = 스쿼시 스케일, o.glow = 발광 강도(0~1) */
  JE.jelly = function (c, cx, cy, w, h, color, o = {}) {
    if (!(w > 0.5 && h > 0.5)) return; // 크기가 0·음수면 건너뜀(첫 화면 크기 0일 때 오류 방지)
    const sx = o.sx || 1, sy = o.sy || 1, r = (o.radius != null ? o.radius : 0.32) * Math.min(w, h);
    c.save(); c.translate(cx, cy + h * (1 - sy) / 2); c.scale(sx, sy);
    const x = -w / 2, y = -h / 2;
    // 그림자
    c.fillStyle = 'rgba(0,0,0,.35)'; rr(c, x + 1, y + h * 0.08, w - 2, h, r); c.fill();
    if (o.glow) { c.shadowColor = color; c.shadowBlur = 22 * o.glow; }
    // 본체 그라데이션
    const g = c.createLinearGradient(0, y, 0, y + h);
    g.addColorStop(0, shade(color, 0.28)); g.addColorStop(0.55, color); g.addColorStop(1, shade(color, -0.32));
    c.fillStyle = g; rr(c, x, y, w, h, r); c.fill(); c.shadowBlur = 0;
    // 안쪽 림(투명감)
    c.strokeStyle = 'rgba(255,255,255,.18)'; c.lineWidth = Math.max(1, w * 0.03); rr(c, x + w * 0.04, y + h * 0.04, w * 0.92, h * 0.92, r * 0.85); c.stroke();
    // 하단 반사광
    const b = c.createLinearGradient(0, y + h * 0.6, 0, y + h);
    b.addColorStop(0, 'rgba(255,255,255,0)'); b.addColorStop(1, 'rgba(255,255,255,.16)');
    c.fillStyle = b; rr(c, x + w * 0.1, y + h * 0.6, w * 0.8, h * 0.34, r * 0.6); c.fill();
    // 상단 광택 하이라이트
    const hg = c.createLinearGradient(0, y, 0, y + h * 0.45);
    hg.addColorStop(0, 'rgba(255,255,255,.75)'); hg.addColorStop(1, 'rgba(255,255,255,0)');
    c.fillStyle = hg; rr(c, x + w * 0.12, y + h * 0.07, w * 0.76, h * 0.36, r * 0.7); c.fill();
    c.fillStyle = 'rgba(255,255,255,.9)'; c.beginPath(); c.ellipse(x + w * 0.27, y + h * 0.22, w * 0.07, h * 0.045, -0.5, 0, Math.PI * 2); c.fill();
    if (o.label != null) {
      c.font = `900 ${Math.round(h * 0.5)}px ${JE.FONT}`; c.textAlign = 'center'; c.textBaseline = 'middle';
      c.fillStyle = 'rgba(0,0,0,.25)'; c.fillText(o.label, 0, h * 0.06);
      c.fillStyle = o.labelColor || '#fff'; c.fillText(o.label, 0, h * 0.02);
    }
    c.restore();
  };

  /** 스프링 (젤리 출렁임용): s.v 를 target 으로 */
  JE.spring = function (s, target, dt, k = 260, d = 14) { const a = (target - s.v) * k - s.vel * d; s.vel += a * dt; s.v += s.vel * dt; return s.v; };

  /* ====================================================================
   * 오디오: WebAudio 합성 효과음 (외부 파일 없음)
   * ==================================================================== */
  JE.audio = {
    ctx: null, master: null, muted: false,
    unlock() {
      if (!this.ctx) { try { this.ctx = new (global.AudioContext || global.webkitAudioContext)(); this.master = this.ctx.createGain(); this.master.gain.value = 0.5; this.master.connect(this.ctx.destination); } catch (e) { return; } }
      if (this.ctx.state === 'suspended') this.ctx.resume();
      this.muted = store.get('muted', false);
    },
    suspend() { this.ctx && this.ctx.suspend(); }, resume() { this.ctx && this.ctx.resume(); },
    toggle() { this.muted = !this.muted; store.set('muted', this.muted); return this.muted; },
    tone(freq, dur, type = 'sine', vol = 0.3, slide = 0, delay = 0) {
      if (!this.ctx || this.muted) return;
      const t = this.ctx.currentTime + delay, o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type = type; o.frequency.setValueAtTime(freq, t);
      if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq * slide), t + dur);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(this.master); o.start(t); o.stop(t + dur + 0.02);
    },
    noise(dur, vol = 0.2, freq = 1200, delay = 0) {
      if (!this.ctx || this.muted) return;
      const t = this.ctx.currentTime + delay, len = Math.floor(this.ctx.sampleRate * dur), buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
      const s = this.ctx.createBufferSource(), f = this.ctx.createBiquadFilter(), g = this.ctx.createGain();
      f.type = 'bandpass'; f.frequency.value = freq; g.gain.value = vol; s.buffer = buf;
      s.connect(f); f.connect(g); g.connect(this.master); s.start(t);
    },
  };
  // 효과음 프리셋 (모두 자체 합성)
  JE.sfx = {
    tap() { JE.audio.tone(520, 0.06, 'triangle', 0.15, 1.4); },
    select(i = 0) { JE.audio.tone(330 * Math.pow(1.0595, i * 2), 0.07, 'sine', 0.14, 1.2); },
    ready() { JE.audio.tone(880, 0.09, 'sine', 0.16, 1.5); },
    pop(combo = 0) { const b = 420 * Math.pow(1.0595, Math.min(combo, 12) * 2); JE.audio.tone(b, 0.14, 'sine', 0.3, 2.2); JE.audio.tone(b * 1.5, 0.1, 'triangle', 0.12, 1.8, 0.03); JE.audio.noise(0.08, 0.12, 2400); },

  B.panel = function (c, x, y, w, h, r = 18, o = {}) {
    if (!(w > 2 && h > 2)) return;
    const e = sprite(`p|${Math.round(w)}|${Math.round(h)}|${Math.round(r)}|${S.seed()}|${o.fill || ''}`, Math.round(w), Math.round(h), 8, (cc, rc) => {
      const sd = 3 + S.seed() * 5;
      rc.path(rrp(3, 5, w, h, r), { seed: sd, fill: 'rgba(60,40,20,.10)', fillStyle: 'solid', stroke: 'none' });
      rc.path(rrp(0, 0, w, h, r), { seed: sd + 1, fill: o.fill || S.C.card, fillStyle: 'solid', stroke: S.C.ink, strokeWidth: 2.2, roughness: 1.2, bowing: 1 });
    });
    c.drawImage(e.cv, x - e.pad, y - e.pad, Math.round(w) + e.pad * 2, Math.round(h) + e.pad * 2);
  };
  /** 판 안 빈칸 (연필로 흐리게 그린 네모) */
  S.cell = function (c, x, y, w, h, r = 6) {
    const e = sprite(`c|${Math.round(w)}|${Math.round(h)}|${S.seed()}`, Math.round(w), Math.round(h), 3, (cc, rc) => {
      rc.path(rrp(0, 0, w, h, r), { seed: 5 + S.seed(), stroke: 'rgba(43,43,43,.18)', strokeWidth: 1, roughness: 1.4, fill: 'rgba(120,100,70,.05)', fillStyle: 'solid' });
    });
    c.drawImage(e.cv, x - e.pad, y - e.pad, Math.round(w) + e.pad * 2, Math.round(h) + e.pad * 2);
  };
  /* 경고 줄무늬 → 노랑 마스킹테이프 */
  B.hazard = function (c, x, y, w, h, off = 0) {
    if (!(w > 2 && h > 1)) return;
    const e = sprite(`hz|${Math.round(w)}|${Math.round(h)}|${S.seed()}`, Math.round(w), Math.round(h), 3, (cc, rc) => {
      rc.rectangle(0, 0, w, h, { seed: 9 + S.seed(), fill: 'rgba(255,201,58,.85)', fillStyle: 'hachure', hachureGap: 3, fillWeight: 2, hachureAngle: 60, stroke: 'rgba(43,43,43,.35)', strokeWidth: 1, roughness: 1.2 });
    });
    c.drawImage(e.cv, x - e.pad, y - e.pad, Math.round(w) + e.pad * 2, Math.round(h) + e.pad * 2);
  };
  /* 상단 띠: 종이 그대로 + 아래 연필 선 하나 */
  B.hudBand = function (c, bandH, W = JE.W) { S.line(c, 12, bandH, W - 12, bandH, 1.4, 'rgba(43,43,43,.35)'); };
  B.tray = function (c, y, t = 0, W = JE.W, H = JE.H) {
    c.fillStyle = 'rgba(244,236,217,.75)'; c.fillRect(0, y, W, H - y);
    S.line(c, 0, y, W, y + 1, 2, S.C.ink);
  };
  /** 손으로 그은 선 */
  S.line = function (c, x1, y1, x2, y2, wdt = 2, col = S.C.ink) {
    const e = sprite(`l|${Math.round(x2 - x1)}|${Math.round(y2 - y1)}|${wdt}|${col}|${S.seed()}`, Math.abs(Math.round(x2 - x1)) + 1, Math.abs(Math.round(y2 - y1)) + 1, 6, (cc, rc) => {
      rc.line(0, 0, Math.abs(x2 - x1), Math.abs(y2 - y1), { seed: 4 + S.seed(), stroke: col, strokeWidth: wdt, roughness: 1.2, bowing: 1.5 });
    });
    c.drawImage(e.cv, Math.min(x1, x2) - e.pad, Math.min(y1, y2) - e.pad);
  };

  /* ---------- 7. HUD ---------- */
  S.sprout = function (c, x, y, s) {
    const e = sprite(`sp|${Math.round(s)}|${S.seed()}`, s * 1.4, s * 1.1, 4, (cc, rc) => {
      const cx = s * 0.7, cy = s * 0.6, o = { seed: 3 + S.seed(), stroke: S.C.ink, strokeWidth: 1.3, fill: '#7fd84a', fillStyle: 'hachure', hachureGap: 2, fillWeight: 1.2 };
      rc.line(cx, cy + s * 0.45, cx, cy, { seed: 2, stroke: '#4d8a2a', strokeWidth: 2 });
      rc.ellipse(cx - s * 0.3, cy - s * 0.05, s * 0.62, s * 0.3, o); rc.ellipse(cx + s * 0.32, cy - s * 0.15, s * 0.68, s * 0.32, o);
    });
    c.drawImage(e.cv, x - s * 0.7 - e.pad, y - s * 0.6 - e.pad);
  };
  B.pill = function (c, x, y, w, label, val, col = S.C.ink, h = 30) {
    const e = sprite(`pl|${Math.round(w)}|${h}|${S.seed()}`, Math.round(w), h, 4, (cc, rc) => rc.path(rrp(0, 0, w, h, h / 2), { seed: 6 + S.seed(), fill: '#fffdf6', fillStyle: 'solid', stroke: S.C.ink, strokeWidth: 1.4, roughness: 1 }));
    c.drawImage(e.cv, x - e.pad, y - e.pad);
    c.textBaseline = 'middle';
    c.font = B.font(11, 700); c.fillStyle = S.C.sub; c.textAlign = 'left'; c.fillText(label, x + 12, y + h / 2 + 1);
    c.font = B.font(15, 900); c.fillStyle = (col === '#fff' || col === '#ffffff') ? S.C.ink : col; c.textAlign = 'right'; c.fillText(val, x + w - 12, y + h / 2 + 1);
  };
  B.hudRow = function (c, rowY, score, best, W = JE.W) {
    const s = JE.safe, bestTxt = Math.max(best, Math.round(score)).toLocaleString(), bx = 16 + s.left;
    S.sprout(c, bx + 10, rowY - 2, 20);
    c.textBaseline = 'middle'; c.textAlign = 'left'; c.font = B.font(20, 700); c.fillStyle = S.C.orange; c.fillText(bestTxt, bx + 26, rowY + 2);
    const bw = c.measureText(bestTxt).width + 30;
    const pr = B.pauseRect(rowY, W), scTxt = Math.round(score).toLocaleString();
    const half = Math.min(W / 2 - (bx + bw), pr.x - W / 2) - 8;
    let fs = 50; c.font = B.font(fs); const tw0 = c.measureText(scTxt).width; if (tw0 > half * 2) fs = Math.max(24, Math.floor(50 * half * 2 / tw0));
    c.textAlign = 'center'; c.font = B.font(fs); c.fillStyle = S.C.ink; c.fillText(scTxt, W / 2, rowY + 3);
    B.pauseBtn(c, pr.x + pr.w / 2, pr.y + pr.h / 2);
    return pr;
  };
  B.pauseBtn = function (c, cx, cy) {
    if (JE.art && JE.art.draw(c, 'icon_pause', cx, cy, 42, 42)) return; // 11-23 Gemini 버튼
    const e = sprite(`pb|${S.seed()}`, 40, 40, 4, (cc, rc) => {
      const o = { seed: 8 + S.seed(), stroke: S.C.ink, strokeWidth: 1.8, roughness: 1 };
      rc.circle(20, 20, 38, Object.assign({ fill: '#fffdf6', fillStyle: 'solid' }, o));
      rc.line(16, 12, 16, 28, Object.assign({}, o, { strokeWidth: 3 })); rc.line(25, 12, 25, 28, Object.assign({}, o, { strokeWidth: 3 }));
    });
    c.drawImage(e.cv, cx - 20 - e.pad, cy - 20 - e.pad);
  };
  B.gauge = function (c, x, y, w, k, col = '#36d6a0', h = 12) {
    if (!(w > 4)) return;
    const kk = Math.max(0, Math.min(1, k)), fillW = Math.round(w * kk / 4) * 4;
    if (fillW > 3) { const e = blockSprite(fillW, h, col, h / 2, S.seed()); c.drawImage(e.cv, x - e.pad, y - e.pad, fillW + e.pad * 2, h + e.pad * 2); }
    const e2 = sprite(`g|${Math.round(w)}|${h}|${S.seed()}`, Math.round(w), h, 4, (cc, rc) => rc.path(rrp(0, 0, w, h, h / 2), { seed: 7 + S.seed(), stroke: S.C.ink, strokeWidth: 1.5, roughness: 1 }));
    c.drawImage(e2.cv, x - e2.pad, y - e2.pad);
  };

  /* ---------- 8. 얼굴 (연필 낙서 표정) ---------- */
  const baseFace = B.face;
  B.face = function (c, w, h, mood = 'normal', blink = 1) { baseFace(c, w, h, mood, blink); };

  /* ---------- 9. 연출 도우미: 낙서 별·지그재그·말풍선 폭발 ---------- */
  S.star = function (c, x, y, r, col) {
    const R0 = Math.max(3, Math.round(r));
    const e = sprite(`st|${R0}|${toHex(col)}|${S.seed()}`, R0 * 2, R0 * 2, 4, (cc, rc) => {
      const pts = []; for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, q = i % 2 ? R0 * 0.45 : R0; pts.push([R0 + Math.cos(a) * q, R0 + Math.sin(a) * q]); }
      rc.polygon(pts, { seed: 5 + S.seed(), fill: col, fillStyle: 'hachure', hachureGap: Math.max(1.6, R0 * 0.25), fillWeight: 1.4, stroke: S.C.ink, strokeWidth: 1.3, roughness: 1 });
    });
    c.drawImage(e.cv, x - R0 - e.pad, y - R0 - e.pad);
  };
  S.burst = function (c, x, y, rw, rh, col) {
    const W2 = Math.round(rw), H2 = Math.round(rh);
    const e = sprite(`bu|${W2}|${H2}|${toHex(col)}|${S.seed()}`, W2 * 2, H2 * 2, 6, (cc, rc) => {
      const pts = []; for (let i = 0; i < 22; i++) { const a = i / 22 * Math.PI * 2, q = i % 2 ? 0.8 : 1; pts.push([W2 + Math.cos(a) * W2 * q, H2 + Math.sin(a) * H2 * q]); }
      rc.polygon(pts, { seed: 3 + S.seed(), fill: col, fillStyle: 'hachure', hachureGap: 3, fillWeight: 2, stroke: S.C.ink, strokeWidth: 2.4, roughness: 1.3 });
      rc.polygon(pts.map(([a, b]) => [W2 + (a - W2) * 0.74, H2 + (b - H2) * 0.7]), { seed: 4, fill: '#fffdf6', fillStyle: 'solid', stroke: 'none' });
    });
    c.drawImage(e.cv, x - W2 - e.pad, y - H2 - e.pad);
  };
  /** 줄 지울 때 노랑 크레용 지그재그 */
  S.zigzag = function (c, x, y, w, h, horiz = true, col = '#ffd23f') {
    const W2 = Math.round(w), H2 = Math.round(h);
    const e = sprite(`zz|${W2}|${H2}|${horiz}|${S.seed()}`, W2, H2, 6, (cc, rc) => {
      const pts = [], n = Math.max(6, Math.round((horiz ? W2 : H2) / 14));
      for (let i = 0; i <= n; i++) { const f = i / n; pts.push(horiz ? [W2 * f, i % 2 ? H2 * 0.15 : H2 * 0.85] : [i % 2 ? W2 * 0.15 : W2 * 0.85, H2 * f]); }
      rc.linearPath(pts, { seed: 2 + S.seed(), stroke: col, strokeWidth: 5, roughness: 1.1 });
    });
    c.drawImage(e.cv, x - e.pad, y - e.pad);
  };
  /** 풍이 (풍년 마스코트 낙서) */
  S.pungi = function (c, x, y, s, t = now(), mood) {
    if (JE.art && JE.art.draw(c, 'pungi_' + (mood || 'cheer'), x, y - s * 0.15 + Math.sin(t * 5) * s * 0.03, s * 1.55, s * 1.55, { rot: Math.sin(t * 4) * 0.05 })) return; // 11-23 Gemini 풍이
    const wv = Math.sin(t * 4) * 0.15;
    c.save(); c.strokeStyle = S.C.ink; c.lineWidth = Math.max(2, s * 0.035); c.lineCap = 'round';
    c.beginPath(); c.moveTo(x - s * 0.4, y); c.lineTo(x - s * 0.68, y - s * (0.4 + wv)); c.moveTo(x + s * 0.4, y); c.lineTo(x + s * 0.68, y - s * (0.4 - wv)); c.stroke(); c.restore();
    JE.jelly(c, x, y, s * 0.9, s * 0.9, '#ffc93a');
    c.save(); c.translate(x, y + s * 0.05); B.face(c, s * 0.9, s * 0.9, 'happy'); c.restore();
    S.sprout(c, x, y - s * 0.52, s * 0.42);
  };

  /* ---------- 10. 마크 ---------- */
  B.markSVG = function (size = 28) {
    return `<svg width="${size}" height="${size}" viewBox="0 0 64 64" aria-hidden="true"><path d="M32 18c-2-6-8-9-13-8 1 5 6 9 13 8z" fill="#7fd84a" stroke="#2b2b2b" stroke-width="2.4" stroke-linejoin="round"/><path d="M32 18c2-6 8-9 13-8-1 5-6 9-13 8z" fill="#9be26a" stroke="#2b2b2b" stroke-width="2.4" stroke-linejoin="round"/><path d="M14 21c10-3 26-2 36 0 5 1 6 6 6 14 0 10-1 18-6 20-10 3-26 3-36 0-5-2-6-10-6-20 0-8 1-13 6-14z" fill="#ffc93a" stroke="#2b2b2b" stroke-width="2.6"/><path d="M14 30l8-7M14 40l18-16M16 50l26-24M26 54l26-24M38 54l16-14" stroke="#f2a900" stroke-width="2.4" stroke-linecap="round" opacity=".7"/><circle cx="25" cy="38" r="3.2" fill="#2b2b2b"/><circle cx="39" cy="38" r="3.2" fill="#2b2b2b"/><path d="M28.5 44q3.5 3 7 0" stroke="#2b2b2b" stroke-width="2.4" fill="none" stroke-linecap="round"/><ellipse cx="19" cy="44" rx="3.4" ry="2.2" fill="#ff6e8c" opacity=".5"/><ellipse cx="45" cy="44" rx="3.4" ry="2.2" fill="#ff6e8c" opacity=".5"/></svg>`;
  };
  B.markHTML = function () { return `<div class="pg-mark">${B.markSVG(24)}<span><b>풍년</b> 낙서공방</span></div>`; };

  /* ---------- 11. 아이콘 틀: 공책 종이 + 가운데 그림 + 오른쪽 위 마크 ---------- */
  B.drawIcon = function (c, S0, motif, o = {}) {
    c.save(); c.fillStyle = S.C.paper; c.fillRect(0, 0, S0, S0);
    c.strokeStyle = S.C.line; c.lineWidth = S0 * 0.006; for (let y = S0 * 0.12; y < S0; y += S0 * 0.11) { c.beginPath(); c.moveTo(0, y); c.lineTo(S0, y); c.stroke(); }
    c.strokeStyle = S.C.margin; c.lineWidth = S0 * 0.008; c.beginPath(); c.moveTo(S0 * 0.1, 0); c.lineTo(S0 * 0.1, S0); c.stroke();
    if (motif) motif(c, S0 / 2, S0 * 0.52, S0 * 0.66);
    if (o.badge !== false) B.drawMark(c, S0 * 0.86, S0 * 0.14, S0 * 0.16);
    c.restore();
  };

  /* ---------- 12. 화면 HTML 스타일 (모달·버튼) ---------- */
  const F = JE.FONT, INK = S.C.ink;
  const scribble = (col) => `url("data:image/svg+xml,${encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' width='40' height='40'><path d='M-5 15L15 -5M-5 35L35 -5M5 45L45 5M25 45L45 25' stroke='${col}' stroke-width='5' stroke-linecap='round'/></svg>`)}")`;
  const paperBg = `repeating-linear-gradient(transparent 0 27px,${S.C.line} 27px 28px)`;
  B.css = `
  :root{--pg-ink:${INK};--pg-paper:${S.C.paper}}

    border:2.5px solid ${INK}!important;border-radius:22px 26px 20px 28px/26px 20px 28px 22px!important;
    box-shadow:5px 7px 0 rgba(60,40,20,.18)!important;padding-top:26px!important;transform:rotate(-.4deg)}
  .je-card::before{content:'';position:absolute;left:50%;top:-10px;width:96px;height:22px;margin-left:-48px;background:rgba(255,201,58,.75);transform:rotate(-3deg);border-left:2px dashed rgba(0,0,0,.08);border-right:2px dashed rgba(0,0,0,.08)}
  .je-card::-webkit-scrollbar{display:none}

    border-radius:18px 22px 16px 24px/22px 16px 24px 18px!important;background:${scribble('rgba(240,150,0,.35)')},#ffd65a!important;
    box-shadow:3px 4px 0 ${INK}!important}

  .je-btn.ad,.je-btn.alt{background:${scribble('rgba(0,120,200,.3)')},#8fd8ff!important}
  .je-btn.ad::before{content:'AD';display:inline-block;font:700 12px ${F};color:#fff;background:${INK};border-radius:6px;padding:1px 5px;margin-right:6px;vertical-align:3px}
  .je-btn.ghost{background:#fffdf6!important;color:${INK}!important;box-shadow:2px 3px 0 rgba(43,43,43,.5)!important}
  .je-toast{background:#fffdf6!important;color:${INK}!important;border:2.5px solid ${INK};font-family:${F}!important;font-weight:700;box-shadow:3px 4px 0 rgba(43,43,43,.3)}
  .je-tag{background:#fffdf6!important;color:${INK}!important;border:2px solid ${INK};border-radius:8px!important;font-family:${F}!important;font-weight:700!important}

  .pg-mark b{color:${INK}}

  .pg-stats b{color:${INK}}
  .pg-tip{color:${INK}!important;font-weight:700}
  @media (max-height:740px){.je-card{padding-top:18px!important}.pg-mark{margin-bottom:4px}.pg-dots{margin:0 0 4px}.pg-dot{width:24px;height:19px}.pg-title{font-size:50px;margin:0 0 2px}.je-card p{font-size:15px;line-height:1.3;margin:2px 0 8px}.je-btn{padding:11px!important;margin-top:8px!important;font-size:21px!important}.pk-row{margin:8px 0 0!important}}
  .pg-pungi{display:block;width:64px;height:auto;margin:-6px auto -2px;animation:pgBob 1.6s ease-in-out infinite}.pg-pungi-s{width:56px}

  // 홈·결과 HTML: 젤리 점은 단색 크레용 칠로
  const crayonDot = col => `<span class="pg-dot" style="background-color:${col}"></span>`;
  B.homeHTML = function ({ title, desc = '', best = 0, colors = B.JELLY.slice(0, 5), extra = '' }) {
    const pg = JE.art ? JE.art.tag('pungi_happy', 'pg-pungi') : '';
    return `${B.markHTML()}${pg}<div class="pg-dots">${colors.map(crayonDot).join('')}</div><div class="pg-title">${title}</div>
      ${desc ? `<p>${desc}</p>` : ''}<div class="pg-best">BEST <b>${Number(best).toLocaleString()}</b></div>${extra}`;
  };
  B.resultHTML = function ({ title = '결과', isNew = false, grade = null, score = 0, stats = [], best = 0, tip = '' }) {
    const pg = JE.art ? JE.art.tag(isNew ? 'pungi_cheer' : 'pungi_happy', 'pg-pungi pg-pungi-s') : '';
    return `${isNew ? '<span class="je-tag pg-new">신기록!</span>' : ''}${pg}<h2>${title}</h2>
      ${grade ? `<div class="pg-grade" style="background-color:${grade.col}">${grade.g}</div>` : ''}
      <div class="je-big pg-score">${Number(score).toLocaleString()}</div>
      ${stats.length ? `<div class="pg-stats">${stats.map(([k, v]) => `<span>${k} <b>${v}</b></span>`).join('')}</div>` : ''}
      <div class="pg-best">BEST <b>${Math.max(best, score).toLocaleString()}</b></div>
      ${tip ? `<p class="pg-tip">${tip}</p>` : ''}`;
  };

  /* ---------- 13. 게임마다 다른 공책 (11-22, 앱 10개가 한 틀로 보이지 않게) ----------
   * paper: 종이색, kind: lines(줄)·grid(모눈)·dots(점)·plain(무지), lc: 선색, ac: 강조색(제목 그림자·시작 버튼·테이프), margin: 빨간 여백선 */
  S.THEMES = {
    jellystack:     { paper: '#fbf6ea', kind: 'lines', lc: 'rgba(90,140,210,.26)', ac: '#ffc93a', margin: true },
    blockpung:      { paper: '#f3f8f1', kind: 'grid',  lc: 'rgba(80,160,120,.22)', ac: '#7fd84a', margin: false },
    hapchyeoten:    { paper: '#fff8d6', kind: 'lines', lc: 'rgba(200,150,40,.28)', ac: '#ff9440', margin: true },
    jumppung:       { paper: '#eef6fd', kind: 'lines', lc: 'rgba(70,130,200,.24)', ac: '#5ccbff', margin: false },
    omokpung:       { paper: '#f6efe0', kind: 'plain', lc: 'rgba(140,110,70,.0)',  ac: '#e0b070', margin: false },
    ddeokpung:      { paper: '#fbf0f2', kind: 'dots',  lc: 'rgba(200,90,120,.30)', ac: '#ff9ab0', margin: false },
    bangulpung:     { paper: '#eff8fb', kind: 'dots',  lc: 'rgba(60,150,190,.30)', ac: '#36b9ff', margin: false },
    taengtaengpung: { paper: '#f5f1fb', kind: 'grid',  lc: 'rgba(130,100,200,.20)', ac: '#9d6bff', margin: false },
    dotpung:        { paper: '#fdfdfb', kind: 'dots',  lc: 'rgba(60,60,60,.22)',   ac: '#ff5e7e', margin: false },
    miklpung:       { paper: '#f1f8ea', kind: 'lines', lc: 'rgba(110,170,80,.28)', ac: '#9ee05a', margin: true },
  };
  S.theme = S.THEMES.jellystack;
  B.bg = function (c, cam = 0, W = JE.W, H = JE.H) {
    const T = S.theme;
    c.drawImage(paperNoise(W, H), 0, 0, W, H);
    const gap = 28, oy = ((cam * 0.35) % gap + gap) % gap;
    c.strokeStyle = T.lc; c.fillStyle = T.lc; c.lineWidth = 1;
    if (T.kind === 'lines' || T.kind === 'grid') { c.beginPath(); for (let y = oy; y < H; y += gap) { c.moveTo(0, y); c.lineTo(W, y + 0.6); } c.stroke(); }
    if (T.kind === 'grid') { c.beginPath(); for (let x = 14; x < W; x += gap) { c.moveTo(x, 0); c.lineTo(x + 0.6, H); } c.stroke(); }
    if (T.kind === 'dots') { for (let y = oy; y < H; y += gap) for (let x = 14; x < W; x += gap) { c.beginPath(); c.arc(x, y, 1.4, 0, Math.PI * 2); c.fill(); } }
    if (T.margin) { c.strokeStyle = S.C.margin; c.lineWidth = 1.3; c.beginPath(); c.moveTo(30 + JE.safe.left, 0); c.lineTo(31 + JE.safe.left, H); c.stroke(); }
  };
  JE.bg = c => B.bg(c, 0);
  const baseJEInit = JE.init;
  JE.init = function (opts) {
    const T = S.THEMES[opts && opts.gameId];
    if (T) {
      S.theme = T; S.C.paper = T.paper; B.C.wall0 = T.paper; paperCv = null;
      const sc = col => `url("data:image/svg+xml,${encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' width='40' height='40'><path d='M-5 15L15 -5M-5 35L35 -5M5 45L45 5M25 45L45 25' stroke='${col}' stroke-width='5' stroke-linecap='round'/></svg>`)}")`;
      const cardBg = T.kind === 'lines' ? `repeating-linear-gradient(transparent 0 27px,${T.lc} 27px 28px)` : T.kind === 'grid' ? `repeating-linear-gradient(transparent 0 27px,${T.lc} 27px 28px),repeating-linear-gradient(90deg,transparent 0 27px,${T.lc} 27px 28px)` : T.kind === 'dots' ? `radial-gradient(${T.lc} 1.3px,transparent 1.6px) 0 0/28px 28px` : 'none';
      B.css += `
  html,body,#cv,canvas{background:${T.paper}!important}
  .je-card{background:${cardBg},#fffdf6!important}
  .je-card::before{background:${T.ac}cc!important}
  .pg-title{text-shadow:3px 3px 0 ${T.ac}!important}
  .je-btn:not(.ghost):not(.ad):not(.alt){background:${sc('rgba(0,0,0,.16)')},${T.ac}!important}`;
      try { const st = document.getElementById('pg-brand'); if (st) st.textContent = B.css; } catch (e) {}
      try { const m = document.querySelector('meta[name=theme-color]'); if (m) m.content = T.paper; } catch (e) {}
    }
    return baseJEInit.apply(this, arguments);
  };
  // 엔진 UI 가 이미 초기화돼 있으면(드묾) 스타일을 바로 바꿔 끼움
  try { const st = document.getElementById('pg-brand'); if (st) st.textContent = B.css; } catch (e) {}
  try { let m = document.querySelector('meta[name=theme-color]'); if (m) m.content = S.C.paper; } catch (e) {}
})();

/* =========================================================================
 * 풍년 그림 (JE.art) — Gemini 로 뽑은 손그림 PNG 를 게임에 넣는 도우미 (11-23)
 *  - 그림 데이터: engine/art/common.js (풍이·버튼) + <게임>/art/art.js (게임별). build.py 가 붙임
 *  - 그림이 없거나 아직 안 불러졌으면 draw 가 false 를 돌려줌 → 게임은 원래 코드 그림으로 그림
 * ========================================================================= */
(function () {
  const A = JE.art = { img: {}, ok: {}, size: {} };
  A.add = function (k, src) {
    const im = new Image();
    im.onload = () => { A.ok[k] = 1; A.size[k] = [im.naturalWidth, im.naturalHeight]; };
    im.src = src; A.img[k] = im;
  };
  A.has = k => !!A.ok[k];
  /** 가운데 기준으로 w×h 상자 안에 비율 유지해서 그림. o: {fit:'stretch'|'width'|'height', sx, sy, rot, alpha, ax, ay(0~1 기준점)} */
  A.draw = function (c, k, x, y, w, h, o) {
    if (!A.ok[k]) return false;
    o = o || {};
    const im = A.img[k], [iw, ih] = A.size[k];
    let dw = w, dh = h;
    if (o.fit !== 'stretch') {
      const r = o.fit === 'width' ? w / iw : o.fit === 'height' ? h / ih : Math.min(w / iw, h / ih);
      dw = iw * r; dh = ih * r;
    }
    const ax = o.ax == null ? 0.5 : o.ax, ay = o.ay == null ? 0.5 : o.ay;
    c.save();
    if (o.alpha != null) c.globalAlpha *= o.alpha;
    c.translate(x, y);
    if (o.rot) c.rotate(o.rot);
    if (o.sx != null || o.sy != null) c.scale(o.sx == null ? 1 : o.sx, o.sy == null ? 1 : o.sy);
    c.drawImage(im, -dw * ax, -dh * ay, dw, dh);
    c.restore();
    return true;
  };
  /** 가로로 긴 블록: 양 끝은 그대로, 가운데 얼굴은 한가운데 그대로, 그 사이는 몸통 무늬를 이어 붙임 */
  A.drawBar = function (c, k, x, y, w, h, o) {
    if (!A.ok[k]) return false;
    o = o || {};
    const im = A.img[k], [iw, ih] = A.size[k];
    const sc = h / ih, capW = iw * 0.24, faceW = iw * 0.52, stripX = iw * 0.24, stripW = iw * 0.02;
    const dCap = capW * sc, dFace = faceW * sc;
    if (w <= iw * sc + 1) return A.draw(c, k, x + w / 2, y + h / 2, w, h, Object.assign({ fit: 'stretch' }, o));
    c.save();
    if (o.alpha != null) c.globalAlpha *= o.alpha;
    // 한 픽셀씩 겹쳐 그려 이음새 틈을 막음
    c.drawImage(im, 0, 0, capW, ih, x, y, dCap + 0.5, h);
    c.drawImage(im, iw - capW, 0, capW, ih, x + w - dCap - 0.5, y, dCap + 0.5, h);
    const fx = x + (w - dFace) / 2;
    c.drawImage(im, stripX, 0, stripW, ih, x + dCap - 0.5, y, fx - (x + dCap) + 1, h);
    c.drawImage(im, iw - stripX - stripW, 0, stripW, ih, fx + dFace - 0.5, y, (x + w - dCap) - (fx + dFace) + 1, h);
    c.drawImage(im, (iw - faceW) / 2, 0, faceW, ih, fx, y, dFace, h);
    c.restore();
    return true;
  };
  /** HTML 용 <img> 태그 (홈·결과 화면) */
  A.tag = function (k, cls, style) {
    const im = A.img[k]; if (!im) return '';
    return `<img class="${cls || ''}" src="${im.src}" style="${style || ''}" alt="" draggable="false">`;
  };
})();

/* ==========================================================================
 * 풍년 게임 진행 키트 (JE.kit)  v1.0
 * - src.html 에 <!--KIT--> 자리가 있으면 build.py 가 엔진·디자인 뒤에 붙인다.
 * - 들어 있는 것
 *   1) 광고: 블록 블라스트식. 하트 없음, 보상형 이어하기 한 판 1번,
 *      전면광고는 '한 판 더'를 누를 때만 3판마다(2분 간격), 배너는 홈·결과에서만.
 *   2) 흐름: 홈 → 시작 → (실패 → 이어하기?) → 결과 → 한 판 더 / 랭킹 / 처음으로
 *   3) 연출: 큰 팝 글자, 색종이, 화면 번쩍
 *   4) HUD: 진녹색 띠 + BEST · 점수 · 일시정지 (풍년 공통)
 * ========================================================================== */
(function () {
  'use strict';
  const JE = window.JE, B = JE.brand, C = B.C;
  const K = {}; JE.kit = K;
  const rnd = (a, b) => a + Math.random() * (b - a);
  K.rnd = rnd;

  /* ---------------- 1. 광고 ---------------- */
  K.AD = { EVERY: 3, MIN_GAP: 120 };
  K.ad = { games: 0, lastInter: 0 };
  K.interDue = () => K.ad.games >= K.AD.EVERY && K.ad.games % K.AD.EVERY === 0 && (Date.now() - K.ad.lastInter) / 1000 >= K.AD.MIN_GAP;
  K.showInter = function () {
    K.ad.lastInter = Date.now();
    const AIT = window.__AIT__;
    if (AIT && AIT.showInterstitialAd) return Promise.resolve(AIT.showInterstitialAd()).catch(() => {});
    return new Promise(res => {
      let left = 2, timer;
      const m = JE.ui.modal('<span class="je-tag">광고 목업</span><h2>전면 광고</h2><p>실제 앱에서는 판 사이에 여기서 광고가 나와요.</p><div class="je-big" id="pk-ad-c">2</div>',
        [{ label: '닫기', cls: 'ghost', onClick: () => { clearInterval(timer); res(); } }]);
      timer = setInterval(() => { left--; const el = m.el.querySelector('#pk-ad-c'); if (el) el.textContent = left; if (left <= 0) { clearInterval(timer); m.close(); res(); } }, 1000);
    });
  };
  let bannerEl = null;
  K.banner = function (on) {
    document.body.classList.toggle('pk-has-banner', on);
    const AIT = window.__AIT__;
    if (AIT && AIT.showBanner) { try { on ? AIT.showBanner() : AIT.hideBanner(); } catch (e) {} return; }
    if (!bannerEl) {
      const s = document.createElement('style');
      s.textContent = `.pk-banner{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--sab,0px) + 8px);width:min(360px,calc(100% - 24px));height:56px;border-radius:12px;background:${C.dark};border:2px dashed rgba(255,255,255,.25);color:${C.sub};font:700 12px ${JE.FONT};display:none;align-items:center;justify-content:center;z-index:70;pointer-events:none}
      .pk-banner.on{display:flex} body.pk-has-banner .je-ov{padding-bottom:calc(var(--sab,0px) + 76px)!important}`;
      document.head.appendChild(s);
      bannerEl = document.createElement('div'); bannerEl.className = 'pk-banner'; bannerEl.textContent = '배너 광고 자리 (홈·결과 화면에서만)';
      document.body.appendChild(bannerEl);
    }
    bannerEl.classList.toggle('on', on);
  };

  /* ---------------- 2. 흐름 ----------------
   * o = { title, desc, colors, onHome(), onStart(), onRevive(), continueDesc,
   *       score(), stats() -> [[라벨,값]], tip(), grade() -> {g,col}, resultTitle }
   * 게임은 F.state 를 보고 플레이 중인지 판단한다 ('play' 일 때만 진행) */
  K.flow = function (o) {
    const F = { state: 'home', continued: false, o };
    F.home = function () {
      F.state = 'home'; o.onHome && o.onHome();
      const btns = [{ label: '시작하기', onClick: () => F.start() }];
      if (o.homeButtons) btns.push(...o.homeButtons(F));
      btns.push({ label: '랭킹 보기', cls: 'ghost', onClick: () => F.rank() });
      const hm = JE.ui.modal(B.homeHTML({ title: o.title, desc: o.desc, best: JE.best.get('main'), colors: o.colors || B.JELLY.slice(0, 5), extra: K.meta.homeExtra() }), btns);
      K.meta.bind(hm, F);
      K.banner(true);
    };
    K.meta.setup(o);
    F.start = function (arg) {
      K.banner(false); K.ad.games++; F.continued = false; F.state = 'play';
      K.clearFx(); JE.sfx.ready(); o.onStart(arg);
    };
    F.again = async function () { if (K.interDue()) await K.showInter(); F.start(); };
    F.pause = function () {
      if (F.state !== 'play') return;
      F.state = 'pause'; o.onPause && o.onPause();
      JE.ui.modal('<h2>일시정지</h2><p>잠깐 쉬어 가요.</p>', [
        { label: '계속하기', onClick: () => { F.state = 'play'; o.onResume && o.onResume(); } },
        { label: JE.audio.muted ? '소리 켜기' : '소리 끄기', cls: 'ghost', keepOpen: true, onClick: el => { el.textContent = JE.audio.toggle() ? '소리 켜기' : '소리 끄기'; } },
        JE.motion.button(),
        { label: '그만하기', cls: 'ghost', onClick: () => F.over() },
      ]);
    };
    /** 실패. delay 초 뒤에 이어하기 제안(한 판 1번) 또는 결과 */
    F.fail = function (title = '아쉬워요!', delay = 1.1) {
      if (F.state !== 'play') return;
      F.state = 'fail';
      JE.haptic('error'); JE.shake.add(8);
      setTimeout(() => {
        if (!F.continued && o.onRevive) {
          JE.ui.modal(`<h2>${title}</h2><div class="je-big">${Math.round(o.score()).toLocaleString()}</div><p>${o.continueDesc || '광고를 보면 이어서 할 수 있어요.'}<br>(한 판에 1번)</p>`, [
            { label: '광고 보고 이어하기', cls: 'ad', onClick: async () => { if (await JE.ads.rewarded('continue')) { F.continued = true; F.state = 'play'; JE.sfx.coin(); o.onRevive(); } else F.over(); } },
            { label: '결과 보기', cls: 'ghost', onClick: () => F.over() },
          ]);
        } else F.over();
      }, delay * 1000);
    };
    F.over = function () {
      F.state = 'over'; o.onOver && o.onOver();
      const s = Math.round(o.score()), prev = JE.best.get('main');
      const isNew = s > 0 && JE.best.submit(s, 'main');
      if (isNew) { JE.sfx.fanfare(); JE.haptic('success'); K.confetti(80); } else JE.sfx.over();
      K.banner(true);
      const mdone = K.meta.endRun(o.missionStats ? o.missionStats() : {}, s);
      const rm = JE.ui.modal(B.resultHTML({ title: o.resultTitle ? o.resultTitle() : '결과', isNew, grade: o.grade ? o.grade(s) : null, score: s, best: prev, tip: o.tip ? o.tip() : '', stats: o.stats ? o.stats() : [] }) + K.meta.resultExtra(mdone), [
        { label: K.interDue() ? '한 판 더 <small style="opacity:.7">(광고 후 시작)</small>' : '한 판 더', onClick: () => F.again() },
        { label: '랭킹 보기', cls: 'ghost', onClick: () => F.rank() },
        { label: '처음으로', cls: 'ghost', onClick: () => F.home() },
      ]);
      K.meta.bind(rm, F);
    };
    F.rank = async function () {
      K.banner(false);
      try { await JE.sdk.openLeaderboard('main'); } catch (e) { await JE.ui.leaderboard('main'); }
      F.home();
    };
    F.playing = () => F.state === 'play';
    return F;
  };

  /* ---------------- 2-1. 오늘의 미션 · 연속 출석 · 모어게임 (11-22 추가) ----------------
   * 일일 미션·연속 출석·자사 게임 목록은 캐주얼 게임에서 흔한 공통 기능(특정 게임 참고 표기 안 함, 법률 검토 11-22)
   * 게임은 K.flow 옵션에
   *   missions: [{ k:'chain', t:'한 판에 연쇄 {n}번', goals:[2,3,4], mode:'run'|'day' }, ...]  (mode 기본 'run' = 한 판 최고, 'day' = 오늘 합계)
   *   scoreGoals: [쉬움, 보통, 어려움]  (한 판 점수 미션 목표)
   *   missionStats: () => ({ chain: 3, ... })   판이 끝날 때 값
   * 을 넣으면 된다. K.flow 를 안 쓰는 게임은 K.meta.setup / homeExtra / resultExtra / endRun / bind 를 직접 부른다.
   * 미션 보상은 '도장'(3개 다 하면 오늘 도장 1개 → 연속 출석). 점수에는 영향 없음(랭킹 공정). */
  K.GAMES = [
    { id: 'jellystack', name: '젤리풍', d: '톡! 말랑 젤리 탑 쌓기', c: [3, 0, 4], url: '../jellystack/' },
    { id: 'blockpung', name: '블락풍', d: '젤리 블록 끼워 줄 지우기', c: [5, 2, 0], url: '../blockpung/' },
    { id: 'hapchyeoten', name: '열풍', d: '이어서 합이 10이면 톡', c: [1, 3, 2], url: '../hapchyeoten/' },
    { id: 'ddeokpung', name: '떡풍', d: '떨어뜨려 떡 합체', c: [2, 1, 0], url: '../ddeokpung/' },
    { id: 'dotpung', name: '도트풍', d: '젤리 슈터로 도트 그림 지우기', c: [0, 4, 2], url: '../dotpung/' },
    { id: 'bangulpung', name: '방울풍', d: '쏘아서 같은 색 방울 펑', c: [0, 4, 3], url: '../bangulpung/' },
    { id: 'taengtaengpung', name: '탱탱풍', d: '공을 줄줄이 쏴서 블록 깨기', c: [5, 0, 1], url: '../taengtaengpung/' },
    { id: 'jumppung', name: '점프풍', d: '톡 한 칸, 꾹 두 칸 점프', c: [4, 2, 0], url: '../jumppung/' },
    { id: 'miklpung', name: '미끌풍', d: '밀어서 떨어뜨려 줄 채우기', c: [5, 4, 0], url: '../miklpung/' },
    { id: 'omokpung', name: '오목풍', d: '컴퓨터 젤리와 오목 한 판', c: [0, 5, 2], url: '../omokpung/' },
  ];
  const M = K.meta = { cfg: null };
  const dayNum = d => Math.floor((Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())) / 864e5);
  const today = () => dayNum(new Date());
  const hash = s => { let h = 2166136261; for (const ch of String(s)) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; };
  M.isWeekend = () => { const w = new Date().getDay(); return w === 0 || w === 6; };
  M.setup = function (o) {
    const sg = o.scoreGoals || [300, 1000, 3000];
    M.cfg = { pool: [{ k: 'plays', t: '오늘 {n}판 하기', goals: [3, 4, 5], mode: 'day' }, { k: 'score', t: '한 판에 {n}점', goals: sg, mode: 'run' }].concat(o.missions || []) };
  };
  M.pick = function (rng, used, slot) {
    let left = M.cfg.pool.filter(p => !used.includes(p.k)); if (!left.length) left = M.cfg.pool;
    const p = left[Math.floor(rng() * left.length)];
    const n = p.goals[Math.min(slot, p.goals.length - 1)];
    return { k: p.k, n, v: 0, done: false, rr: false, t: p.t.replace('{n}', Number(n).toLocaleString()), mode: p.mode || 'run' };
  };
  M.load = function () {
    if (!M.cfg) M.setup({});
    let d = JE.store.get('meta', null);
    const t = today();
    if (!d) d = { day: -1, list: [], streak: 0, lastDone: -99, stamps: [], allDone: false };
    if (d.day !== t) {
      const rng = JE.rng(hash((JE.gameId || '') + t)), list = [];
      for (let i = 0; i < 3; i++) list.push(M.pick(rng, list.map(x => x.k), i));
      if (M.isWeekend()) { const b = M.pick(rng, list.map(x => x.k), 2); b.bonus = true; list.push(b); }
      d.day = t; d.list = list; d.allDone = false;
      if (d.lastDone < t - 1) d.streak = 0; // 하루 빠지면 연속 끊김
    }
    M.d = d; return d;
  };
  M.save = () => JE.store.set('meta', M.d);
  M.main = () => M.d.list.filter(m => !m.bonus);
  M.doneCount = () => M.main().filter(m => m.done).length;
  /** 판이 끝날 때. 반환: 이번에 새로 끝낸 미션들 + 오늘 도장 받았는지 */
  M.endRun = function (stats, score) {
    M.load();
    const st = Object.assign({ plays: 1, score: score || 0 }, stats || {});
    const newly = [];
    for (const m of M.d.list) {
      if (m.done) continue;
      const v = Number(st[m.k]) || 0;
      m.v = m.mode === 'day' ? m.v + v : Math.max(m.v, v);
      if (m.v >= m.n) { m.v = m.n; m.done = true; newly.push(m); }
    }
    let stamp = false;
    if (!M.d.allDone && M.main().every(m => m.done)) {
      M.d.allDone = true; stamp = true;
      M.d.streak = M.d.lastDone === M.d.day - 1 ? M.d.streak + 1 : 1;
      M.d.lastDone = M.d.day;
      M.d.stamps = (M.d.stamps || []).filter(x => x > M.d.day - 30).concat(M.d.day);
    }
    M.save();
    if (newly.length) setTimeout(() => { JE.sfx.coin(); JE.haptic('success'); if (stamp) { K.confetti(60); JE.sfx.fanfare(); } }, 450);
    return { newly, stamp };
  };
  M.css = function () {
    if (M._css) return; M._css = 1;
    const s = document.createElement('style');
    s.textContent = `.pk-row{display:flex;gap:8px;margin:12px 0 2px}.pk-row button{flex:1;min-height:44px;border:3px solid ${C.deep};border-radius:14px;background:rgba(0,0,0,.22);color:#fff;font:800 14px ${JE.FONT};box-shadow:0 3px 0 ${C.deep};cursor:pointer}
    .pk-row button:active{transform:translateY(3px);box-shadow:none}.pk-row b{color:${C.gold}}
    .pk-mis{list-style:none;margin:10px 0;padding:0;text-align:left}.pk-mis li{background:rgba(0,0,0,.2);border-radius:12px;padding:9px 11px;margin:6px 0;font:700 14px ${JE.FONT};color:#fff}
    .pk-mis .bar{height:7px;border-radius:4px;background:rgba(255,255,255,.12);margin-top:6px;overflow:hidden}.pk-mis .bar i{display:block;height:100%;background:linear-gradient(90deg,#8fdc4a,#36d6a0);border-radius:4px}
    .pk-mis li.done{background:rgba(143,220,74,.18)}.pk-mis li.new{outline:2px solid ${C.gold};animation:pkpop .5s}.pk-mis .r{float:right;color:${C.sub};font-size:12px}.pk-mis li.done .r{color:#8fdc4a}
    .pk-mis .bonus{font-size:11px;background:${C.gold};color:${C.ink};border-radius:6px;padding:1px 5px;margin-right:5px}
    .pk-mis .rr{float:right;margin:-3px 0 0 6px;border:0;border-radius:8px;background:#3ec5ff;color:${C.ink};font:900 11px ${JE.FONT};padding:4px 7px;min-height:26px;cursor:pointer}
    .pk-stamps{display:flex;justify-content:center;gap:6px;margin:8px 0}.pk-stamps span{width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;font:900 11px ${JE.FONT};color:${C.sub}}
    .pk-stamps span.on{background:radial-gradient(circle at 35% 30%,#fff3b0,#ffd23f 55%,#c49a00);color:${C.ink}}
    .pk-games{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}.pk-games a{display:block;text-decoration:none;background:rgba(0,0,0,.22);border:2px solid ${C.deep};border-radius:14px;padding:10px 8px;color:#fff;text-align:center;min-height:44px}
    .pk-games a:active{transform:scale(.97)}.pk-games .dots{display:flex;justify-content:center;gap:3px;margin-bottom:5px}.pk-games .dots i{width:16px;height:16px;border-radius:50%;display:block}
    .pk-games b{display:block;font:900 16px ${JE.FONT}}.pk-games small{word-break:keep-all;display:block;font:700 11px ${JE.FONT};color:${C.sub};margin-top:2px;line-height:1.3}
    .pk-note{word-break:keep-all;font-size:12px!important;color:${C.sub}!important;margin:4px 0!important}
    @keyframes pkpop{0%{transform:scale(.9)}60%{transform:scale(1.04)}100%{transform:scale(1)}}`;
    document.head.appendChild(s);
  };
  const misLI = (m, o = {}) => `<li class="${m.done ? 'done' : ''}${o.isNew ? ' new' : ''}">${m.bonus ? '<span class="bonus">주말</span>' : ''}${m.t}
      ${o.reroll && !m.done && !m.rr ? `<button class="rr" data-rr="${o.i}">AD 바꾸기</button>` : ''}<span class="r">${m.done ? '완료!' : `${Number(m.v).toLocaleString()} / ${Number(m.n).toLocaleString()}`}</span>
      <div class="bar"><i style="width:${Math.min(100, m.v / m.n * 100)}%"></i></div></li>`;
  M.homeExtra = function () {
    M.css(); M.load();
    return `<div class="pk-row"><button data-pk="mis">오늘의 미션 <b>${M.doneCount()}/3</b></button><button data-pk="games">다른 게임</button></div>
      ${M.d.streak > 0 ? `<p class="pk-note">연속 출석 ${M.d.streak}일${M.d.allDone ? ' · 오늘 도장 완료' : ''}</p>` : ''}`;
  };
  M.resultExtra = function (r) {

      ${r && r.stamp ? `<p class="pg-tip">오늘의 미션 3개 완료! 도장 쾅 · 연속 ${M.d.streak}일</p>` : ''}
      <div class="pk-row"><button data-pk="games">풍년 게임 더보기</button></div>`;
  };
  M.stampsHTML = function () {
    const t = M.d.day, set = new Set(M.d.stamps || []), names = ['일', '월', '화', '수', '목', '금', '토'];
    let h = '';
    for (let i = 6; i >= 0; i--) { const d = t - i, w = names[new Date(d * 864e5).getUTCDay()]; h += `<span class="${set.has(d) ? 'on' : ''}">${i === 0 ? '오늘' : w}</span>`; }
    return `<div class="pk-stamps">${h}</div>`;
  };
  M.openMissions = function () {
    M.css(); M.load();
    const body = () => `<h2>오늘의 미션</h2><p class="pk-note">3개를 다 하면 오늘 도장! 매일 자정에 바뀌어요.${M.isWeekend() ? '<br>주말엔 보너스 미션이 하나 더 있어요.' : ''}</p>
      <ul class="pk-mis">${M.d.list.map((m, i) => misLI(m, { reroll: true, i })).join('')}</ul>
      ${M.stampsHTML()}<p class="pk-note">연속 출석 <b style="color:${C.gold}">${M.d.streak}일</b> · 미션은 한 개씩 하루 1번 광고 보고 바꿀 수 있어요.</p>`;
    const m = JE.ui.modal(body(), [{ label: '닫기', cls: 'ghost' }]);
    const wire = () => m.el.querySelectorAll('[data-rr]').forEach(b => b.onclick = async e => {
      e.stopPropagation();
      const i = +b.dataset.rr, cur = M.d.list[i];
      if (!(await JE.ads.rewarded('mission'))) return;
      const nm = M.pick(Math.random, M.d.list.map(x => x.k), Math.min(i, 2)); nm.rr = true; nm.bonus = cur.bonus;
      M.d.list[i] = nm; M.save();
      const btn = m.el.querySelector('.je-btn'); m.el.innerHTML = body(); m.el.appendChild(btn); wire();
      JE.sfx.coin();

    wire();
  };
  M.openGames = function () {
    M.css();
    const list = K.GAMES.filter(g => g.id !== JE.gameId);
    const card = g => `<a href="${g.url}" target="_blank" rel="noopener" data-g="${g.id}"><span class="dots">${g.c.map(i => `<i style="background:radial-gradient(circle at 35% 30%,${JE.shade(B.JELLY[i], 0.4)},${B.JELLY[i]} 60%)"></i>`).join('')}</span><b>${g.name}</b><small>${g.d}</small></a>`;
    const m = JE.ui.modal(`<h2>풍년 게임 더보기</h2><p class="pk-note">풍년 낙서공방의 다른 게임이에요. 누르면 바로 열려요.</p><div class="pk-games">${list.map(card).join('')}</div>`, [{ label: '닫기', cls: 'ghost' }]);
    m.el.querySelectorAll('[data-g]').forEach(a => a.addEventListener('click', e => {
      JE.sfx.tap();
      const AIT = window.__AIT__, g = K.GAMES.find(x => x.id === a.dataset.g);
      if (AIT && AIT.openGame) { e.preventDefault(); try { AIT.openGame(g.id, g.name); } catch (er) {} } // 스토어 앱: 그 게임의 스토어 페이지 열기 (native-bridge.js)
    }));
  };
  M.bind = function (modal) {
    if (!modal || !modal.el) return;
    modal.el.querySelectorAll('[data-pk]').forEach(b => b.onclick = e => {
      e.stopPropagation(); JE.sfx.tap();
      if (b.dataset.pk === 'mis') {
        M.openMissions();
        // 홈 버튼 숫자 갱신 (미션을 바꿨을 수 있음)
      } else M.openGames();

  };

  /* ---------------- 3. HUD ---------------- */
  K.rowY = () => JE.safe.top + 40;
  K.bandH = () => JE.safe.top + 88;
  /** 띠 + BEST·점수·일시정지. 반환: 일시정지 터치 영역 */
  K.hud = function (c, score, best, bandH = K.bandH()) {
    B.hudBand(c, bandH);
    return B.hudRow(c, K.rowY(), score, best);
  };
  K.hit = (r, p, pad = 8) => p.x >= r.x - pad && p.x <= r.x + r.w + pad && p.y >= r.y - pad && p.y <= r.y + r.h + pad;
  /** 두 번째 줄 알약들: [{t, fg}] 가운데 정렬 */
  K.badges = function (c, list, y) {
    c.font = B.font(12, 800); c.textBaseline = 'middle';
    const ws = list.map(b => c.measureText(b.t).width + 24), tot = ws.reduce((a, x) => a + x, 0) + (list.length - 1) * 8;
    let bx = JE.W / 2 - tot / 2;
    const SK = JE.sketch;
    list.forEach((b, i) => { if (SK) { c.fillStyle = '#fffdf6'; JE.roundRect(c, bx, y, ws[i], 22, 11); c.fill(); c.lineWidth = 1.5; c.strokeStyle = C.ink; c.stroke(); } else { c.fillStyle = 'rgba(255,255,255,.08)'; JE.roundRect(c, bx, y, ws[i], 22, 11); c.fill(); } c.fillStyle = SK ? SK.inkOf(b.fg || '#fff') : (b.fg || '#fff'); c.textAlign = 'center'; c.fillText(b.t, bx + ws[i] / 2, y + 11.5); bx += ws[i] + 8; });
  };

  /* ---------------- 4. 연출 (엔진 JE.fx 에 붙어서 자동으로 그려짐) ---------------- */
  const FX = K.FX = { pops: [], conf: [], flash: 0, flashCol: '255,255,255' };
  K.clearFx = () => { FX.pops = []; FX.conf = []; FX.flash = 0; JE.fx.parts = []; JE.fx.texts = []; JE.fx.rings = []; };
  /** 큰 팝 글자 (굵은 외곽선 + 위→아래 그라데이션) */
  K.pop = function (text, x, y, o = {}) {
    FX.pops.push({ text, x, y, size: o.size || 34, c1: o.c1 || '#fff6b0', c2: o.c2 || '#ffb21f', life: o.life || 1.0, t: -(o.delay || 0), rise: o.rise != null ? o.rise : 40 });
  };
  K.confetti = function (n = 60) { for (let i = 0; i < n; i++) FX.conf.push({ x: rnd(0, JE.W), y: rnd(-80, -10), vx: rnd(-60, 60), vy: rnd(120, 320), w: rnd(6, 11), h: rnd(10, 18), col: B.JELLY[i % 6], t: 0, life: rnd(1.6, 2.4), spin: rnd(-10, 10), a: rnd(0, 6) }); };
  K.flash = function (a = 0.4, rgb = '255,255,255') { a = JE.motion.k(a); if (a >= FX.flash) { FX.flash = a; FX.flashCol = rgb; } };
  const fu = JE.fx.update.bind(JE.fx), fr = JE.fx.render.bind(JE.fx);
  JE.fx.update = function (dt) {
    fu(dt);
    FX.pops = FX.pops.filter(p => (p.t += dt) < p.life);
    FX.conf = FX.conf.filter(p => { p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.a += p.spin * dt; return p.t < p.life; });
    FX.flash = Math.max(0, FX.flash - dt * 2.2);
  };
  JE.fx.render = function (c) {
    fr(c);
    for (const p of FX.conf) { c.save(); c.globalAlpha = Math.min(1, (p.life - p.t) * 2); c.translate(p.x, p.y); c.rotate(p.a); c.fillStyle = p.col; c.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); c.restore(); }
    for (const p of FX.pops) {
      if (p.t < 0) continue;
      const k = p.t / p.life, s = k < 0.18 ? JE.ease.outBack(k / 0.18) : 1;
      c.save(); c.globalAlpha = k > 0.7 ? 1 - (k - 0.7) / 0.3 : 1;
      c.translate(p.x, p.y - JE.ease.outCubic(k) * p.rise); c.scale(s, s);
      c.font = B.font(p.size); c.textAlign = 'center'; c.textBaseline = 'middle'; c.lineJoin = 'round';
      c.lineWidth = p.size * 0.22; c.strokeStyle = C.ink; c.strokeText(p.text, 0, 0);
      const g = c.createLinearGradient(0, -p.size / 2, 0, p.size / 2); g.addColorStop(0, p.c1); g.addColorStop(1, p.c2);
      c.fillStyle = g; c.fillText(p.text, 0, 0); c.restore();
    }
    if (FX.flash > 0) { c.fillStyle = `rgba(${FX.flashCol},${FX.flash * 0.45})`; c.fillRect(0, 0, JE.W, JE.H); }
  };

  /* ---------------- 5. 그림 도우미 ---------------- */
  /** 얼굴 있는 젤리 한 개 (cx, cy 가운데) */
  K.jellyFace = function (c, cx, cy, w, h, col, o = {}) {
    JE.jelly(c, cx, cy, w, h, col, o);
    c.save(); c.translate(cx, cy + h * (1 - (o.sy || 1)) / 2); c.scale(o.sx || 1, o.sy || 1);
    B.face(c, w, h, o.mood || 'normal', o.blink == null ? 1 : o.blink); c.restore();
  };
  /** 하단 안내 글 */
  K.hint = function (c, text, y) { c.font = B.font(13, 700); c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = C.sub; c.fillText(text, JE.W / 2, y); };
  /** 숫자 표시용 부드러운 따라가기 */
  K.ease = (cur, target, dt, k = 10) => cur + (target - cur) * Math.min(1, dt * k);
})();

</script>
<script>
(function () {
'use strict';
/* =========================================================================
 * 방울풍
 * 아래 대포에서 젤리 방울을 쏴서 같은 색 3개 이상을 붙이면 펑!
 *  - 끌어서 조준(벽에 한 번 튕기는 안내선), 손을 떼면 발사
 *  - 터진 방울에 매달려 있던 방울은 우르르 떨어져 보너스
 *  - 못 터뜨린 발이 쌓여 6발이 되면 한 줄이 밀려 내려옴 (11-22: 연속→누적, 점수 따라 5·4발로 줄어듦)
 *  - 방울이 빨간 선까지 내려오면 끝
 *  - 지금/다음 방울을 톡 눌러 바꾸기. 20개 터뜨릴 때마다 '폭탄 방울'
 * 차별점: 폭탄 방울 + 연속 펑 콤보 + 얼굴 있는 젤리 방울
 * ========================================================================= */
const B = JE.brand, BC = B.C, K = JE.kit, { clamp } = JE.util;
const canvas = document.getElementById('c');
const COLS = 9;
let DEAD = 12;
const COLORS = B.JELLY;
const L = {};
function layout(W, H) {
  L.W = W; L.H = H;
  L.d = Math.floor(Math.min((W - 28) / COLS, 46));
  L.rh = L.d * 0.866;
  L.bw = L.d * COLS; L.bx = Math.round((W - L.bw) / 2);
  L.top = K.bandH() + 22;
  DEAD = clamp(Math.floor((H - JE.safe.bottom - 80 - L.d * 2.3 - L.top) / L.rh), 10, 15);
  L.deadY = L.top + L.d / 2 + DEAD * L.rh - L.rh / 2;
  L.gunX = W / 2; L.gunY = Math.min(H - JE.safe.bottom - 70, L.deadY + L.d * 2.3);
  SPR = {};
}
const missLimit = () => Math.max(4, 6 - Math.floor(G.score / 5000)); // 11-22: 잘하면 줄이 안 내려와 끝없던 문제
const G = { rows: [], shift: 0, cur: 0, next: 0, shot: null, aim: null, miss: 0, score: 0, shown: 0, pops: 0, drops: 0, combo: 0, maxCombo: 0, bombAt: 20, falling: [], dying: [], t: 0, best: 0, swapT: 0 };
const isOdd = r => ((r + G.shift) & 1) === 1;
const ncol = r => isOdd(r) ? COLS - 1 : COLS;
const px = (r, c) => L.bx + L.d / 2 + c * L.d + (isOdd(r) ? L.d / 2 : 0);
const py = r => L.top + L.d / 2 + r * L.rh;
const get = (r, c) => (r >= 0 && r < G.rows.length && c >= 0 && c < ncol(r)) ? G.rows[r][c] : undefined;

/* ---------------- 방울 그림 (색별 캐시) ---------------- */
let SPR = {};
function sprite(col, mood) {
  const key = col + mood; if (SPR[key]) return SPR[key];
  const s = L.d, dpr = JE.dpr, cv = document.createElement('canvas');
  cv.width = cv.height = Math.ceil(s * 1.2 * dpr); const c = cv.getContext('2d'); c.scale(dpr, dpr);
  const m = s * 0.6;
  if (col === 'bomb') {
    JE.jelly(c, m, m, s * 0.9, s * 0.9, '#3b3f3d', { radius: 0.5 });
    c.fillStyle = '#ffcf3f'; c.font = B.font(s * 0.42); c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('★', m, m + 2);
  } else {
    JE.jelly(c, m, m, s * 0.92, s * 0.92, col, { radius: 0.5 });
    c.save(); c.translate(m, m); c.scale(0.8, 0.8); B.face(c, s * 0.92, s * 0.92, mood); c.restore();
  }
  SPR[key] = cv; return cv;
}
function drawBub(c, x, y, col, mood = 'normal', k = 1) {
  const ak = col === 'bomb' ? 'bub_bomb' : 'bub_' + COLORS.indexOf(col); // 11-23 Gemini 손그림 방울
  if (JE.art && JE.art.draw(c, ak, x, y, L.d * 1.0 * k, L.d * 1.0 * k)) return;
  const sp = sprite(col, mood), s = L.d * 1.2 * k;
  c.drawImage(sp, x - s / 2, y - s / 2, s, s);
}

/* ---------------- 판 ---------------- */
function colorsLeft() { const s = new Set(); G.rows.forEach(r => r.forEach(x => x != null && x !== 'bomb' && s.add(x))); return [...s]; }
function randCol(pool) { const p = pool && pool.length ? pool : COLORS.slice(0, G.ncol); return p[Math.floor(Math.random() * p.length)]; }
function newRow(r) { const n = ncol(r), row = []; for (let c = 0; c < n; c++) row.push(Math.random() < 0.4 && c > 0 && row[c - 1] ? row[c - 1] : randCol(COLORS.slice(0, G.ncol))); return row; }
function pushRow() {
  G.shift ^= 1; G.rows.unshift([]); G.rows[0] = newRow(0);
  // 아래 줄들은 위치가 그대로 한 칸 내려감 (홀짝은 shift로 보정됨)
  JE.audio.tone(160, 0.25, 'sawtooth', 0.08, 0.6); JE.shake.add(4);
  K.pop('한 줄 내려와요!', L.W / 2, L.top + 40, { size: 22, c1: '#ffd1da', c2: '#ff5d7a', life: 0.9 });
  trimRows();
  checkDead();
}
function trimRows() { while (G.rows.length && G.rows[G.rows.length - 1].every(x => x == null)) G.rows.pop(); }
function lowestRow() { for (let r = G.rows.length - 1; r >= 0; r--) if (G.rows[r].some(x => x != null)) return r; return -1; }
function checkDead() { if (lowestRow() >= DEAD && F.playing()) { K.pop('앗, 선을 넘었어요!', L.W / 2, L.deadY - 30, { size: 26, c1: '#ffd1da', c2: '#ff5d7a' }); F.fail('방울이 선까지 내려왔어요!', 0.9); } }
function nextShot() {
  G.cur = G.next;
  if (G.pops >= G.bombAt) { G.next = 'bomb'; G.bombAt += 20; }
  else { const left = colorsLeft(); G.next = randCol(left); }
  if (G.cur !== 'bomb' && !colorsLeft().includes(G.cur) && colorsLeft().length) G.cur = randCol(colorsLeft());
}

/* ---------------- 흐름 ---------------- */
const F = K.flow({
  title: '방울풍',
  colors: [COLORS[0], COLORS[2], COLORS[4], COLORS[3], COLORS[5]],
  desc: '끌어서 조준, 손을 떼면 발사!<br>같은 색 <b style="color:#ffd23f">3개 이상</b> 붙이면 펑.<br>매달린 방울은 우르르 떨어져 보너스.<br>빨간 선까지 내려오면 끝이에요.',
  onHome: () => { setup(); },
  onStart: () => { setup(); },
  onRevive: () => {
    // 아래쪽 3줄 비우기
    const lr = lowestRow();
    for (let r = Math.max(0, lr - 2); r <= lr; r++) G.rows[r] = G.rows[r].map((x, c) => { if (x != null) G.dying.push({ x: px(r, c), y: py(r), col: x, t: 0 }); return null; });
    trimRows(); G.miss = 0;
    K.pop('아래 3줄 비움!', L.W / 2, L.deadY - 40, { size: 30, c1: '#d7f6ff', c2: '#3ec5ff' });
  },
  continueDesc: '광고를 보면 가장 아래 3줄을 비우고<br>이어서 해요.',
  scoreGoals: [1500, 5000, 12000],
  missions: [
    { k: 'pops', t: '오늘 방울 {n}개 터뜨리기', goals: [80, 160, 300], mode: 'day' },
    { k: 'drops', t: '한 판에 매달린 방울 {n}개 떨어뜨리기', goals: [10, 25, 50] },
    { k: 'combo', t: '한 판에 {n}연속 펑', goals: [3, 5, 7] },
  ],
  missionStats: () => ({ pops: G.pops, drops: G.drops, combo: G.maxCombo }),
  score: () => G.score,
  stats: () => [['터뜨림', G.pops], ['떨어뜨림', G.drops], ['최대 연속', G.maxCombo]],
  tip: () => G.drops < 5 ? '위쪽 방울을 터뜨리면 매달린 방울이 한꺼번에 떨어져요.' : '벽에 튕겨서 쏘면 좁은 틈에도 넣을 수 있어요.',
});
function setup() {
  Object.assign(G, { rows: [], shift: 0, shot: null, aim: null, miss: 0, score: 0, shown: 0, pops: 0, drops: 0, combo: 0, maxCombo: 0, bombAt: 20, falling: [], dying: [], best: JE.best.get('main'), ncol: 4, passedBest: false });
  for (let r = 0; r < 6; r++) G.rows.push(newRow(r));
  G.next = randCol(colorsLeft()); nextShot(); G.next = randCol(colorsLeft());
}

/* ---------------- 발사 · 붙이기 ---------------- */
function neighbors(r, c) {
  const o = isOdd(r), out = [[r, c - 1], [r, c + 1]];
  for (const dr of [-1, 1]) { if (o) out.push([r + dr, c], [r + dr, c + 1]); else out.push([r + dr, c - 1], [r + dr, c]); }
  return out.filter(([rr, cc]) => rr >= 0 && cc >= 0 && cc < ncol(rr));
}
function fire(dx, dy) {
  const n = Math.hypot(dx, dy); if (n < 1) return;
  G.shot = { x: L.gunX, y: L.gunY, vx: dx / n * 1500, vy: dy / n * 1500, col: G.cur };
  nextShot();
  JE.audio.tone(700, 0.08, 'triangle', 0.14, 0.6); JE.haptic('tap');
}
function snap(s) {
  // 가까운 빈칸 중: 맨 윗줄이거나 이웃이 있는 칸
  let best = null, bd = 1e9;
  const rMax = Math.max(G.rows.length, 0) + 1;
  for (let r = 0; r <= rMax; r++) {
    for (let c = 0; c < ncol(r); c++) {
      if (get(r, c) != null) continue;
      const d = Math.hypot(px(r, c) - s.x, py(r) - s.y);
      if (d > L.d * 1.3 || d >= bd) continue;
      if (r !== 0 && !neighbors(r, c).some(([a, b]) => get(a, b) != null)) continue;
      best = [r, c]; bd = d;
    }
  }
  if (!best) best = [0, clamp(Math.round((s.x - L.bx - L.d / 2) / L.d), 0, COLS - 1)];
  const [r, c] = best;
  while (G.rows.length <= r) G.rows.push(Array(ncol(G.rows.length)).fill(null));
  G.rows[r][c] = s.col;
  land(r, c, s.col);
}
function land(r, c, col) {
  JE.sfx.land();
  let popped = [];
  if (col === 'bomb') {
    const seen = new Set([r + ',' + c]), q = [[r, c, 0]];
    while (q.length) { const [a, b, k] = q.shift(); popped.push([a, b]); if (k >= 2) continue; for (const [x, y] of neighbors(a, b)) if (!seen.has(x + ',' + y) && get(x, y) != null) { seen.add(x + ',' + y); q.push([x, y, k + 1]); } }
    JE.sfx.boom(); JE.shake.add(10); K.flash(0.4, '255,210,63');
  } else {
    const seen = new Set([r + ',' + c]), q = [[r, c]];
    while (q.length) { const [a, b] = q.pop(); popped.push([a, b]); for (const [x, y] of neighbors(a, b)) if (!seen.has(x + ',' + y) && get(x, y) === col) { seen.add(x + ',' + y); q.push([x, y]); } }
    if (popped.length < 3) popped = [];
  }
  if (popped.length) {
    G.combo++; G.maxCombo = Math.max(G.maxCombo, G.combo);
    popped.forEach(([a, b], i) => { G.dying.push({ x: px(a, b), y: py(a), col: get(a, b), t: -i * 0.03 }); G.rows[a][b] = null; });
    G.pops += popped.length;
    // 매달린 방울 찾기
    const keep = new Set(), q = [];
    for (let cc = 0; cc < ncol(0); cc++) if (get(0, cc) != null) { keep.add('0,' + cc); q.push([0, cc]); }
    while (q.length) { const [a, b] = q.pop(); for (const [x, y] of neighbors(a, b)) if (!keep.has(x + ',' + y) && get(x, y) != null) { keep.add(x + ',' + y); q.push([x, y]); } }
    let dropped = 0;
    G.rows.forEach((row, a) => row.forEach((x, b) => { if (x != null && !keep.has(a + ',' + b)) { G.falling.push({ x: px(a, b), y: py(a), vx: (Math.random() - 0.5) * 120, vy: -60 - Math.random() * 120, col: x }); G.rows[a][b] = null; dropped++; } }));
    G.drops += dropped;
    const pts = (popped.length * 10 + dropped * 25) * Math.min(G.combo, 5); // 연속 배율은 최대 x5
    G.score += pts;
    JE.sfx.pop(G.combo + Math.min(6, popped.length)); JE.haptic(dropped ? 'heavy' : 'soft');
    K.pop(`+${pts}`, px(r, c), py(r), { size: 22 + Math.min(14, dropped * 2), life: 0.8 });
    if (dropped >= 3) K.pop(`우르르 ${dropped}개!`, L.W / 2, L.deadY - 80, { size: 30 });
    if (G.combo >= 3) K.pop(`${G.combo}연속 펑!`, L.W / 2, L.deadY - 120, { size: 26, c1: '#d7f6ff', c2: '#3ec5ff' });
    if (!G.passedBest && G.best > 0 && G.score > G.best) { G.passedBest = true; K.pop('신기록!', L.W / 2, L.top + 60, { size: 34 }); K.confetti(30); }
    trimRows();
    if (!G.rows.length || G.rows.every(rw => rw.every(x => x == null))) {
      G.score += 1000; K.confetti(80); JE.sfx.fanfare(); K.pop('판 싹쓸이 +1000', L.W / 2, L.H * 0.4, { size: 30 });
      G.ncol = Math.min(6, G.ncol + 1);
      for (let rr = 0; rr < 6; rr++) G.rows[rr] = newRow(rr);
      if (!colorsLeft().includes(G.cur)) G.cur = randCol(colorsLeft());
    }
  } else {
    G.combo = 0; G.miss++;
    if (G.miss >= missLimit()) { G.miss = 0; pushRow(); G.ncol = Math.min(6, 4 + Math.floor(G.score / 3000)); }
  }
  checkDead();
}

/* ---------------- 입력 ---------------- */
let pr = { x: -99, y: -99, w: 0, h: 0 };
const nextPos = () => ({ x: L.gunX + L.d * 1.9, y: L.gunY + 10 });
JE.input.on({
  down(p) {
    if (F.state === 'play' && K.hit(pr, p)) { F.pause(); return; }
    if (!F.playing() || G.shot) return;
    const np = nextPos();
    if (Math.hypot(p.x - np.x, p.y - np.y) < L.d) { const t = G.cur; G.cur = G.next; G.next = t; G.swapT = 1; JE.sfx.select(3); return; }
    G.aim = p;
  },
  move(p) { if (G.aim) G.aim = p; },
  up(p) {
    if (!G.aim) return; G.aim = null;
    const dx = p.x - L.gunX, dy = Math.min(p.y - L.gunY, -20);
    if (p.y > L.gunY + 10) return; // 아래로 끌면 취소
    fire(dx, dy);
  },
});

/* ---------------- 업데이트 ---------------- */
function update(dt) {
  G.t += dt; G.shown = K.ease(G.shown, G.score, dt);
  G.swapT = Math.max(0, G.swapT - dt * 4);
  G.dying = G.dying.filter(d => { d.t += dt; if (d.t >= 0 && !d.burst) { d.burst = true; JE.fx.burst(d.x, d.y, d.col === 'bomb' ? '#ffcf3f' : d.col, 6, 220); } return d.t < 0.15; });
  G.falling = G.falling.filter(f => { f.vy += 1600 * dt; f.x += f.vx * dt; f.y += f.vy * dt; return f.y < L.H + 40; });
  const s = G.shot;
  if (s && F.state === 'play') {
    const steps = 4;
    for (let i = 0; i < steps && G.shot; i++) {
      s.x += s.vx * dt / steps; s.y += s.vy * dt / steps;
      if (s.x < L.bx + L.d / 2) { s.x = L.bx + L.d / 2; s.vx = Math.abs(s.vx); JE.sfx.tick(); }
      if (s.x > L.bx + L.bw - L.d / 2) { s.x = L.bx + L.bw - L.d / 2; s.vx = -Math.abs(s.vx); JE.sfx.tick(); }
      let hit = s.y <= L.top + L.d / 2;
      if (!hit) for (let r = 0; r < G.rows.length && !hit; r++) for (let c = 0; c < ncol(r); c++) if (get(r, c) != null && Math.hypot(px(r, c) - s.x, py(r) - s.y) < L.d * 0.82) { hit = true; break; }
      if (hit) { G.shot = null; snap(s); }
    }
  }
}

/* ---------------- 렌더 ---------------- */
function aimPath(dx, dy) {
  const pts = [[L.gunX, L.gunY]]; let x = L.gunX, y = L.gunY; const n = Math.hypot(dx, dy); let vx = dx / n, vy = dy / n;
  for (let k = 0; k < 2; k++) {
    const minX = L.bx + L.d / 2, maxX = L.bx + L.bw - L.d / 2;
    let tWall = vx < 0 ? (minX - x) / vx : vx > 0 ? (maxX - x) / vx : 1e9;
    let tTop = (L.top + L.d / 2 - y) / vy;
    // 방울에 닿는 지점
    let tHit = 1e9;
    for (let t = 0; t < Math.min(tWall, tTop); t += L.d * 0.25) {
      const xx = x + vx * t, yy = y + vy * t;
      let h = false;
      for (let r = 0; r < G.rows.length && !h; r++) for (let c = 0; c < ncol(r); c++) if (get(r, c) != null && Math.hypot(px(r, c) - xx, py(r) - yy) < L.d * 0.82) { h = true; break; }
      if (h) { tHit = t; break; }
    }
    const t = Math.min(tWall, tTop, tHit);
    x += vx * t; y += vy * t; pts.push([x, y]);
    if (t !== tWall) break; vx = -vx;
  }
  return pts;
}
function render(c) {
  const { W, H } = L;
  B.bg(c, 0);
  B.panel(c, L.bx - 8, L.top - 12, L.bw + 16, L.gunY - L.top + L.d * 1.3, 16);
  // 위험 선
  c.strokeStyle = BC.danger; c.lineWidth = 2; c.setLineDash([8, 6]); c.beginPath(); c.moveTo(L.bx, L.deadY); c.lineTo(L.bx + L.bw, L.deadY); c.stroke(); c.setLineDash([]);
  const low = lowestRow(), danger = low >= DEAD - 2;
  for (let r = 0; r < G.rows.length; r++) for (let cc = 0; cc < ncol(r); cc++) {
    const x = get(r, cc); if (x == null) continue;
    const wob = Math.sin(G.t * 3 + r + cc) * 0.6;
    drawBub(c, px(r, cc), py(r) + wob, x, danger && r >= DEAD - 2 ? 'worried' : 'normal');
  }
  for (const d of G.dying) if (d.t < 0) drawBub(c, d.x, d.y, d.col); else drawBub(c, d.x, d.y, d.col, 'happy', 1 + d.t * 3);
  for (const f of G.falling) drawBub(c, f.x, f.y, f.col, 'worried');
  // 조준선
  if (G.aim && F.playing() && G.aim.y < L.gunY + 10) {
    const pts = aimPath(G.aim.x - L.gunX, Math.min(G.aim.y - L.gunY, -20));
    // 11-23 '경로가 배경 때문에 안 보임': 흰 테두리 + 진한 점선, 끝에 붙을 자리 동그라미
    c.save(); c.lineCap = 'round'; c.lineJoin = 'round'; c.setLineDash([9, 7]);
    c.beginPath(); pts.forEach(([x, y], i) => i ? c.lineTo(x, y) : c.moveTo(x, y));
    c.lineWidth = 6; c.strokeStyle = 'rgba(255,253,246,.95)'; c.stroke();
    c.lineWidth = 3; c.strokeStyle = 'rgba(43,43,43,.8)'; c.stroke();
    c.setLineDash([]); const [ex, ey] = pts[pts.length - 1];
    c.beginPath(); c.arc(ex, ey, L.d * 0.45, 0, Math.PI * 2); c.lineWidth = 2.5; c.fillStyle = 'rgba(255,253,246,.6)'; c.fill(); c.stroke();
    c.restore();
  }
  if (G.shot) drawBub(c, G.shot.x, G.shot.y, G.shot.col);
  // 대포
  B.tray(c, L.gunY + L.d * 1.2, G.t);
  c.fillStyle = BC.metal2; c.beginPath(); c.arc(L.gunX, L.gunY + L.d * 0.4, L.d * 0.95, Math.PI, 0); c.fill(); c.lineWidth = 3; c.strokeStyle = BC.deep; c.stroke();
  if (!G.shot && F.state !== 'over') drawBub(c, L.gunX, L.gunY, G.cur, 'normal', 1 + G.swapT * 0.2);
  const np = nextPos();
  c.font = B.font(11, 800); c.textAlign = 'center'; c.fillStyle = BC.sub; c.fillText('다음 · 톡 바꾸기', np.x, np.y + L.d * 0.62);
  drawBub(c, np.x, np.y, G.next, 'normal', 0.72);
  if (F.state !== 'home') {
    pr = K.hud(c, G.shown, G.best || 0);
    const left = Math.max(1, missLimit() - G.miss);
    K.badges(c, [{ t: `한 줄 내려오기까지 ${left}발`, fg: left <= 2 ? BC.danger : BC.lime }, { t: G.next === 'bomb' ? '다음: 폭탄!' : `폭탄까지 ${Math.max(0, G.bombAt - G.pops)}개`, fg: BC.gold }], K.rowY() + 24);
    if (G.pops === 0 && F.playing() && !G.aim) K.hint(c, '위로 끌어 조준하고 손을 떼요', L.gunY - L.d * 1.4);
  }
}

JE.init({ gameId: 'bangulpung', canvas, onResize: (W, H) => layout(W, H), onPause: () => F.pause() });
layout(JE.W, JE.H);
JE.run(update, render);
F.home();
window.__G = G; window.__F = F; window.__L = L; window.__fire = fire;
})();
</script>
</body>
</html>
