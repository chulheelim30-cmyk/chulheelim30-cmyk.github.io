<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>풍년이의 모험</title>
<meta name="robots" content="noindex,nofollow">
<meta property="og:title" content="풍년이의 모험">
<meta property="og:description" content="풍년이와 호숫가 공원을 달려요! 눌러서 바로 플레이">
<meta property="og:image" content="https://chulheelim30-cmyk.github.io/play/pungnyeon/icon.png">
<link rel="icon" href="icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#1d1f5c;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;font-family:Jua,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
#wrap{position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden}
canvas{display:block;position:absolute;inset:0}
#snd{position:absolute;top:8px;left:50%;transform:translateX(-50%);z-index:5;border:0;background:rgba(30,20,60,.4);color:#fff;border-radius:50%;width:30px;height:30px;font-size:14px}
.pad{position:absolute;bottom:max(14px,env(safe-area-inset-bottom));z-index:4;width:84px;height:84px;border-radius:20px;background:rgba(255,255,255,.22);border:2.5px solid rgba(255,255,255,.75);color:#fff;font:inherit;display:none;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;text-shadow:0 2px 4px rgba(40,20,80,.6);box-shadow:0 4px 14px rgba(20,10,50,.35);backdrop-filter:blur(3px);touch-action:none;cursor:pointer}
.pad b{font-size:21px;font-weight:400}.pad small{font-size:12px;opacity:.9;margin-top:3px}
.pad.dn{transform:scale(.93);background:rgba(255,255,255,.38)}
#bj{left:max(16px,env(safe-area-inset-left))}#bs{right:max(16px,env(safe-area-inset-right))}
body.playing .pad{display:flex}
.ov{position:absolute;inset:0;z-index:6;display:flex;align-items:center;justify-content:center;background:linear-gradient(270deg,rgba(20,14,50,.6),rgba(20,14,50,.05) 62%)}
.ov[hidden]{display:none}
.home{position:absolute;right:max(36px,env(safe-area-inset-right));text-align:right;top:50%;transform:translateY(-50%);color:#fff;max-width:340px}
.title{font-size:54px;line-height:1;margin:0;background:linear-gradient(#fff6b0,#ffd23f 50%,#ff9a2a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #5a2a6a) drop-shadow(0 6px 10px rgba(20,10,50,.5))}
.en{font-size:15px;letter-spacing:.5px;margin:6px 0 14px;text-shadow:0 2px 3px #3a2560}
.desc{font-size:14px;line-height:1.5;opacity:.95;text-shadow:0 1px 3px #2a1850;font-family:"Noto Sans KR",sans-serif;margin-bottom:14px}
.btn{display:inline-block;border:0;border-radius:16px;padding:12px 30px;font:inherit;font-size:22px;cursor:pointer;background:linear-gradient(#ffe27a,#ffb02e);color:#5a2a00;box-shadow:0 5px 0 #c26a10,0 8px 16px rgba(20,10,50,.4);margin-right:8px}
.btn.ghost{background:rgba(255,255,255,.85);color:#3a2560;box-shadow:0 5px 0 #b9a8d8;font-size:17px;padding:11px 18px}
.card{background:rgba(255,252,246,.96);color:#3a2560;border-radius:22px;padding:18px 26px;text-align:center;box-shadow:0 14px 40px rgba(0,0,0,.35);min-width:300px}
.card h2{margin:0;font-size:30px;font-weight:400}.big{font-size:46px;color:#e07a00;margin:2px 0}
.stats{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;font-size:14px;color:#6b5a8a;margin:6px 0 12px}
#mis{background:rgba(30,20,70,.45);border:1.5px solid rgba(255,255,255,.35);border-radius:14px;padding:7px 10px;margin:0 0 12px;text-align:left;font-family:"Noto Sans KR",sans-serif;font-size:12.5px;backdrop-filter:blur(3px)}
#mis .mh{font-family:Jua,sans-serif;font-size:15px;margin-bottom:3px;display:flex;justify-content:space-between}#mis .mh span{font-size:12px;opacity:.85}
#mis .mi{display:flex;align-items:center;gap:6px;line-height:1.7}#mis .mi i{width:14px;height:14px;border-radius:4px;border:1.5px solid rgba(255,255,255,.8);font-style:normal;font-size:11px;line-height:13px;text-align:center;flex:none}
#mis .mi span{flex:1}#mis .mi em{font-style:normal;opacity:.8;font-size:11.5px}#mis .mi.ok{opacity:.75}#mis .mi.ok i{background:#7be0a0;border-color:#7be0a0;color:#1d4a2a}
.sub{font-size:14px;color:#6b5a8a;margin:6px 0 14px;font-family:"Noto Sans KR",sans-serif}
.alb{max-width:620px;padding:14px 20px}.alb h2{font-size:26px}.alb small{font-size:15px;color:#9a88b8}
#alb-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:6px 0 8px}
.mc{background:linear-gradient(#fff8ea,#ffeccc);border:2px solid #f2c97a;border-radius:14px;padding:6px 6px 8px;font-size:12px;line-height:1.3;font-family:"Noto Sans KR",sans-serif;color:#5a3a20}
.mc img{width:42px;height:42px;border-radius:50%;display:block;margin:0 auto 3px;border:2px solid #fff;box-shadow:0 2px 6px rgba(90,50,20,.3)}
.mc b{display:block;font-family:Jua,sans-serif;font-weight:400;font-size:14px;color:#c26a10}
.mc.lock{background:#eee8f6;border-color:#d4c8e6;color:#9a8ab4}.mc.lock .q{width:42px;height:42px;border-radius:50%;margin:0 auto 3px;background:#d9cfe8;font-size:24px;line-height:42px;color:#fff;font-family:Jua,sans-serif}.mc.lock b{color:#9a8ab4}
.title{font-size:46px}
.home .btn.ghost{font-size:15px;padding:10px 12px;margin-right:4px}.home .btn{margin-right:6px}.home #go{padding:12px 20px}
#deco-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:4px 0 10px}
.dc{border:2px solid #f2c97a;background:linear-gradient(#fff8ea,#ffeccc);border-radius:14px;padding:6px 4px;font:inherit;color:#5a3a20;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px}
.dc i{font-style:normal;font-size:24px}.dc b{font-weight:400;font-size:15px}.dc span{font-size:12px;color:#a07040;font-family:"Noto Sans KR",sans-serif}
.dc.on{border-color:#ff8a3a;box-shadow:0 0 0 3px rgba(255,160,60,.35);background:linear-gradient(#fff3d0,#ffd98a)}
.dc.lock{background:#eee8f6;border-color:#d4c8e6;color:#9a8ab4;cursor:default}.dc.lock span{color:#9a8ab4}
#alb-grid{grid-template-columns:repeat(5,1fr)!important;gap:5px!important}
.ph{position:relative;border:2px solid #fff;padding:0;border-radius:8px;overflow:hidden;aspect-ratio:1;box-shadow:0 2px 6px rgba(60,30,80,.3);cursor:pointer;background:#ddd;height:58px;width:100%}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph.lock{cursor:default}.ph.lock img{filter:blur(6px) grayscale(.6) brightness(.8)}.ph.lock i{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:18px}
.vw{display:flex;align-items:center;gap:18px;max-width:94%;height:88%}
#vw-img{max-height:100%;max-width:62vw;border:8px solid #fff;border-bottom-width:8px;border-radius:6px;box-shadow:0 10px 30px rgba(0,0,0,.5);object-fit:contain;background:#fff}
.vw-side{color:#fff;width:220px;display:flex;flex-direction:column;gap:12px}
#vw-n{font-size:14px;opacity:.8}#vw-txt{font-size:20px;line-height:1.45}
.vw-side .btn.ghost{font-size:16px;padding:8px 16px}
#polar{position:absolute;top:70px;right:16px;z-index:5;width:150px;background:#fff;padding:7px 7px 9px;border-radius:4px;box-shadow:0 8px 20px rgba(0,0,0,.4);transform:translateX(200px) rotate(6deg);opacity:0;transition:transform .5s cubic-bezier(.2,1.4,.4,1),opacity .4s;pointer-events:none}
#polar.show{transform:translateX(0) rotate(4deg);opacity:1}
#polar img{width:100%;height:110px;object-fit:cover;display:block}#polar span{display:block;font-size:12px;line-height:1.3;color:#5a3a20;margin-top:5px;font-family:"Noto Sans KR",sans-serif}
</style></head><body>
<div id="wrap">
<canvas id="c"></canvas>
<button id="snd">🔊</button>
<button class="pad" id="bj"><b>JUMP</b><small>(점프)</small></button>
<button class="pad" id="bs"><b>SLIDE</b><small>(슬라이드)</small></button>
<div class="ov" id="home"><div class="home">
 <h1 class="title">풍년이의 모험</h1>
 <div class="en">PUNGNYEON'S ADVENTURE</div>
 <div class="desc" style="opacity:.85;margin:-6px 0 10px">일산호수공원에서 우리를 간택한 고양이, 풍년이</div>
 <div class="desc">간식 냠냠 · 배부르면 피버 · 너무 먹으면 벌러덩 꿀잠</div>
 <div id="mis"></div>
 <button class="btn" id="go">달리기 시작</button><button class="btn ghost" id="album-btn">추억 앨범</button><button class="btn ghost" id="deco-btn">꾸미기</button>
</div></div>
<div class="ov" id="over" hidden style="background:rgba(20,14,50,.45)"><div class="card">
 <h2>풍년이가 낮잠 자러 갔어요</h2><div class="big" id="ov-score">0</div>
 <div>최고 기록 <b id="ov-best">0</b></div><div class="stats" id="ov-stats"></div>
 <button class="btn" id="again">다시 달리기</button><button class="btn ghost" id="tohome">처음으로</button>
</div></div>
<div class="ov" id="revive" hidden style="background:rgba(20,14,50,.5)"><div class="card">
 <div id="rv-ask"><h2>풍년이가 조금 지쳤어요</h2><div class="sub">광고를 보면 하트 1개로 이어 달릴 수 있어요 (한 판에 한 번)</div>
 <button class="btn" id="rv-yes">▶ 광고 보고 이어 달리기</button><br><button class="btn ghost" id="rv-no" style="margin-top:12px">괜찮아요, 쉴게요</button></div>
 <div id="rv-ad" hidden><h2>광고 자리</h2><div class="sub">출시 버전에서는 여기에 짧은 광고가 나와요</div><div class="big" id="rv-n">3</div></div>
</div></div>
<div class="ov" id="album" hidden style="background:rgba(20,14,50,.6)"><div class="card alb">
 <h2>풍년이 추억 앨범 <small id="alb-n"></small></h2>
 <div class="sub" style="margin:2px 0 4px">기억 조각을 하나 모을 때마다 사진이 한 장씩 열려요</div>
 <div id="alb-grid"></div>
 <button class="btn ghost" id="alb-close">닫기</button>
</div></div>
<div class="ov" id="viewer" hidden style="background:rgba(10,6,30,.85);z-index:8"><div class="vw">
 <img id="vw-img" alt="">
 <div class="vw-side"><div id="vw-n"></div><div id="vw-txt"></div>
 <div><button class="btn ghost" id="vw-prev">◀</button><button class="btn ghost" id="vw-next">▶</button></div>
 <button class="btn" id="vw-close">닫기</button></div>
</div></div>
<div id="polar"><img alt=""><span></span></div>
<div class="ov" id="deco" hidden style="background:rgba(20,14,50,.6)"><div class="card alb">
 <h2>풍년이 꾸미기 <small id="deco-n"></small></h2>
 <div class="sub" style="margin:2px 0 6px">간식을 모으면 하나씩 열려요. 입힌 채로 달려요!</div>
 <div id="deco-grid"></div>
 <button class="btn ghost" id="deco-close">닫기</button>
</div></div>

<script>/* 풍년이의 모험 v2 — 주인공: 회색 고양이 풍년이 (사용자 참고 그림 기준)
 * 가로 화면 자동 달리기 + 털실 공 슈팅. 호숫가 공원 노을.
 * 풍년이 그림은 사용자 참고 GIF(ref/pungnyeon_ref.gif)에서 잘라낸 달리기 13장 + 변형한 점프·슬라이드·놀람(art/gif_*.png), 배경·아이템·적은 지금은 코드로 그림(나중에 생성 그림으로 교체 예정) */
'use strict';
const IMG = {}; for (const k in SPR) { const i = new Image(); i.src = SPR[k].src; IMG[k] = i; }
const OUT = '#2a2440';
const rnd = (a, b) => a + Math.random() * (b - a);
function rng(s) { return function () { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* ---------- 화면 (가로 고정: 세로로 들면 돌려서 보여 줌) ---------- */
const wrap = document.getElementById('wrap'), cv = document.getElementById('c'), ctx = cv.getContext('2d');
let LOW = localStorage.getItem('pa2_low') === '1';
let LW = 844, LH = 390, K = 1, DPR = 1, SS = 2, GY = 316, ROT = false;
const cache = new Map();
function resize() {
  let w = innerWidth, h = innerHeight; ROT = h > w;
  if (ROT) [w, h] = [h, w];
  wrap.style.width = w + 'px'; wrap.style.height = h + 'px';
  wrap.style.transform = ROT ? `translate(${innerWidth}px,0) rotate(90deg)` : 'none';
  K = h / LH; LW = Math.max(600, Math.round(w / K)); DPR = Math.min(LOW ? 1.5 : 2, devicePixelRatio || 1);
  cv.width = Math.round(w * DPR); cv.height = Math.round(h * DPR); cv.style.width = w + 'px'; cv.style.height = h + 'px';
  SS = Math.min(3, DPR * K); GY = 316;
  cache.clear(); built = false; BGP = null;
}
function layer(w, h, fn) { const c = document.createElement('canvas'); c.width = Math.ceil(w * SS); c.height = Math.ceil(h * SS); const g = c.getContext('2d'); g.scale(SS, SS); fn(g); return { cv: c, w, h }; }
function drawLayer(L, y, fac) { const off = -(((G.cam * fac) % L.w) + L.w) % L.w; for (let x = off; x < LW; x += L.w) ctx.drawImage(L.cv, x, y, L.w, L.h); }
const wrapX = (fn, x, w, T) => { fn(x); if (x - w < 0) fn(x + T); if (x + w > T) fn(x - T); };
function sprite(key, w, h, ax, ay, fn) { let e = cache.get(key); if (!e) { e = layer(w + 16, h + 16, g => { g.translate(8, 8); fn(g); }); e.ax = ax; e.ay = ay; e.ww = w; e.hh = h; cache.set(key, e); } return e; }
function put(e, x, y, o) {
  const W = e.ww + 16, H = e.hh + 16;
  if (!o) { ctx.drawImage(e.cv, x - e.ax - 8, y - e.ay - 8, W, H); return; }
  ctx.save(); ctx.translate(x, y); if (o.rot) ctx.rotate(o.rot); if (o.s) ctx.scale(o.s, o.s); if (o.sx) ctx.scale(o.sx, o.sy); if (o.a != null) ctx.globalAlpha = o.a;
  ctx.drawImage(e.cv, -e.ax - 8, -e.ay - 8, W, H); ctx.restore();
}
function rr(g, x, y, w, h, r) { r = Math.max(0, Math.min(r, w / 2, h / 2)); g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
function lg(g, y0, y1, stops) { const gr = g.createLinearGradient(0, y0, 0, y1); stops.forEach((c, i) => gr.addColorStop(i / (stops.length - 1), c)); return gr; }
function rg(g, x, y, r0, r1, stops) { const gr = g.createRadialGradient(x, y, r0, x, y, r1); stops.forEach((c, i) => gr.addColorStop(i / (stops.length - 1), c)); return gr; }
function glow(g, x, y, r, col) { g.fillStyle = rg(g, x, y, 0, r, [col, col.replace(/[\d.]+\)$/, '0)')]); g.fillRect(x - r, y - r, r * 2, r * 2); }
function stroke(g, w = 1.6, c = OUT) { g.lineWidth = w; g.strokeStyle = c; g.lineJoin = 'round'; g.lineCap = 'round'; g.stroke(); }

/* ---------- 배경 (호숫가 공원 노을) ---------- */
let BG = {}, built = false;
const HOR = 196; // 수평선
function build() {
  const W = LW, T = 1200;
  BG.sky = layer(W, LH, g => {
    g.fillStyle = lg(g, 0, HOR + 6, ['#1d1f5c', '#3b3384', '#7a4c9c', '#c8629a', '#f2897e', '#ffc184']); g.fillRect(0, 0, W, HOR + 6);
    g.globalCompositeOperation = 'lighter'; glow(g, W * 0.56, HOR, 260, 'rgba(255,170,110,.55)'); glow(g, W * 0.56, HOR, 70, 'rgba(255,236,190,.9)'); g.globalCompositeOperation = 'source-over';
    g.fillStyle = '#fff3d4'; g.beginPath(); g.arc(W * 0.56, HOR + 8, 26, Math.PI, 0); g.fill();
    g.fillStyle = lg(g, HOR, LH, ['#9a7cc8', '#6e5aa8', '#4b3f86']); g.fillRect(0, HOR, W, LH - HOR);
    // 물에 비친 해
    g.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 26; i++) { const y = HOR + 3 + i * 2.3, w = 70 - i * 1.6 + Math.random() * 20; g.fillStyle = `rgba(255,200,140,${0.42 - i * 0.012})`; g.fillRect(W * 0.56 - w / 2 + (Math.random() - 0.5) * 8, y, w, 1.4); }
    g.globalCompositeOperation = 'source-over';
  });
  BG.stars = Array.from({ length: 60 }, () => ({ x: Math.random() * W, y: Math.random() * 130, r: rnd(0.4, 1.4), p: Math.random() * 6 }));
  BG.clouds = layer(T, 150, g => {
    const r = rng(3);
    for (let i = 0; i < 9; i++) { const x = r() * T, y = 40 + r() * 90, w = 120 + r() * 200; wrapX(xx => { for (let k = 0; k < 4; k++) { g.fillStyle = `rgba(${k % 2 ? '255,170,190' : '200,140,210'},${0.12 + r() * 0.1})`; g.beginPath(); g.ellipse(xx + k * w * 0.18, y + k * 2, w * (0.5 - k * 0.07), 9 + r() * 7, 0, 0, 7); g.fill(); } g.fillStyle = 'rgba(255,210,170,.25)'; g.beginPath(); g.ellipse(xx + w * 0.2, y + 7, w * 0.3, 2.5, 0, 0, 7); g.fill(); }, x, w, T); }
  });
  BG.city = layer(T, 92, g => {
    const r = rng(9), base = 92;

}

// 추억 앨범

$('alb-grid').addEventListener('click', e => { const b = e.target.closest('.ph'); if (b && b.dataset.i) openView(+b.dataset.i); });

// 하트 0 → 광고 보고 이어 달리기 (한 판에 한 번)
function showRevive() { if (G.state !== 'ask') return; $('rv-ask').hidden = false; $('rv-ad').hidden = true; $('revive').hidden = false; document.body.classList.remove('playing'); }
function reviveAd() {
  $('rv-ask').hidden = true; $('rv-ad').hidden = false; let n = 3; $('rv-n').textContent = n;
  const iv = setInterval(() => { n--; $('rv-n').textContent = n; if (n <= 0) { clearInterval(iv); doRevive(); } }, 1000);
}

  objs.forEach(o => { if (!['snack', 'piece', 'heart'].includes(o.t) && o.x - G.dist < 700) o.gone = true; });
  if (!onGround(PX() + 300)) segs.forEach(s => { if (s.x1 < PX() + 700 && s.x1 > PX() - 100) s.x1 = PX() + 800; });
  G.banner = 2; G.bannerTxt = '다시 힘내서 출발!'; G.bannerSub = '하트 +1 · 잠깐 무적'; sfx('big'); burst(SX(), PL.y - 40, 30, 'spark', FX, 300);
}

// 풍경 테마 (기억 6개를 다 모을 때마다 바뀜)
const TH = { cur: 0, prev: 0, mix: 1 };
function themeSky() {
  const want = G.state === 'home' ? 0 : (G.stage - 1) % THEMES.length;
  if (want !== TH.cur) { TH.prev = TH.cur; TH.cur = want; TH.mix = 0; }
  TH.mix = Math.min(1, TH.mix + G.dt * 0.6);
  if (TH.mix < 1) tint(TH.prev, 1 - TH.mix); tint(TH.cur, TH.mix);
}
function tint(i, a) {

    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = rg(ctx, LW * 0.78, 70, 0, 60, [`rgba(255,250,220,${0.5 * a})`, 'rgba(255,250,220,0)']); ctx.fillRect(LW * 0.78 - 60, 10, 120, 120);
    ctx.fillStyle = `rgba(255,250,225,${0.95 * a})`; ctx.beginPath(); ctx.arc(LW * 0.78, 70, 17, 0, 7); ctx.fill();
    for (let s = 0; s < 40; s++) { const x = (s * 97.3) % LW, y = (s * 53.7) % 170; ctx.fillStyle = `rgba(255,255,240,${a * (0.3 + 0.5 * Math.sin(G.t * 2 + s) ** 2)})`; ctx.fillRect(x, y, 1.6, 1.6); }
  } else if (k === 'spring') { ctx.fillStyle = `rgba(255,170,210,${0.16 * a})`; ctx.fillRect(0, 0, LW, GY); }
  else if (k === 'snow') { ctx.fillStyle = `rgba(215,228,255,${0.3 * a})`; ctx.fillRect(0, 0, LW, GY); ctx.fillStyle = `rgba(255,255,255,${0.55 * a})`; ctx.fillRect(0, GY - 6, LW, 8); }
  ctx.restore();
}
function themeFall() {
  const k = THEMES[TH.cur].k, a = TH.mix; if ((k !== 'spring' && k !== 'snow') || a <= 0) return;
  const n = LOW ? 18 : 42; ctx.save(); ctx.globalAlpha = a;
  for (let i = 0; i < n; i++) {
    const sp = 30 + (i % 5) * 9, x = (((i * 137.5 - G.t * 40 - G.cam * (0.2 + (i % 3) * 0.1)) % (LW + 40)) + LW + 40) % (LW + 40) - 20,
      y = ((i * 71.3 + G.t * sp) % (LH + 20)) - 10, sw = Math.sin(G.t * 1.5 + i) * 8;
    if (k === 'snow') { ctx.fillStyle = 'rgba(255,255,255,.9)'; ctx.beginPath(); ctx.arc(x + sw, y, 1.4 + (i % 3) * 0.9, 0, 7); ctx.fill(); }
    else { ctx.save(); ctx.translate(x + sw, y); ctx.rotate(G.t * 2 + i); ctx.fillStyle = i % 2 ? '#ffc6dc' : '#ffe1ec'; ctx.beginPath(); ctx.ellipse(0, 0, 4, 2.4, 0, 0, 7); ctx.fill(); ctx.restore(); }
  }
  ctx.restore();
}

// 처음 한 번: 버튼 안내
function tutHint() {
  const t = G.tut, jump = t > 4.5, pu = 1 + Math.sin(G.t * 8) * 0.08;
  const x = jump ? 58 / K : LW - 58 / K, y = LH - 56 / K;
  ctx.save(); ctx.strokeStyle = 'rgba(255,240,150,.95)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(x, y, 50 / K * pu, 0, 7); ctx.stroke(); ctx.restore();
  text(jump ? 'JUMP 톡! 점프 (두 번 = 2단 점프)' : 'SLIDE 꾹! 미끄러지기', jump ? x - 40 / K : x + 40 / K, y - 62 / K, 17, jump ? 'left' : 'right', '#fff6b0', { out: '#3a2560' });
}

// 저사양 폰: 처음 3초 동안 프레임이 느리면 화질을 낮춰 부드럽게
const PF = { t: 0, n: 0, sum: 0 };
function perf(raw) {
  if (LOW || G.state !== 'play' || raw > 0.25) return;
  PF.t += raw; PF.n++; PF.sum += raw;
  if (PF.t > 3) { if (PF.sum / PF.n > 0.026) { LOW = true; localStorage.setItem('pa2_low', '1'); resize(); } PF.t = PF.n = PF.sum = 0; PF.done = true; LOW = LOW; }
}

// 풍년이 꾸미기 (간식을 모으면 하나씩 열림)
const DECOS = [
  { k: 'bow', name: '분홍 리본', icon: '🎀', need: 0 },
  { k: 'scarf', name: '빨간 목도리', icon: '🧣', need: 200 },
  { k: 'beanie', name: '털모자', icon: '🧶', need: 600 },
  { k: 'flower', name: '꽃 화관', icon: '🌸', need: 1200 },
  { k: 'crown', name: '왕관', icon: '👑', days: 3 },

const DECO = { cur: localStorage.getItem('pa2_deco') || '', tot: +(localStorage.getItem('pa2_snk') || 0) };
let snkSave = 0;
function addSnackTotal() { DECO.tot++; if (++snkSave >= 10) { snkSave = 0; localStorage.setItem('pa2_snk', DECO.tot); }
  const d = DECOS.find(d => d.need && DECO.tot === d.need); if (d) { G.banner = 2.2; G.bannerTxt = `${d.icon} ${d.name} 열렸어요!`; G.bannerSub = '처음 화면 \'꾸미기\'에서 입혀 보세요'; sfx('big'); localStorage.setItem('pa2_snk', DECO.tot); } }
const decoOpen = d => d.days ? +(localStorage.getItem('pa2_days') || 0) >= d.days : DECO.tot >= d.need;
function openDeco() {
  localStorage.setItem('pa2_snk', DECO.tot);
  const row = (k, icon, name, open, lock) => `<button class="dc${DECO.cur === k ? ' on' : ''}${open ? '' : ' lock'}" data-k="${k}" ${open ? '' : 'disabled'}><i>${open ? icon : '🔒'}</i><b>${name}</b><span>${open ? (DECO.cur === k ? '입는 중' : '입히기') : lock}</span></button>`;
  $('deco-grid').innerHTML = row('', '🐱', '그대로', true, '') + DECOS.map(d => row(d.k, d.icon, d.name, decoOpen(d), d.days ? `발도장 ${d.days}개` : `간식 ${d.need.toLocaleString()}개`)).join('');
  $('deco-n').textContent = `모은 간식 ${DECO.tot.toLocaleString()}개`; $('deco').hidden = false;
}
$('deco-grid').addEventListener('click', e => { const b = e.target.closest('.dc'); if (!b || b.disabled) return; DECO.cur = b.dataset.k; localStorage.setItem('pa2_deco', DECO.cur); openDeco(); });
$('deco-btn').addEventListener('click', openDeco); $('deco-close').addEventListener('click', () => { $('deco').hidden = true; });
function drawDeco(k, x, y, hw) {
  const c = ctx; c.save(); c.lineJoin = 'round'; c.lineWidth = Math.max(1, hw * 0.05); c.strokeStyle = 'rgba(60,30,50,.85)';
  if (k === 'bow') {
    c.translate(x - hw * 0.34, y + hw * 0.02); c.rotate(-0.35); const r = hw * 0.2;
    c.fillStyle = '#ff7fb0'; [-1, 1].forEach(sd => { c.beginPath(); c.moveTo(0, 0); c.quadraticCurveTo(sd * r * 1.6, -r * 1.1, sd * r * 1.5, 0); c.quadraticCurveTo(sd * r * 1.6, r * 1.1, 0, 0); c.fill(); c.stroke(); });
    c.fillStyle = '#ffd0e2'; c.beginPath(); c.arc(-r * 0.7, -r * 0.2, r * 0.25, 0, 7); c.fill();
    c.fillStyle = '#ff5c98'; c.beginPath(); c.arc(0, 0, r * 0.42, 0, 7); c.fill(); c.stroke();
  } else if (k === 'scarf') {
    const ny = y + hw * 0.98, L = x - hw * 0.58, R = x + hw * 0.36, th = hw * 0.24, fl = Math.sin(G.t * 9) * hw * 0.08;
    c.fillStyle = '#e8434f'; c.beginPath(); c.moveTo(L, ny - th * 0.4); c.quadraticCurveTo(x, ny + th * 0.5, R, ny - th * 0.7); c.lineTo(R, ny + th * 0.4); c.quadraticCurveTo(x, ny + th * 1.5, L, ny + th * 0.6); c.closePath(); c.fill(); c.stroke();
    c.beginPath(); c.moveTo(L + hw * 0.1, ny); c.lineTo(L - hw * 0.35, ny + hw * 0.15 + fl); c.lineTo(L - hw * 0.32, ny + hw * 0.4 + fl); c.lineTo(L + hw * 0.16, ny + th * 0.8); c.closePath(); c.fill(); c.stroke();
    c.strokeStyle = '#fff2c8'; c.lineWidth = hw * 0.04; c.beginPath(); c.moveTo(L - hw * 0.2, ny + hw * 0.18 + fl); c.lineTo(L - hw * 0.17, ny + hw * 0.34 + fl); c.stroke();
    c.beginPath(); c.moveTo(x - hw * 0.15, ny + th * 0.1); c.lineTo(x - hw * 0.12, ny + th * 0.9); c.stroke();
  } else if (k === 'beanie') {
    const by = y + hw * 0.2, rw = hw * 0.52;
    c.fillStyle = '#7fc8e8'; c.beginPath(); c.ellipse(x, by, rw, hw * 0.46, 0, Math.PI, 0); c.closePath(); c.fill(); c.stroke();
    c.strokeStyle = 'rgba(255,255,255,.45)'; c.lineWidth = hw * 0.04; for (let i = -2; i <= 2; i++) { c.beginPath(); c.moveTo(x + i * rw * 0.33, by - hw * 0.05); c.lineTo(x + i * rw * 0.28, by - hw * 0.36 + Math.abs(i) * hw * 0.08); c.stroke(); }
    c.strokeStyle = 'rgba(60,30,50,.85)'; c.lineWidth = Math.max(1, hw * 0.05);

    c.fillStyle = '#fff'; c.beginPath(); c.arc(x, by - hw * 0.5, hw * 0.13, 0, 7); c.fill(); c.stroke();
  } else if (k === 'flower') {

    for (let i = 0; i < 5; i++) { const a = Math.PI * (1.08 + i * 0.21), fx = x + Math.cos(a) * hw * 0.48, fy = y + hw * 0.16 + Math.sin(a) * hw * 0.16, r = hw * 0.1;
      c.fillStyle = cols[i]; for (let p = 0; p < 5; p++) { c.beginPath(); c.arc(fx + Math.cos(p * 1.26) * r * 0.7, fy + Math.sin(p * 1.26) * r * 0.7, r * 0.55, 0, 7); c.fill(); }
