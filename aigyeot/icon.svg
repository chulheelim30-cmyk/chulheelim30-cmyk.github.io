<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FCF5E6"/><stop offset="1" stop-color="#F2E4C7"/>
    </linearGradient>
    <radialGradient id="fur" cx=".36" cy=".26" r=".95">
