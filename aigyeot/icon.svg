    <linearGradient id="low" gradientUnits="userSpaceOnUse" x1="0" y1="800" x2="0" y2="1060"><stop offset="0" stop-color="#6E6A64" stop-opacity="0"/><stop offset="1" stop-color="#6E6A64" stop-opacity=".22"/></linearGradient>
