<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#FBF7F2">
<script src="kakao.js?v=1"></script>
<link rel="manifest" href="manifest.webmanifest?v=5">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="아이곁">
<meta name="description" content="강아지·고양이 생활 기록. 밥·산책·목욕·배변·체중을 가족과 함께, 아플 땐 케어 모드로 투약·수액·병원 요약까지.">
<meta property="og:title" content="아이곁 — 우리 아이 생활 기록">
<meta property="og:description" content="가족이 함께 쓰는 반려동물 생활 기록">
<link rel="icon" href="icon-192.png?v=5">
<title>아이곁 — 우리 아이 생활 기록</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBF7F2; --card:#FFFFFF; --ink:#2D2A26; --sub:#7A726A; --line:#ECE5DC;
  --acc:#E07A5F; --acc-soft:#FBE7E1; --ok:#3D8B7D; --ok-soft:#E1F1EE;
  --warn:#C0392B; --warn-soft:#FDECEA; --blue:#4A6FA5; --blue-soft:#E6EDF7;
  --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;font-size:16px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 96px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 0 14px}
.brand{font-weight:700;font-size:20px;letter-spacing:-.3px}
.brand small{display:block;font-weight:400;font-size:13px;color:var(--sub)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;background:var(--ok-soft);color:var(--ok)}
.pill.off{background:var(--warn-soft);color:var(--warn)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:15px;font-weight:700}
.muted{color:var(--sub);font-size:13px}
.row{display:flex;gap:8px;align-items:center}
.between{justify-content:space-between}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.qbtn{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;cursor:pointer;min-height:72px}
.qbtn .ic{font-size:22px;line-height:1}
.qbtn:active{transform:scale(.97)}
.bar{height:12px;background:#F1ECE6;border-radius:999px;overflow:hidden;margin:8px 0 4px}
.bar>i{display:block;height:100%;background:var(--ok);border-radius:999px;transition:width .3s}
.big{font-size:26px;font-weight:700;letter-spacing:-.5px}
.check{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.check:first-of-type{border-top:0}
.box{width:26px;height:26px;border-radius:8px;border:2px solid #CFC6BB;flex:none;display:grid;place-items:center;color:#fff;font-size:15px}
.check.done .box{background:var(--ok);border-color:var(--ok)}
.check.done .lbl{color:var(--sub);text-decoration:line-through}
.check .who{margin-left:auto;font-size:12px;color:var(--sub);text-align:right}
.log{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.log:first-child{border-top:0}
.log .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;font-size:17px;background:#F4EFE9}
.log .body{flex:1;min-width:0}
.log .t{font-size:12px;color:var(--sub)}
.log .x{border:0;background:none;color:#B9AFA4;font-size:13px;cursor:pointer;padding:8px 6px;min-height:40px;min-width:44px}
.log .acts{display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex:none}
.log .x.sure{color:var(--warn);font-weight:700}
.log.alert .ic{background:var(--warn-soft)}
.daylbl{font-size:13px;font-weight:700;color:var(--sub);margin:14px 2px 4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.fam{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.mem{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:8px 10px}
.mem.me{border-color:var(--ok)}
.ini{flex:none;width:34px;height:34px;border-radius:50%;background:var(--acc-soft);color:var(--acc);display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:15px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip.danger.on{background:var(--warn);border-color:var(--warn)}
label.f{display:block;font-size:13px;color:var(--sub);margin:12px 0 4px}
input[type=text],input[type=number],input[type=datetime-local],input[type=date],select,textarea{width:100%;border:1px solid var(--line);background:#FFFDFB;border-radius:12px;padding:11px 12px;font-size:16px}
textarea{min-height:70px;resize:vertical}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;cursor:pointer;background:var(--ink);color:#fff}
.btn.acc{background:var(--acc)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);font-weight:500}
.btn.sm{padding:7px 12px;font-size:14px;border-radius:10px}
.btn.full{width:100%}
.btn:disabled{opacity:.45}
.res{background:var(--ok-soft);border-radius:14px;padding:14px;margin-top:12px}
.res .k{font-size:13px;color:var(--sub)}
.res table{width:100%;border-collapse:collapse;font-size:14px;margin-top:6px}
.res td{padding:5px 0;border-top:1px solid rgba(0,0,0,.06)}
.res td:last-child{text-align:right;font-weight:700}
.alertbox{background:var(--warn-soft);color:var(--warn);border-radius:14px;padding:14px;font-size:14px;margin-top:10px}
.alertbox b{display:block;font-size:15px;margin-bottom:2px}
.note{background:var(--blue-soft);color:#2F4C77;border-radius:14px;padding:12px 14px;font-size:13px}
pre.sum{white-space:pre-wrap;font-family:inherit;font-size:14px;background:#FFFDFB;border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .in{display:flex;max-width:560px;width:100%}
nav.tabs button{flex:1;border:0;background:none;padding:9px 0 10px;font-size:11px;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
nav.tabs button .ic{font-size:20px;line-height:1}
nav.tabs button.on{color:var(--acc);font-weight:700}
.sheet-bg{position:fixed;inset:0;background:rgba(30,25,20,.38);display:none;z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom));z-index:21;display:none;max-width:560px;margin:0 auto}
.sheet.open,.sheet-bg.open{display:block}
.sheet h2{margin:0 0 4px;font-size:18px}
.sheet .grab{width:40px;height:4px;background:#D9D0C5;border-radius:4px;margin:-6px auto 12px}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.toast.act{pointer-events:auto;display:flex;gap:14px;align-items:center}
.toast button{border:0;background:none;color:#FFD3C4;font-weight:700;font-size:14px;padding:4px 2px;cursor:pointer}
.edit-row{display:flex;gap:6px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.edit-row:first-child{border-top:0}
.edit-row .grow{flex:1;min-width:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.three{display:grid;grid-template-columns:2fr 1fr 1fr;gap:6px}
.banner{border-radius:14px;padding:12px 14px;font-size:13px;margin-bottom:12px;background:var(--warn-soft);color:var(--warn)}
.hidden{display:none!important}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-left:-16px;margin-right:-16px;padding:0 16px 2px}
.chips.scroll::-webkit-scrollbar{display:none}
.chips.scroll .chip{flex:none}
.sub{font-size:13px;font-weight:700;color:var(--sub);margin:14px 0 6px}
.kv{display:flex;justify-content:space-between;align-items:center;background:#F7F2EC;border-radius:12px;padding:10px 12px;margin-top:10px;font-size:14px}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;margin-left:6px;vertical-align:1px;background:var(--blue-soft);color:var(--blue)}
.tag.lbl{background:var(--ok-soft);color:var(--ok)}
.sugg{border:1px solid var(--line);border-radius:12px;margin-top:6px;overflow:hidden;background:#FFFDFB}
.sugg button{display:block;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:none;padding:10px 12px;font-size:15px;cursor:pointer}
.sugg button:first-child{border-top:0}
.sugg button small{display:block;color:var(--sub);font-size:12px}
.nut{background:#FFFDFB;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:10px}
.nut table{width:100%;border-collapse:collapse;font-size:14px;margin-top:6px}
.nut th{font-size:12px;color:var(--sub);font-weight:500;text-align:right;padding:2px 0}
.nut th:first-child{text-align:left}
.nut td{padding:5px 0;border-top:1px solid var(--line);text-align:right}
.nut td:first-child{text-align:left;color:var(--sub)}
details.more summary{cursor:pointer;color:var(--sub);font-size:13px;margin-top:10px}
.av{border-radius:50%;object-fit:cover;flex:none;display:inline-grid;place-items:center;background:#F1E8DE;overflow:hidden;line-height:1}
.pets{display:flex;gap:14px;overflow-x:auto;scrollbar-width:none;margin:-4px -16px 12px;padding:4px 16px 2px}
.pets::-webkit-scrollbar{display:none}
.pets button{border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;color:var(--sub);cursor:pointer;flex:none;width:64px}
.pets button .av{box-shadow:0 0 0 2px var(--bg),0 0 0 4px transparent}
.pets button.on{color:var(--ink);font-weight:700}
.pets button.on .av{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--acc)}
.pets button .nm{max-width:64px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pets .add .av{background:transparent;border:2px dashed #D9D0C5;color:var(--sub)}
.photo-row{display:flex;gap:14px;align-items:center;margin:4px 0 6px}
header.top .brand{display:flex;align-items:center;gap:10px}
#hdrAv:empty{display:none}
.five{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><span id="hdrAv"></span><div><span id="hdrName">아이곁</span><small id="hdrSub">우리 아이 생활 기록</small></div></div>
    <span id="sync" class="pill">연결 중…</span>
  </header>
  <div id="petsbar"></div>
  <div id="banner"></div>
  <main id="main"></main>
</div>

<nav class="tabs"><div class="in" id="tabs"></div></nav>

<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>
<input type="file" accept="image/*" id="photoIn" hidden>

<script>
/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { const n = parseFloat(String(v).replace(',', '.')); return isFinite(n) ? n : null; };
const r1 = n => Math.round(n * 10) / 10;
const r0 = n => Math.round(n);
const r2 = n => Math.round(n * 100) / 100;
const pad = n => String(n).padStart(2, '0');
const dkey = d => { d = new Date(d); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
const today = () => dkey(Date.now());
const hm = t => { const d = new Date(t); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const dayLabel = k => {
  if (k === today()) return '오늘';
  if (k === dkey(Date.now() - 864e5)) return '어제';
  const d = new Date(k + 'T00:00'); return (d.getMonth() + 1) + '월 ' + d.getDate() + '일 (' + '일월화수목금토'[d.getDay()] + ')';
};
const localDT = t => { const d = new Date(t); return dkey(d) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const uid = () => Math.random().toString(36).slice(2, 10);
let toastT;
let toastFn = null;
function toast(msg, act) {
  const el = $('#toast'); toastFn = act?.fn || null;
  el.innerHTML = esc(msg) + (act ? `<button type="button" id="toastAct">${esc(act.label)}</button>` : '');
  el.classList.toggle('act', !!act); el.classList.add('show'); clearTimeout(toastT);
  toastT = setTimeout(() => { el.classList.remove('show', 'act'); toastFn = null; }, act ? 5000 : 1800);
}
document.getElementById('toast').addEventListener('click', e => { if (e.target.id === 'toastAct' && toastFn) { const f = toastFn; toastFn = null; $('#toast').classList.remove('show', 'act'); f(); } });

/* ---------- domain ---------- */
const TYPES = {
  feed:    { ic: '🥄', name: '급여' },
  med:     { ic: '💊', name: '투약' },
  fluid:   { ic: '💧', name: '수액' },
  symptom: { ic: '🩺', name: '증상' },
  weight:  { ic: '⚖️', name: '체중' },
  potty:   { ic: '🚽', name: '배변·소변' },
  walk:    { ic: '🦮', name: '산책' },
  bath:    { ic: '🛁', name: '목욕' },
  lab:     { ic: '🧪', name: '검사' },
  note:    { ic: '📝', name: '메모' },
};
// 기본은 건강한 아이의 생활 기록. 치료용 기록(수액·검사)은 '치료 기록' 줄에 작게 둬요(따로 모드 없음).
const isDog = p => p?.species === 'dog';
const WALK_MIN = [10, 20, 30, 45, 60];
const BATH_KINDS = ['집에서 목욕', '미용실', '발·얼굴만'];
const typesFor = p => ['feed', ...(isDog(p) ? ['walk', 'bath'] : []), 'potty', 'weight', 'med', 'symptom', 'note'];
const CARE_TYPES = ['fluid', 'lab'];
const typeName = k => k === 'med' ? '약·영양제' : (TYPES[k] || TYPES.note).name;
const LABS = [
  { k: 'crea', n: '크레아티닌', u: 'mg/dL', re: /크레아?티닌|크레아틴|creat?i?n?i?n?e?|crea/i },
  { k: 'bun', n: 'BUN', u: 'mg/dL', re: /bun|요소\s?질소|비유엔/i },
  { k: 'sdma', n: 'SDMA', u: 'μg/dL', re: /sdma/i },
  { k: 'phos', n: '인', u: 'mg/dL', re: /phos|인\s?수치|인산|(^|\s)인(?=\s?\d)/i },
  { k: 'k', n: '칼륨', u: 'mEq/L', re: /칼륨|포타슘|(^|\s)k(?=\s?\d)/i },
  { k: 'hct', n: '적혈구용적(HCT)', u: '%', re: /hct|pcv|헤마토크릿|적혈구\s?용적|빈혈\s?수치/i },
  { k: 'usg', n: '요비중', u: '', re: /요비중|usg/i },
  { k: 'glu', n: '혈당', u: 'mg/dL', re: /혈당|glu/i },
];
function labsIn(s) {
  const v = {};
  for (const L of LABS) {
    const m = s.match(L.re); if (!m) continue;
    const rest = s.slice(m.index + m[0].length).match(/^[^\d가-힣]{0,4}(?:[가-힣]{0,3}\s?)?(\d+(?:\.\d+)?)/);
    if (rest) v[L.k] = +rest[1];
  }
  return v;
}
const SYMPTOMS = ['구토', '설사', '식욕 없음', '기운 없음', '물 안 마심', '물 많이 마심', '기침·재채기', '침 흘림', '숨이 가쁨', '입 벌리고 숨쉼', '발작', '소변 안 봄', '쓰러짐·의식 흐림', '잇몸 창백', '빈뇨', '걸음 이상', '통증 반응', '기타'];
const URGENT = ['입 벌리고 숨쉼', '숨이 가쁨', '발작', '소변 안 봄', '쓰러짐·의식 흐림', '잇몸 창백'];
// 먹는 방식별 배수. 스스로 먹으면 유지 칼로리(종·중성화·활동량), 강급·튜브는 기초대사량부터 시작.
const FACTORS_SELF = {
  cat: [{ v: 1.2, t: '중성화한 성묘' }, { v: 1.4, t: '중성화 안 함·활동 많음' }, { v: 1.0, t: '노령·활동 적음·회복 중' }, { v: 0.8, t: '체중 감량 중' }],
  dog: [{ v: 1.6, t: '중성화한 성견' }, { v: 1.8, t: '중성화 안 함·활동 많음' }, { v: 1.4, t: '노령·활동 적음' }, { v: 1.0, t: '체중 감량·회복 중' }],
};
const FACTORS_ASSIST = [{ v: 1.0, t: '기초대사량 그대로 (회복기 기본)' }, { v: 1.2, t: '회복 후반·체중을 늘려야 할 때' }];
const factorList = mode => mode === 'assist' ? FACTORS_ASSIST : FACTORS_SELF[S.pet?.species === 'dog' ? 'dog' : 'cat'];
const feedModeOf = p => p?.feedMode || (p?.plan?.ramp || num(p?.water) ? 'assist' : 'self');
const DEFAULT_TASKS = ['아침 급여', '저녁 급여', '아침 약', '저녁 약', '피하수액', '소변·배변 확인'];
const DAILY_TASKS = { dog: ['아침 밥', '저녁 밥', '아침 산책', '저녁 산책', '물 갈아주기'], cat: ['아침 밥', '저녁 밥', '물 갈아주기', '화장실 청소'] };
const tasksFor = p => DAILY_TASKS[isDog(p) ? 'dog' : 'cat'];
const rer = kg => 70 * Math.pow(kg, 0.75);
function dayIndex(pet, k) {
  if (!pet?.plan?.start) return null;
  const a = new Date(pet.plan.start + 'T00:00'), b = new Date(k + 'T00:00');
  return Math.floor((b - a) / 864e5) + 1;
}
function rampFrac(pet, k) {
  if (!pet?.plan?.ramp || !pet.plan.start || feedModeOf(pet) !== 'assist') return 1;
  const i = dayIndex(pet, k);
  if (i == null || i < 1) return 1;
  return i === 1 ? 1 / 3 : i === 2 ? 2 / 3 : 1;
}
function fullTarget(pet) {
  if (!pet) return null;
  if (num(pet.targetKcal)) return num(pet.targetKcal);
  const w = num(pet.weightKg); if (!w) return null;
  return rer(w) * (num(pet.factor) || (feedModeOf(pet) === 'assist' ? 1 : (pet.species === 'dog' ? 1.6 : 1.2)));
}
function targetFor(pet, k) { const f = fullTarget(pet); return f == null ? null : f * rampFrac(pet, k); }
function kcalOf(food, amt, unit) {
  if (!food || amt == null || !num(food.kcal) || !num(food.per)) return null;
  const per = num(food.kcal) / num(food.per), fu = food.unit; unit = unit || fu;
  if (unit === fu) return per * amt;

  if (!w && !num(C.override)) { out.innerHTML = '<div class="card muted">설정에서 체중을 넣으면 결과가 나와요.</div>'; return; }

  const full = num(C.override) || base * (num(C.factor) || 1);
  const AS = C.mode === 'assist';
  const pseudo = { plan: { ramp: AS && C.ramp, start: C.start } };

  const todayK = full * frac;

      rows += `<tr><td>${esc(f.name)}${mix.length > 1 ? ` (${r0(share * 100)}%)` : ''}<br><span class="muted">하루 ${fmtA(dayAmt, f.unit)}${inG ? ` (약 ${r0(inG)}g)` : ''}</span></td><td>회당 ${inG ? `약 ${r1(inG / meals)}g<br><span class="muted" style="font-weight:400">${fmtA(mealAmt, f.unit)}</span>` : fmtA(mealAmt, f.unit)}</td></tr>`;

  out.innerHTML = `<div class="res">
    <div class="k">${num(C.override) ? '주치의 지정 칼로리' : `기초대사량 ${r0(base)}kcal × ${num(C.factor) || 1}`}</div>
    <div class="row" style="align-items:baseline;gap:6px"><span class="big">${r0(todayK)}</span><span class="muted">kcal / 오늘${frac < 1 ? ` (전량 ${r0(full)}kcal의 ${frac < .5 ? '1/3' : '2/3'})` : ''}</span></div>

    ${rows ? `<table style="margin-top:10px">${rows}${AS && totalVol > 0 ? `<tr><td>회당 총량${water ? ` (물 ${water}ml 포함)` : ''}</td><td>약 ${r1(totalVol)}ml${syr ? ` · ${syr}ml 주사기 ${r1(totalVol / syr)}개` : ''}</td></tr>` : ''}</table>${warn}` : ''}
  </div>
  <p class="muted" style="margin:8px 2px 12px">${AS ? 'g·ml가 섞인 경우 1g ≈ 1ml로 어림했어요. 강급 중 토하거나 거부가 심하면 양을 늘리지 말고 주치의와 상의해주세요.' : '체중이 2주 넘게 계속 줄거나 늘면 주치의와 목표를 다시 정해주세요.'}</p>`;

/* ----- vet summary ----- */
function buildSummary(days) {
  const p = S.pet || {};
  const since = Date.now() - days * 864e5;
  const L = S.logs.filter(l => l.t >= since).slice().sort((a, b) => a.t - b.t);
  const lines = [];
  lines.push(`[${p.name || '아이'} 기록 요약 · 최근 ${days}일]`);
  lines.push(`${p.species === 'dog' ? '강아지' : '고양이'}${p.age ? ' · ' + p.age : ''}${p.weightKg ? ' · 현재 ' + p.weightKg + 'kg' : ''}${p.condition ? ' · ' + p.condition : ''}`);
  if ((p.foods || []).length) { lines.push('', '■ 먹는 사료'); p.foods.forEach(f => lines.push(`${f.name}: ${f.kcal}kcal/${f.per}${f.unit}${f.nut && nutLine(f.nut) ? ' · ' + nutLine(f.nut) : ''}`)); }
  const ws = L.filter(l => l.type === 'weight');
  if (ws.length) lines.push('', '■ 체중', ws.map(w => `${dkey(w.t).slice(5)} ${w.kg}kg`).join(' → '));
  const ft = fullTarget(p);
  const byDay = {};
  L.filter(l => l.type === 'feed').forEach(l => { const k = dkey(l.t); byDay[k] = (byDay[k] || 0) + (num(l.kcal) || 0); });
  const dk = Object.keys(byDay).sort();
  if (dk.length) {
    lines.push('', '■ 하루 섭취 칼로리' + (ft ? ` (목표 ${r0(ft)}kcal)` : ''));
    dk.forEach(k => { const o = dayNut(k); lines.push(`${k.slice(5)}  ${r0(byDay[k])}kcal${o ? ' · ' + nutDayLine(o) : ''}`); });
    const methods = [...new Set(L.filter(l => l.type === 'feed' && l.method).map(l => l.method))];
    if (methods.length) lines.push('급여 방식: ' + methods.join(', '));
  }
  const sy = L.filter(l => l.type === 'symptom');
  if (sy.length) { lines.push('', '■ 증상'); sy.forEach(s => lines.push(`${dkey(s.t).slice(5)} ${hm(s.t)}  ${(s.symptoms || []).join(', ')} (${['', '약함', '중간', '심함'][s.severity || 1]})${s.memo ? ' - ' + s.memo : ''}`)); }
  const meds = L.filter(l => l.type === 'med');
  if (meds.length) {
    lines.push('', '■ 투약');
    const g = {}; meds.forEach(m => { const k = (m.name || '약') + (m.dose ? ' ' + m.dose : ''); g[k] = (g[k] || 0) + 1; });
    Object.entries(g).forEach(([k, n]) => lines.push(`${k}  ${n}회`));
  }
  const fl = L.filter(l => l.type === 'fluid');
  if (fl.length) lines.push('', '■ 피하수액', `${fl.length}회, 총 ${fl.reduce((s, f) => s + (num(f.ml) || 0), 0)}ml (회당 ${[...new Set(fl.map(f => f.ml))].join('/')}ml)`);
  const pt = L.filter(l => l.type === 'potty');

  const url = URL.createObjectURL(file);

    const img = await new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = url; });

    const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, N, N);

}

const TASK_TYPES = [[/급여|밥|사료|강급|먹이/, 'feed'], [/약|투약|안약|연고|영양제/, 'med'], [/수액/, 'fluid'], [/소변|대변|배변|오줌|똥|화장실(?!\s?청소)/, 'potty'], [/체중|몸무게/, 'weight'], [/산책/, 'walk'], [/목욕|샴푸/, 'bath']];

    const h = new Date(e.t).getHours();
    const t = tasks.find(t => !done.has(t.id) && TASK_TYPES.some(([re, ty]) => ty === e.type && re.test(t.label)) && TASK_TIMES.every(([re, ok]) => !re.test(t.label) || ok(h)));
    if (t) { done.add(t.id); ids.push(t.id); }

}

  if (S.readOnly) return toast('보기 전용이라 저장할 수 없어요');
  const btn = document.querySelector('[data-act="p-save"]'); if (btn) btn.disabled = true;
  let n = 0;
  for (const e of P.entries) {
    const d = { ...e, by: S.me || null, petId: e.petId || S.pet?.id || null }; delete d.timeGuess; delete d.dateOnly; delete d.src; delete d.petName; delete d.vague;
    Object.keys(d).forEach(k => d[k] === undefined && delete d[k]);
    if (await write(() => backend.addLog(d))) n++; else break;
  }
  const k = today();
  for (const id of P.taskIds) { const cid = k + '_' + id; if (!S.checks.some(c => c.id === cid)) await write(() => backend.setCheck(cid, { date: k, taskId: id, by: S.me || null, t: Date.now() })); }
  const w = P.entries.filter(e => e.type === 'weight' && e.kg).sort((a, b) => a.t - b.t).pop();
  if (w && S.logs.some(l => l.type === 'weight' && l.t > w.t)) w.kg = null;
  if (w && w.kg && S.pet) { const np = petBase(); np.weightKg = w.kg; await write(() => putPet(np)); C = null; }
  if (n === P.entries.length) { S.parsed = null; S.draft = ''; toast(`${n}건 저장했어요`); }
  render(true);
}

// 복사: 카톡 안 브라우저 등 clipboard가 막힌 곳에서도 되게 옛 방식(execCommand)으로 한 번 더 시도
async function copyText(txt) {
  try { if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(txt); return true; } } catch (e) {}
  try {
    const ta = document.createElement('textarea'); ta.value = txt; ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;font-size:16px';
    document.body.appendChild(ta); ta.focus(); ta.select(); ta.setSelectionRange(0, txt.length);
    const ok = document.execCommand('copy'); ta.remove(); return ok;
  } catch (e) { return false; }
}
